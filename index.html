,"","","",""],["","","","","","","","",""],["","","","","","","","",""],["","","","","","","","",""],["","","","","","","","",""],["","","","","","","","",""],["","","","","","","","",""],["","","","","","","","",""],["","","","","","","","",""],["","","","","","","","",""]]},{"name":"선하증권(복합운송)","rows":[["海運實務 試驗問題 (선하증권-복합운송)","","","","","","",""],["","","","","","","",""],["번호","문제","보기","정답","","","",""],["1","다음에서 선하증권(Bill of Lading ; B/L)에 대한 설명으로 맞지 않는 것은?","① 증권에 명시된 화물수취증이다.\n② 운송의 법적 계약서이다.\n③ 운임계산서이다.\n④ 기명식 선하증권(Straight B/L)의 경우에는 선하증권의 소유자가 화물에 대한 권리를 갖는다.","③","","","",""],["2","다음에서 선하증권에 종류에 관해 설명한 것으로 적절하지 못한 것은?","① 무하자선하증권은 화물이 양호한 상태로 적재되어 증권면에 아무런 사고적요(remarks)가 없는 선하증권이다. \n② 수취선하증권은 수하인란에 수하인의 이름이 기재된 선하증권이다. \n③ 기명식선하증권은 수하인란에 수하인의 이름이 기재된 선하증권이다. \n④ 지시식선하증권은 수하인란에 특정 수하인명이 기재되지 않고 단순히\"to order\", \"to the order of xxBank\" 등으로 기재된 선하증권이다. ","②","","","",""],["3","다음에서 선하증권의 효력의 발생요건으로 거리가 먼 것은?","① 선하증권의 소지인이 선의로 취득하였을 것\n② 선하증권의 소지인가 해상운송인과의 운송관계일 것\n③ 선하증권의 기재사항은 선하증권의 소지인을 위한 것일 것\n④ 선하증권은 운송인과 계약당사자간의 채권적인 법률관계 일 것","④","","","",""],["4","다음 중 선하증권의 채권적 효력의 한계를 설명한 것으로 타당하지 않은 것은?","① 운송채권의 소멸시효인 1년이 지남으로서 그 효력을 상실한다.\n② 선하증권은 유통성보호를 위한  그 채권적인 효력은 인정되지 않는다. \n③ 운송물의 멸실, 훼손 또는 연착이 법정면책사유를 그 원인으로 할 경우 효력을 상실한다. \n④ 선하증권의 작성행위 자체가 사기 또는 강박 등의 숨은 흠이 있는 경우에는 무효이다.","②","","","",""],["5","다음 중 운송인이 운송물을 수령하고 선하증권을 정당하게 소지할 사람에게 인도하였을 때 발생되는 효력은?","① 채권적 효력       ② 상환적 효력\n③ 물권적 효력       ④ 환수적 효력","③","","","",""],["6","다음 중 선하증권의 기능을 올바르게 설명하고 있는 것은?","① 운송물에 관한 손해, 멸실, 훼손 또는 연착 손해의 경비를 대시 지불하는 것\n② 어음상의 권리의 담보로서 할인은행에 신탁적 양도 또는 질권의 목적으로 처분되는 것\n③ 송하인에 대하여 일정한 운임요율을 책정하여 계속적인 운송을 약정할 때 필요로 하는 결제수단\n④ 선박이나 적하의 가액과 운임의 반액과의 비율에 다른 운임을 지불하는 수단","②","","","",""],["7","다음에서 선하증권의 법적기능으로 적절하지 않은 것은?","① 권리증권          ② 운송계약의 증서\n③ 화물수령의 증서    ④ 손해방지의 증서","④","","","",""],["8","다음에서 선하증권이 증거증권으로의 기능을 증명하기 위해 갖추고 있어야 할 내용과 거리가 먼 것은?","① 운송계약의 성립과 내용         ② 운송조건\n③ 운송손해보험의 약관            ④ 운송인에 의한 운송물의 수령 및 선적","③","","","",""],["9","다음 중 선하증권의 효력에 해당하지 않는 것은?","① 운송물 인도 영수증        ② 운송계약성립의 증거\n③ 운송물 인도청구권 증서    ④ 적하목록에 의하여 작성한 공정증서","④","","","",""],["10","다음 중 선하증권의 법적 성질이 아닌 것은?","① 증거증권     ② 유가증권     ③ 보험증권         ④ 권원증권","③","","","",""],["11","선하증권은 기존의 운송계약상의 법률관계 또는 권리를 증권에 결합시키므로 운송인이 화물 선적을 위하여 수령또는 선적을 요하는 기능은?","① 요인증권성          ② 상환증권성\n③ 제시증권성          ④ 처분증권성","①","","","",""],["12","다음의 선하증권 종류에서 운송물의 선적의 뜻을 기재한 선하증권은?","① 무유보선하증권(Clean B/L)        ② 선적선하증권(Shipped B/L)\n③ 수령선하증권(Received B/L)       ④ 통선하증권(Through B/L)","②","","","",""],["13","다음 중 선하증권에 \"외관상 양호한 상태로\"(\"in apparent good order and condition\")이 표시된 증권은?","① 유유보선하증권(Foul B/L)  ② 복합운송선하증권(Multimodal Transport B/L)\n③ 무유보선하증권(Clean B/L) ④ 수령선하증권(Received B/L)","①","","","",""],["14","다음 중 해상화물운송장(Sea-waybill)을 설명한 것으로 적합하지 않은 것은?","① 해상화물운송장은 유통성을 가지고 있다.\n② 새롭게 항공화물운송장 처럼 선하증권을 대신할 수 있다. \n③ 해상화물운송장은 운송화물의 인도에 제시가 필요치 않다. \n④ 해상화물운송장은 운송화물의 인도에 환수가 필요치 않다. ","①","","","",""],["15","다음 중 선하증권의 형식에 따른 분류로 해당되지 않는 것은?","① Red B/L   ② Short form B/L  ③ Long form B/L      ④ Negotiable B/L","④","","","",""],["16","다음 중 선하증권의 수하인란에 \"ORDER…\"라는 문구가 포함되어 있는 선하증권은?","① 기명식 선하증권(Straight B/L)        ② 선적선하증권(Shipped B/L)\n③ 지시식 선하증권(Order B/L)          ④ 통선하증권(Through B/L)","③","","","",""],["17","다음 중 선화증권(B/L)의 종류에 관한 설명중 틀린 것은?","① 화물의 인수시점에 따라 Shipped B/L과 Received B/L이 있다.\n② 화물의 상태를 기준으로 Clean B/L과 Stale B/L이 있다.\n③ 수화인을 지명하는 방식에 따라 Straight B/L과 Order B/L이 있다.\n④ 이면약관이 전부 인쇄되어 있는 Long Form B/L과 그렇지 않은 Short Form B/L이 있다.","②","","","",""],["18","선하증권은 운송책임구간에 의해서도 분류될 수 있는데 이에 해당되지 않는 선하증권은?","① 해양선하증권(Ocean B/L)       ② 복합운송증권(Multimodal Transport B/L)\n③ 용선계약부 선하증권(Charter Party B/L)  ④ 내국선하증권(Domestic B/L)","③","","","",""],["19","다음에서 NOVCC의 화물을 커버하는 선사의 선하증권을 무엇이라고 하는가?","① Charter Party B/L               ② Groupage B/L\n③ Stable B/L                      ④ EXPRESS B/L","②","","","",""],["20","화물이 다른 지역에 위치한 2개 이상의 선적항에서 선적되었지만 하나의 선하증권으로 이를 커버하여 발행된 B/L은? ","① Charter Party B/L               ② Groupage B/L\n③ Hitchment B/L                  ④ EXPRESS B/L","③","","","",""],["21","다음은 선하증권의 발행시기에 대한 설명으로 적합하지 않은 것은?","① 선하증권의 발행은 수령선하증권주의에 준거한다. \n② 하주(용선자 또는 송하인)으로 부터 운송물을 수령한 후에 발행된다. \n③ 하주의 청구에 의하여 발행된다. \n④ 수하인의 청구에 의하여 발행된다. ","④","","","",""],["22","다음에서 수하인(Consignee)의 의무가 아닌 것은?","① 화물수령의무       ② 화물과 OBL상환의무   ③ 선하증권발행의무   ④ 운임의 지급의무","③","","","",""],["23","다음에서 송하인(Shipper)의 법적의무로 타당하지 않은 것은?","① 운임의 지급의무                        ② 운송에 필요한 각종서류의 제출의무\n③ 화물명세의 제공과 그 정확성 담보 의무   ④ 목적지에서 화물을 인도받고 OBL 상환의무","④","","","",""],["24","선화증권상의 기재사항에서 화물명세에 해당되지 않는 사항은?","① 화물의 종류                ② 화물의 손해보험률                                             ③ 화물의 중량 또는 용적      ④ 포장의 종별 및 개수와 기호","②","","","",""],["25","다음 중 선하증권과 보험증권을 겸하는 증권은 어느 것인가 ?","① 화물수령증         ② 적선하증권    ③ 유보선하증권       ④ 선적선하증권","③","","","",""],["26","다음에서 운송인의 의무, 책임의 개시 장소를 말하는 것은?","① Place of Loading             ② Place of Discharge                                                   ③ Place of Receipt             ④ Place of Delivery","③","","","",""],["27","다음에서 선하증권의 법정기재사항으로 해당되지 않는 것은?","① 선박과 운송물의 명세 및 외관상태    ② 용선자, 송하인, 수하인의 명칭\n③ 손해보험회사명             ④ 선하증권의 발행지와 그 발행년월일 및 통수","③","","","",""],["28","다음 중 선화증권통일조약에서 해상운송인의 면책대상으로 인정하고 있지 않은 해상손해는?","① 포장불충분에 의한 손해        \n② 화물고유의 성질에 의한 손해\n③ 선장이나 선원의 항해과실로 인한 손해  \n④ 화물의 선적, 적부, 보관, 인도 등에 관한 상업과실에 기인하는 손해","④","","","",""],["29","다음 중 운송인에 의해 화물이 인도되는 장소는?","① Place of Loading             ② Place of Discharge                                                   ③ Place of Receipt             ④ Place of Delivery","④","","","",""],["30","다음 중 할증료(surcharge)의 종류가 아닌 것은?","① 유류할증료(BFS)      ② 통화할증료(CAF)                                                             ③ Suez surcharge       ④ 체선료(demurrage)","④","","","",""],["31","B/L상에 Freight Collect로 되어 있으면 다음 중 어떠한 정형거래조건을 선택한 \n경우인가?","① CIF    ② EXW   ③ CIP    ④ FOB","④","","","",""],["32","선하증권에 기재되는 운송인의 운송행위에 대한 보수로서 운임이 아닌 것은?","① 기본운임(basic freight)           ② 할증료(surcharge)                                          ③ 기타요금(charge)                 ④ 보험료(insurance fee)","④","","","",""],["33","통상적인 선하증권 원본(OBL)의 발행통수는?","① 1통    ② 2통    ③ 3통    ④ 4통","③","","","",""],["34","다음에서 선하증권의 발행이 있는 운송물의 인도의 경우에 선하증권과 상환하지 않고 은행의 보증장도 없이 해상운송인이 수하인에게 운송물을 인도하는 편의인도 방법은 ?","① 보증도      ② 가인도      ③ 공탁인도       ④ 하도지시서에 의한 인도","②","","","",""],["35","여러통의 OBL이 발행된 경우, 각통의 효력으로 적합하지 못한 것은?","① 각통은 독립하여 선하증권의 효력을 가진다. \n② 수통의 OBL과 약정목적지외에서의 화물인도를 한다.\n③ 수통의 OBL중 1통과 상환으로 운송물을 인도한 경우 다른 OBL은 그 효력을 잃는다.\n④ 목적지에서 OBL 2통을 소지한 자는 화물의 인도를 청구할 수 있으며, 운송인은 인도를 거부하지 못한다.","④","","","",""],["36","선하증권의 기명날인권자 또는 서명권자는 다음 중 누구인가?","① 선장     ② 운송인 또는 그 대리인     ③ 선박임차인     ④ 선박관리인","②","","","",""],["37","다음에서 선하증권을 발행 할 수 없는 자는 누구인가?","① 선장     ② 선박서기     ③ 선박임차인    ④ 선박관리인","②","","","",""],["38","다음에서 선하증권의 물권적 효력의 발생요건을 설명한 것 중 관계가 먼 것은?","① 정당한 방법에 의한 선하증권의 양도이어야 한다. \n② 선하증권의 취득자 및 운송물의 취득자가 선의이어야 한다. \n③ 선하증권을 인도할 때 운송인이 운송물을 점유하고 있어야 한다. \n④ 선하증권의 양수인이 양도인에게 선하증권을 배서하고 교부한 때에는 화물이 현실적으로 존재하고 있어야 한다. ","④","","","",""],["39","다음 중 선하증권의 문언적 효력의 인정사유로서 타당하지 않은 것은?","① 영미의 금반언의 법리에서 유래되었다.                                                       ② 선하증권의 유통성을 보호하기 위함이다. \n③ 선박소유자를 우선적으로 보호하기 위함이다.                                                  ④ 선의의 선하증권 취득자를 보호하기 위함이다. ","③","","","",""],["40","다음에서 선하증권에서 채권적 효력이 미치는 당사자는?","① 선의의 B/L소지인과 운송인 사이           ② 운송인과 송하인사이\n③ 선의의 B/L소지인과 선박소유자사이        ④ 운송인과 선박임차인사이","①","","","",""],["41","다음 중 항공화물운송장(Airway bill)과 선화증권(Bill of Lading)의 차이점을 비교한 것 중 틀린 것은?","① 항공화물운송장 - 유가증권이 아닌 단순한 화물수취증\n   선화증권 - 유가증권 \n② 항공화물운송장 - 기명식으로 발행되고 배서, 교부에 의해 양도가능 \n   선화증권 - 지시식 또는 소지인식으로 발행되고 양도가능\n③ 항공화물운송장 - 창고에 반입되면 AWB 발행 \n   선화증권 - 선적후 선적선화증권 발행(원칙)\n④ 항공화물운송장 - 항공사나 항공사 대리인이 보통 발행\n   선화증권 - 운송인(선박회사)이 작성","②","","","",""],["42","다음에서 선하증권약관의 유효요건으로 해당되지 않는 것은?","① 약관을 명시할 것                                                                              ② 강행법규에 위반되지 않을 것\n③ 사법상 일반원칙에 위반되지 않을 것                                                                   ④ 선하증권과 운송계약에 대한 책임만을 기재할 것","④","","","",""],["43","다음 중 선하증권의 약관은 강행법규에 위반되지 안하야 한다는 내용을 설명한 것으로 적절하지 않은 것은?","① 운송인의 법정면책사유 이외의 면책특약금지\n② 운송인의 법정의무를 경감시킬 수 있는 약관일 것\n③ 운송인의 법정책임을 경감하는 약관이 아니어야 할 것\n④ 화주의 권한을 이유없이 박탈 또는 제한하지 않을 것","②","","","",""],["44","선하증권에 의한 운송의 경우 누가 정당한 수하인인가?","① 용선자         ② 송하인       ③ 중개인         ④ 적정하게 배서된 OBL소지인","④","","","",""],["45","선하증권이 발행되지 않은 경우 예를 들어 SWB에 의한 운송의 경우 누가 정당한 수하인인가?","① 용선자                          ② 당해운송계약상 수하인으로 지정된 자\n③ 법원의 제권판결을 받은자         ④ 적정하게 배서된 OBL소지인","②","","","",""],["46","다음에서 B/L의 임의기재사항으로 적당하지 않은 것은?","① 항해번호       ② 통지처      ③ 화물의 중량    ④ 면책약관","③","","","",""],["47","다음 중 컨테이너의 화물을 혼재하거나 수입물품을 분배하기 이한 장소를 B/L상 어떻게 표시 되는가?","① B.A.F         ② C.F.S         ③ C.A.F         ④ L.C.L","②","","","",""],["48","다음에서 선하증권의 종류와 관련한 다음 기술 중 부적절한 것은?","① Straight B/L은 주로 L/C.방식 거래일 경우 교부받게 된다\n② Surrender B/L은 Original B/L없이 수입자로 하여금 화물인을 가능케 한다.\n③ Stale B/L은 주로 BWT(Bonded Warehouse Transaction)시 많이 이용된다.\n④ 선적당시 화물의 포장상태나 수량 등에 어떤 결함 또는 이상이 발견되었을 경우 Clean B/L을 박기 위해서는 선사에 L/I(Letter of Indemnity)를 제출해야 한다.","①","","","",""],["49","B/L에서 Ocean Vessel은 무엇을 기재하는 것인가?","① 송하인의 성명 ② 수입상의 상호  ③ 해상운송 선박명  ④ 화물을 선적하는 항구명","③","","","",""],["50","다음 중 해상운송계약의 당사자가 아닌 자는?","① 해상운송인         ② 수하인       ③ 송하인             ④ 용선자","②","","","",""],["51","다음 중 B/L 기재사항에서 Carrier Name과 관련된 사항으로 옳지 않은 것은?","① B/L 발행권자의 Signature가 표시된다. \n② B/L 발행권자는 은행에 Signature를 등록하여야 한다. \n③ B/L 발행권자가 Signature를 수정할 경우 재발급이나 Ccorrection 도장을 날인 후 Signature 해야 한다. \n④ 중량 및 용적 등 상품의 가격에 영향을 미치지 않는 부분일지라도 Correction 도장을 날인한 후 Signature를 해야 유효하다. ","④","","","",""],["52","선하증권 기재사항 중에서 Flag란 무엇을 의미하는 가?","① Container에 적재된 화물에 봉인을 한 Seal No.를 말한다\n② 화물이 적재되는 Container No.를 표기하는 것을 말한다. \n③ 선박의 등록국적을 나타내고 이는 해상사고 시 국제적인 관례인 기국주의에 의한다. \n④ 운송인이 책임지고 운송하여 수하인에게 인도하여 주는 장소를 명기하는 것을 말한다.","③","","","",""],["53","다음 중 선하증권에서 기명지시식의 예로 옳은 것은?","① “Mr.** or Order\"로 표시하는 것.      ② “To Order of Mr.**\"으로 표시하는 것.\n③ “To Order\"로만 표시하는 것.         ④ ”Mr.** 로 표시하는 것.","②","","","",""],["54","선하증권의 임의기재사항에서 면책조항으로 거리가 먼 것은?","① 이로조항(Deviation Clause)               ② 부지조항(Unknown Clause)\n③ 공동해손조항(General Average Clause)     ④ 물품명세(Description of Commodity)","④","","","",""],["55","이명, 재산, 혹은 선박구조, 피난, 연료 등 필수품을 적재하기 위하여 예정항로 이회의 기항이 면책되는 조항은 무엇인가?","① 이로조항(Deviation Clause)               ② 부지조항(Unknown Clause)\n③ 공동해손조항(General Average Clause)     ④ 고가품조항(Valuable Goods Clause)","①","","","",""],["56","본선이 자사선에 의해 구조되었더라도 타사선에 구조된 것과 같이 선주는 구조비를 자사의 화주에게 청구할 수 있다는 내용의 조항은?","① 잠재하자 조항(Latent defact Clause)       ② 누제이슨조항(New Jason Clause)\n③ 공동해손조항(General Average Clause)     ④ 위험품조항(Dangerous Goods Clause)","②","","","",""],["57","다음에서 선박저당권의 목적으로 될 수 없는 선박은 어느 것인가?","① 선박의 속구   ② 20톤 미만의 선박    ③ 건조중의 선박      ④ 선박공유지분","②","","","",""],["58","다음 중 중계무역에 사용되는 B/L로서 Switch라는 문언이 기재되어 있는 선하증권은?","① 용선계약부 선하증권(Charter Party B/L)    ② 환적 선하증권(Transhipment B/L) \n③ 스위치선하증권(Switch B/L)               ④ 약식선하증권(Short From B/L)","③","","","",""],["59","B/L의 도착항란에 \"Busan option Masan\"이라고 기재하고 수하인이 이중 하나를 선택할 수 잇게 한 B/L은?","① 목적지 선하증권(Deatination B/L)          ② 해양선회증권(Ocean B/L) \n③ 이중목적 선하증권(Dual Purpose B/L)      ④ 선택 선하증권(Optional B/L)","④","","","",""],["60","다음에서 해상물건운송인의 권리로서 타당하지 않은 것은?","① 적하유치권      ② 운임청구권     ③ 정박료청구권    ④ 선하증권 교부청구권","④","","","",""],["61","선하증권의 경제적효용에 관해 설명한 것과 관계가 적은 것은?","① 무역화폐의 역할로 무역상품대금의 결제수단이다. \n② 선하증권기재의 물품(대금)에 대한 담보수단이다. \n③ 선하증권으로 인해 운송중의 화물의 전매는 불가능하게 한다. \n④ 무역거래에 의한 무역조건에 따라 서류에 의한 거래를 가능하게 한다. ","③","","","",""],["62","다음에서 기명식선하증권(Straight B/L)의 특성과 상관이 없는 것은?","① 수하인 란에 특정인의 명칭(회사명 또는 성명)이 기재된 B/L\n② 대부분 국가에서 기명식선하증권은 Non-negotiable증권으로 규정\n③ 우리 상법은 기명식인 경우에도 특별히 배서금지표시가 없는 한 배서에 의해 양도 가능\n④ “ORDER...”라는 문구가 포함되어 있거 유통이 가능한 B/L","④","","","",""],["63","신용장상에 「Shipment to be effected by JG Shipping Co.」라고 명시되어 있는 경우 다음 설명중 옳은 것은?","① 수입자로부터 별도의 허가를 받아 수출자가 JG해운의 선박을 수배하여 물품을 선적한다.\n② 수출자는 매입은행에 매입의뢰시 JG해운이 발생한 선하증권을 제시하여야 한다.\n③ 수입자가 JG해운으로부터 선하증권을 발급받아 수출자에게 교부한다.\n④ JG해운은 수입자의 운송대리인이나, 운임은 수출자가 부담한다.","②","","","",""],["64","다음 중 운송구간(선적항 및 양륙항)이 동일 국가인 경우의 B/L은? ","① 내국선하증권 (Local B/L  )     ② 적색 선하증권(Red B/L)\n③ 선적선하증권(Shipped B/L)      ④ 통선하증권 (Through B/L)","①","","","",""],["65","B/L상 송하인으로 기재되는 것은 신용장상의 수익자가 일반적이지만 수익자 이외의 제3자를 송하인으로 허용하는 이유는?","① 수입자가 수익자로 부터 물품을 조달 받기위한 경우\n② 신용장에 구체적인 명시를 확실하게 하기 위한 경우\n③ 신용장발행 의뢰인이 물품의 실매도인을 수입자에게 알리고 싶지 않을 경우\n④ 수하인에게 신속하게 화물의 인도가 이루어 질 수 있도록 제도화 한 경우","③","","","",""],["66","다음에서 FIATA 복합운송 선하증권 표준약관 (1992)의 내용과 다른 것은?","① 포워더의 물품에 대한 책임기간은 포워더가 물품을 인수한때부터 물품을 인도할 때까지이다.\n② 복합운송 선하증권이라 할지라도 이 약관은 단일 운송수단만이 사용된 경우에도 똑같이 적용된다.\n③ 화주는 위험품의 경우 포워더가 물품을 인수하기 전에 화물의 정확한 성질을 서면으로 통지해야 한다.\n④ 물품이 인도되어야 할 날 또는 인도되지 않아 멸실된 것으로 간주권한을 갖는 날로부터 1년 이내에 소송이 제기되지 않으면 포워더는 모든 책임으로 면제된다.","④","","","",""],["67","다음에서 B/L 화물 전량이 On Dock 터미널에서 인수 또는 반입된 시점을 말하는 것은?","① LCL    ② FCL    ③ CFS    ④ OBL","②","","","",""],["68","우리나라 관행 상 화물의 수취와 선박이 접안 후 발해하는 B/L은 다음 중 어느 것인가?","① 수령선하증권     ② 용선계약부선하증권      ③ 선적선하증권     ④ 통선하증권  ","③","","","",""],["69","다음 중 B/L 상 운임 및 요금 적용 시 중요 준수사항과 관계가 없는 것은?","① 미국발착 화물의 경우는 FMC에 신고 ․ 발효 중인 S/C 또는 공표한 Tariff 운임을 적용하여야 한다. \n② 선하증권에 기재된 화물전량이 운송인에 의해 수취된 날에 유효한 S/C 또는 Tariff 운임을 적용하여야 한다.\n③ Minimum B/L Charge가 있는 경우, 실재 화물량(CBM 또는 Kilo ton)에 대해 산정한 운임이 Minimum Charge보다 작은 경우는 Minimum B/L Charge를 적용한다. \n④ 송하인이 화물의 가액을 신고하여 이를 B/L에 기재하는 경우는 종가요금(ad valorem charge)을 적용하지 말아야 한다.","④","","","",""],["70","다음 중 미국을 발착(發着)하는 화물에 대한 운임적용관려 주요사항으로 적합하지 않은 것은?","① 미연방해사위원회(FMC)에 신고한 S/C 운임의 적용하여야 한다. \n② 일반에 공표한 TARIFF 운임의 적용하여야 한다. \n③ 만약 어떤 품목에 대한 S/C운임이 표정Tariff의 운임보다 높을 경우는 Tariff운임을 적용할 수 없다고 S/C로 약정한다.  \n④ S/C에 의거 화물운송이 이루어지면 B/L에는 S/C로 약정한 운임을 적용 ․ 표기하고 그대로 징수하여야 한다","③","","","",""],["71","다음에서 U.S. Shipping Act을 기준으로 운임의 오적용과 벌칙내용을 설명한 것 중 알맞게 짝지어 진 것은?","① 고의적이 아닌 경우 : 위반 건(B/L)당 USD 10,000 이하의 벌금\n② 고의적인 경우 : 위반 건(B/L)당 USD 25,000 이하의 벌금\n③ 추가벌칙 : FMC는 벌금 + 6개월 이내에서 Tariff 정지 가능\n④ Tariff가 정지된 후 화물운송 : 건당 USD 25,000이하의 벌금","②","","","",""],["72","항해용선계약에서 화물량보다 실제 h B/L","④","","","",""],["83","선하증권이 오기된 경우의 실무적 정정방법과 사후처리를 설명한 것 중 올바르지 않는 것은?","① 선하증권상의 원 기재가  오기라는 사실의 확인된 경우는 증빙할 수 있는 서류를 대조하여 사실을 확인하고 정정하여야 한다. \n② 선하증권상의 통지처에게도 당해 운송에 관한 정확한 정보를 통지하지 않아도 된다. \n③ 출항지 세관에 이미 제출한  적하목록의 정정절차를 취한다\n④ 목적지의 운송인사무소에 동 정정사실을 통보하여 사실과 부합되는 적하목록이 해당 세관에 제출되도록 한다.","②","","","","                                                                                                                                                                               "],["84","다음 주어진 선하증권의 법정기재사항에서 수출입 실적의 기준이 되는 것은 무엇인가?","① 운송품의 종류(Description)   ② 중량 및 용적(Weight or Measurement)   \n③ 운송품의 기호(Marks)       ④ 포장의 종류 및 개수(Package and Number)","②","","","",""],["85","선하증권의 전자화와 관련한 설명이다. 거리가 먼 것은?","① Trade Card는 전자선하증권 서비스를 세계 최초로 제공하였다.\n② 전자선하증권은 어떤 선하증권의 종류가 아니라 현행 B/L이 갖는 기능을 전자적\n방법으로 운영하려는 일련의 시스템을 말한다.\n③ Bolero는 전자선하증권 유통을 위해 Rule Book을 활용한다.\n④ 전자선하증권에 관한 CMI 통일규칙(CMI Rules for Electronic Bill of Lading)이 제정되었다.","①","","","",""],["86","FCL화물을 운송할 경우 운송인의 면책조항으로 통상 선화증권의 물품명세란에 삽입되는 조항은?","① More or Less Clause  ② Unknown Clause\n③ Force Majeure Clause  ④ Arbitration Clause","②","","","",""],["87","선하증권의 법적 의미로서 맞지 않는 것은?","① 권리증권    ② 영수증    ③ 운임표    ④ 계약증서","③","","","",""],["88","다음의 Stable B/L과 관련된 설명 중 적합하지 않은 것은?","① 선하증권의 어떤 형태를 말하는 것은 아니다. \n② B/L의 제시시기가 필요이상으로 지연되었을 때 지연된 선하증권을 의미한다. \n③ 신용장에 선적일 이후 서류를 제시하여야 할 기한을 규정하지 않는한 선적일 이후 20일 이내에 제시하여야 한다. \n④ 신용장에 \"Stable B/L acceptable\"이란 문언이 없으면 B/L 발행일자 이후 21일 경과한 것은 수리를 할 수 없다. ","③","","","",""],["89","선하증권을 재발급을 요청사유와 요청자에 관한 설명 중 적당하지 않은 것은?","① 송하인이 OBL을 은행에 네고하기 전에 분실한  경우 - 송화인\n② 송하인이 네고한 후 그 네고은행과 신용장개설은행간에 우송 중 분실한 경우 - 송화인\n③ 수하인이 네고은행과 신용장개설은행 간에 우송 중 분실한 경우 - 수하인  \n④ 수하인이 개설은행으로부터 신용장 대금을 지급하고 OBL을 취득한 이후 그것을 소지하고 있던 자가 분실 한 경우 - 수하인","③","","","",""],["90","다음에서 선하증권의 실무상의 문제점으로 언급되는 사항으로 타당하지 않은 것은?","① 선하증권이 화물보다 늦게 도착하는 문제    ② 선하증권의 보증도 문제\n③ 선하증권원본의 문제                      ④ 선하증권의 유통성문제","④","","","",""],["91","다음 중 선하증권원본의 분실문제에 대한 설명으로 타당하지 않은 것은?","① 비용과 위험 부담 \ "②","","","",""],["114","다음 중 컨테이너 외부에 표시되는 항목이 아닌 것은?","① 소유자의 기호 및 번호   ② 최대총중량   ③ 적재선박의 이름  ④ 소유자의 국적명","③","","","",""],["115","다음 중 B/L을 분할하여 수입신고 할 수 있는 경우가 아닌 것은?","① 일괄사후납부 적용, 비적용물품을 구분하여 신고하자고 하는 경우\n② 신고물품중 일부가 통관이 보류된 경우\n③ 검사, 검역결과 전 물품에 대하여 합격된 경우\n④ B/L을 분할하여도 물품검사 및 과세가격 산출에 어려움이 없는 경우","③","","","",""],["116","다음에서 컨테이너 터미널의 기본적인 기능과 관계가 없는 것은?","① 하역기능      ② 혼재기능       ③ 보관기능      ④ 포장기능","④","","","",""],["117","다음 컨테이너 운송과정에서 보관기능과 관련이 없는 것은?","① 컨테이너 야드      ② 에이프런      ③ 내륙 컨테이너 기지      ④ 마샬링 야드","②","","","",""],["118","다음 중 국제 운송의 목표에 대하여 에 대하여 서술한 것 중 그 내용이 부적합 한 것?","① 국제간 물적이동을 효율적으로 추진하여 재화의 소비 효용을 증대\n② 화물운송이 저렴한 비용으로 결정하여 수입지에서 가격 경쟁력을 유지\n③ 안정하고 정확하게 운송되어 수입상이 당해 수입화물의 처분이 용이\n④ 운송의 독점성이 중요하므로 운송인의 전횡으로 면책이 불 필요","④","","","",""],["119","국제 무역거래에서 해상운송과 함께 도로, 철도, 하천, 호수를 이용한 운송의 형태는 다음 중 어느 것인가?","① 내륙운송       ② 해상운송         ③ 항공운송       ④ 복합운송","①","","","",""],["120","1960년대 들어 국제간 교역량이 확대되어 적어도 두가지 이상의 운송수단에 의하여 물품을 운송하기 위한 단일계약에 의해 이루어지는 물품운송은?","① 내륙운송       ② 해상운송         ③ 항공운송       ④ 복합운송","④","","","",""],["121","다음 중 복합운송의 요건과 거리가 먼 것은?","① 단일운송계약과 단일 책임(uniform liability)\n② 일괄운임(through rate)의 적용\n③ 복합운송증권(multimodel trasnport document:MTD)의 발행\n④ 단일화 된 운송수단(Single modes of transport)의 이용","④","","","",""],["122","다음의 운송형태 중에서 Land Bridge방식을 이용하고 있는 것은?","① 해공복합운송    ② 해상운송       ③ 해륙복합운송    ④ 항공운송","③","","","",""],["123","해공복합운송에 대한 설명 중 적합하지 않은 것은?","① 해상운송이 가지는 저운임과 항공운송이 갖는 신속성을 효과적으로 결합\n② 일반적인 항로는 일본과 북미서해안간의 태평양해상에서는 해상운송을 이용하고, 미국내륙 및 미국과 유럽간에는 항공운송을 이용\n③ 대륙과 해상을 잇는 교량역할을 하는 land bridge 방식으로 이용\n④ 운송일수가 대폭 단축되며, 항공운송만 이용하는 경우에 비해 소요운임이 적게드는 이점","③","","","",""],["124","복합운송에서 일관운임(Through rate)의 설정에 대한 설명으로 타당하지 않은 것은?","① 복합운송의 서비스 대가로 각 운송구간마다 분할된 운임을 설정해야 한다. \n② 운송구간에 대한 책임이 복합운송인에게 집중되어 있으므로 이에 대한 반대 급부도 하나로 통합되어야 한다. \n③ 복합운송의 서비스 대가로 전 운송구간의 단일화된 운임을 설정하여야 한다. \n④ 일관운임의 산출은 단순 합산이 아닌 Scale merit(규모의 경제)가 반영되어 산출하여 합리적인 요율을 제시할 수 있다. ","①","","","",""],["125","화주에 대해 운송계약의 체결자인 복합운송인이 전 운송구간에 대한 책임을 지지만, 그 책임은 운송구간 고유의 원칙에 의하는 체계는 다음 중 어느 것인가?","① 단일책임체계(Uniform Liability System)        \n② 이종책임체계(Network Liabilty System)\n③ 변형단일책임체계(Modified Liability System)    \n④ 단일운송인책임체계(Single Carrier\u0027s Liability System)","②","","","",""],["126","Land Bridge의 목적으로 적당하지 않은 것은?","① 운송비용의 절감\n② 전체 소요시간의 감소\n③ 주요 내륙운송망에 탁월한 접근성을 가진 소수의 항만에 화물량을 집중\n④ 해상-육상-해상으로 이어지는 운송구간으로 해상운송구간을 집중하기 위한 운송 증감","④","","","",""],["127","Land Bridge의 특징을 서술한 것으로 적합하지 않은 것은?","① 단일운송수단의 통제와 책임                    ② 단일 선하증권\n③ Sea-Land-Sea 방식을 통한 복합운송의 형태      ④ 해공복합운송의 한 형태","④","","","",""],["128","시베리아를 육상가교로 하여 한국, 일본, 극동, 동남아, 호주 등과 유럽대륙, 스칸디나비아반도를 연결하는 복합운송형태는?","① ALB(American Land Bridge)      ② CTB(Canadian Land Bridge)\n③ SLB(Siberian Land Bridge)        ④ MLB(Mini Land Bridge)","③","","","",""],["129","SLB(Siberian Land Bridge)의 특성을 설명한 것 중 거리가 먼 것은?","① SLB의 운영주체는 TSR(Trans Siberian Railway)이다. \n② 1971년 부터 본격 개시되어 한국, 대만, 홍콩, 필리핀, 호주, 뉴질랜드까지 집하지역이 확대되었다. \n③ 부산~보스토치니(Vostochny)간을 컨테이너선으로 해상운송한 후 시베리아 철도의 컨테이너전용열자(block train)으로 러시아의 유럽국경까지 운송한 후 유럽의 철도, 트럭, 선박을 이용하는 복합일관운송한다. \n④ 1979년 일본의 포워더에 의해서 개발된 운송루트이다. ","④","","","",""],["130","부산에서 로테르담간 루트별 B26수송거리를 비교한 것 중 사실과 관계가 먼 것은?","① 시베리아(Siberia) 철도 경유 ~ 13,000㎞\n② 수에즈(Swez)운하 경유 - 20,000㎞\n③ 케이프타운(Cape Town) 경유 ~ 27,000㎞\n④ 피나마(Panama) 경유 ~ 23,000㎞","②","","","",""],["131","IPI(Interior Point Internmodal)의 특징을 설명한 것 중 해당사실이 아닌 것은?","① 선사 자신이 내륙까지의 B/.L을 발급한다. \n② 최근에는 화주운전(door)까지 운송을 수배하는 Store Delivery Service도 성행한다. \n③ 최종목적지로의 인도까지 모두 선사가 수배한다. \n④ Port to Port의 운송서비스를 말한다. ","④","","","",""],["132","1964년에 Air Canda가 개발한 최초의 해공복합운송 루트는 다음 중 어느 것인가?","① 러시아 경유 해공복합운송          ② 북미서안 경유 해공복합운송\n③ 동남아시아 경유 해공복합운송       ④ 동유럽 해공복합운송","②","","","",""],["133","이종 및 동종 수송수단을 조합하여 수송하는 운송인은?","① 송화인          ② 수화인         ③ 중개인          ④ 복합운송인","④","","","",""],["134","다음 중 복합운송인(Multimodal Transport Operator: MTO)에 대한 설명으로 적합하지 않은 것은?","① 전체의 운송계약구간에 대하여 운송인으로서의 지위에서 복합운송증권을 발행한다. \n② 운송의 전과정에서 발생한 손해에 대한 책임이 집중된다. \n③ 반드시 대리인을 통해서 운송계약을 체졀한 계약당사자이어야만 한다. \n④ 운송에 참가하는 구간운송인은 복합운송인의 이행보조자의 관계이다. ","③","","","",""],["135","우리나라의 복합운송인에 대한 설명으로 적합하지 않은 것은?","① 운송인 기능을 수행하기 때문에 실제 운송인과 똑같은 운송책임을 부담한다. \n② 운송 책임 부보에 대한 증거문서인 복합운송증권(CTD)을 발행한다. \n③ 모두 FIATA B/L을 발행한다. \n④ 단순포워딩과 복합운송이 엄격히 분리되어 있어서 영업적 지위가 다르다. ","④","","","",""],["136","복합운송인의 요건에 대하여 설명한 것으로 적당하지 않은 요건은 다음 중 어느 것인가?","① 운송책임의 단일성       ② 여러 개의 계약으로 다수의 구간운송 행위를 실행\n③ 복합운송증권의 발행     ④ 일관운임의 설정","②","","","",""],["137","복합운송이 되기 위해서 복합운송인이 화주에 대해서 유가증권으로 복합운송증권을 발행하는 이유는?","① 법적으로 운송책임을 단일화 시키기 위함\n② 운송책임의 다양성과 표리의 관례를 위함\n③ 구간별 운송의 책임을 송화인과 함께 분담하기 위함\n④ 전체운송기간을 단축하기 위함","①","","","",""],["138","복합운송의 유형 중 운송수단을 직접보유하지 않았지만 운송주체의 제반기능과 책임, 의무를 수행하는 일종의 계약운송인은?","① 캐리어형 복합운송인(Carrier operator)                       \n② 포워더향 복합운송인\n③ NVOCC(Non Vessel Operation Common Carrier)형 복합운송인  \n④ 해상운송인(Ocean Common Carrier)","②","","","",""],["139","이종책임체계(Network Liability System)에서 각 운송구간 고유의 원칙에 따른 책임규칙으로 적합하지 않은 것은?","① 해상운송구간 - 헤이그규칙(Hague Rules) \n② 항공운송구간 - 바르샤바조약(Warsaw Convention)\n③ 도로운송구간 - 도로화물운송조약(CMR) 또는 각국의 일반화물 자동차 운송약관\n④ 철도운송구간 - 에이그-비스비규칙(Hahue-Visby Rules)","④","","","",""],["140","복합운송의 Modified Uniform Liability System(변형단일책임체제)를 채책한 국제조약규칙이 아닌 것은?","① 1978년 Harmburg Rules                ② 1956년 도로화물운송조약(CMR)\n③ 1992년 UNCTAD/ICC 복합운송증권규칙  ④ 1980년 UN국제복합 운송조약","②","","","",""],["141","복합운송에 대한 각 조약(규칙)뼐 책임한도액으로 적합하지 않은 것은?","① Hague-Visby Ruels(1968) - 30 포앙카레프랑 (약 US $2.00)\n② Hamburg Rules(1978) - 2.5 SDR (약 US $3.50)\n③ CMR(1956) - 50제미날 프랑 (약 US $ 16.00)\n④ UNCTAD/ICC(1992) - 2 SDR (약 US $2.80)","③","","","",""],["142","1980년 UN 국제복합운송조약상의 운송인의 책임내용으로 적합하지 않은 것은?","① 복합운송인의 책임은 과실책임주의에 의한다. \n② 복합운송인의 책임한도액은 손해 발생국간이 판명된 때는 국제법, 국제조약 또는 UN 조약상의 책임한도액이 가장 높은 금액으로 한다. \n③ 복합운송인의 책임한도는 이종책임제계에 의하지 않고 변형단일책임체계에 의한다. \n④ 복압운송인에 의한 물품의 수취지 또는 인도지의 어느 한 국각가 체약국이면 UN 조약이 강제적을 적용될 수 없다. ","④","","","",""],["143","복합운송인의 책임제한에 관한 설명으로 바람직하지 않은 것은?","① 멸실/훼손된 물품의 포장 당 666.67 SDR 또는 1㎏당 2 SDR 중 큰 금액으로 제한\n② 해상운송이나 내수로운송이 포함된 경우는 물품의 1㎏당 8.33 SDR로 제한\n③ 특정구간에서 책임이 발생되었을 때는 그 구간에 적용되는 국제조약 또는 해당국의 강행법이 정한 책임한도액에 따름\n④ 지연손해의 책임한도는 복합운송계약에 의한 운임을 초과하지 않는 금액으로 제한","②","","","",""],["144","인도지연의 경우 복합운송인의 책임한도액에 대하여 서술한 것으로 적합하지 않은 것은?","① 복합운송계약상의 운임총액을 상한으로 한다. \n② 지연된 운송물에 대하여 지급되는 운임의 2.5배에 상당하는 금액으로 제한한다. \n③ 1978년 Hamburg Rule을 따른다. \n④ 지연과 일부 멸실, 훼손이 같이 발생할 경우는 해당 운송물의 전손(total loss)의 경우에 인정되는 한도액을 10% 초과한다. ","④","","","",""],["145","1975년 ICC의 국제복합운송증권에 관한 통일규칙에서 복합운송인의 주요 면책사항을 규정한 내용과 거리가 먼 것은?","① 화주의 작위 또는 부작위로 기인한 손해 및 포장이나 기호의 오류 또는 불충분 등에 기인한 손해\n② 불가항력 및 동맹파업 등에 기인한 손해\n③ 운송물의 고유의 하자 등에 의한 손해\n④ 특정구간에서 멸실 또는 훼손에 의한 손해","④","","","",""],["146","다음 중 1992년 UNCTAD/ICC복합운송증권규칙에 대한 설명으로서 적합하지 않은 것은?","① 이 규칙을 복합운송계약에 삽입시키는 경우 이 규칙이 적용되며, 이경우 단일운송 또는 복합운송계약이냐에 관계없이 적용됨\n② 책임원칙은 변형단일책임체계을 원칙으로 함\n③ 인도지연에 따른 간접손해에 대해서는 운임의 2.5배 범위내에서 계상함\n④ 전손에 대한 책임한도액을 규정함","③","","","",""],["147","Freight Forwarder가 화주의 화물을 요구하는 목적지까지 안전하고 신속하게 운송하는데 이때 제공되는 서비스가 아닌 것은?","① 통관 및 입출고        ② 선적 및 운송\n③ 보험 및 운임료결정    ④ 집화 및 환적","③","","","",""],["148","영국에서 선사를 위해 선복판매를 하며 그들의 일부는 지금도 선적중개인으로 활동하는 이는?","① Forwarding Agent    ② Shipping Agent\n③ Insurance Agent      ④ Trading Agent","②","","","",""],["149","최초 유럽에서 원래 소량화물을 철도화차 단위의 화물량으로 집화나 분배를 하는 사업가를 말하는 던 것은?","① Forwarding Agent    ② Shipping Agent\n③ Insurance Agent      ④ Trading Agent","①","","","",""],["150","다음 중 Freight Forwarder에 대한 설명으로 적합하지 않은 것은?","① 화주의 대리인으로 적절한 운송수단을 선택한다. \n② 운송에 따르는 일체의 부대업무를 처리해준다. \n③ 집화, 분배, 혼재업무를 행하는 운송의 주체자로서의 기능을 지니고 있다. \n④ 독자적으로 영업망을 개설하거나 영업광고를 할 수 없다. ","④","","","",""],["151","Freight Forwarder의 업무 유형 중에서 복합운송인(MTO) 또는 무선박운송인(NVOCC)으로서 행동하는 유형은?","① Local 유형          ② International 유형\n③ Carrier 유형         ④ Deliverry 유형","③","","","",""],["152","다음 중 Freight Forwarder의 기능으로 적당하지 않은 것은?","① 운송계약의 체결 및 선복의 예약        ② 화물운송의 조언 및 관계서류의 작성  \n③ 화물의 집화, 분배, 혼재서비스 제공     ④ 화주를 대신하여 직접 통관수속을 제공","④","","","",""],["153","화주 측면에서 Freight Forwarder의 효용성을 설명한 것 중 거리가 먼 것은?","① 수출업차(송하인)는 비용, 시간, 인력 절감 등을 꾀할 수 있다. \n② 수입업자(수하인)는 화물수령에 필요한 서류의 작성 및 절차에 관한 서비스를 제공 받을 수 있다. \n③ 규모의 경제(Scale Merit)를 실형하여 그 이익을 수탁자인 화주가 수혜받로록 한다. \n④ 수출입업자가 스스로 수출입상뭄의 물류코스트를 파악하게 한다. ","④","","","",""],["154","미국의 Freight Forwarder는 그 종류에 따라 각기 다른 위원회의 규제를 받고 있는데 그 사실과 거리가 먼 것은?","① 국내운송주선인(Domestic Freight Forwarder) - 주제통상위원회(Interstate Commerce Commission)\n② 항공운송주선인(Air Frieght Forwarder) - 민간항공위원회(Civil Aeronautics Board)\n③ 해상운송주선인(Ocean Freight Forwarder) - 육해상운송위원회(Surface Transportation Board)\n④ 해상운송주선인(Ocean Freight Forwarder) - 연방해사위원회(Federal Maritime Commission)","③","","","",""],["155","미국의 국내운송주선인(Domestic Freight Forwarder)의 통상적인 업무내용과 거리가 먼 것은?","① 화물의 집화, 혼재, 분배, 배송업무를 수행하거나 준비\n② 수출품의 선적 또는 선적을 위한 선복예약\n③ 수령지부터 인도지까지 화물운송에 대한 책임\n④ 화물운송을 위하여 철도, 자동차, 수상운송수단을 이용하는 것","②","","","",""],["156","우리나라에 Forwarding 제도가 도입된 시기는 언제 인가?","① 1960년대 초     ② 1950년대 말      ③ 1970년대 초     ④ 1970년대 말","③","","","",""],["157","포워딩업체들이 해운항만청에 의해 해운운송주선업의 면허를 받아 영업을 시작한 년도는?","① 1972년          ② 1976년       ③ 1983년          ④ 1987년","②","","","",""],["158","우리나라에서 화물유통촉진법이 제정되어 복합운송주선업이 새로이 등장한 년도는?","① 1983년          ② 1987년       ③ 1991년          ④ 1993년","③","","","",""],["159","1993년 한국복합운송주선업협회(KMTA)가 어느 국제협회의 회원사로 등록함으로써 해상운송주선업체들과 마찬가지로 정식으로 FIATA B/L을 사용하게 되었는가?","① 국제복합운송협회(FIATA)    ② 국제상공회의소(ICC)\n③ 국제해운연맹(ISF)           ④ 국제해운회의소(ICS)","①","","","",""],["160","수출지의 Forwarder는 수출화주(Shipper, Seller, Consignor)로 부터 화물의 선적을 의뢰받게 되는데 이때 선적의뢰방법은?","① 신용장개설은행( L/C Opening Bank)     ② 선적요청서(Shipping Request)\n③ 전신환(Telegraphic Transfer)            ④ 화물인도지시서(Delivery Order)","②","","","",""],["161","선적이 완료되면 포워더는 화주에게 포워더 B/L 발행하며, 선사는 이때 포워더에게 어떤 B/L을 발행하는가?","① 통선하증권(Through B/L)               ② 선적선하증권(Shipped B/L)\n③ 통상선사선하증권(Ocean Carrier B/L)    ④ 수취선하증권(Received B/L)","③","","","",""],["162","다음 중 포워더가 발행하는 House B/L의 종류가 아닌 것은?","① 한국국제물류협회선하증권(KIFFA B/L)   ② 복합운송선하증권(FIATA B/L)\n③ 파트너 선하증권(Partner B/L)           ④ 기명식선하증권(Straight B/L)","④","","","",""],["163","다음 중 포워딩 업무가 서비스 단계의 구분에 알맞게 기술 된 것은?","① 포장 - 국내운송 - 적하보험 부보 - 통관 - 하역 - 창고 및 보관 - 혼재 - 선적 - 도착지 인도\n② 포장 - 국내운송 - 통관 - 적하보험 부보 - 하역 - 창고 및 보관 - 혼재 - 선적 - 도착지 인도\n③ 포장 - 국내운송 - 적하보험 부보 - 통관 - 창고 및 보관 - 하역 - 혼재 - 선적 - 도착지 인도\n④ 포장 - 국내운송 - 통관 - 적하보험 부보 - 창고 및 보관 - 하역 - 혼재 - 선적 - 도착지 인도","④","","","",""],["164","다음 중 복합운송 주선업의 등록요건을 서술한 것으로 거리가 먼 것은?","① 법인인 경우 자본금이 3억원 이상  \n② 화물집화창고 또는 컨테이너장치장을 소유하거나 이를 사용할 수 있는 계약을 체결 가능\n③ 1억원 이상의 보증보험에 가입\n④ 개인인 경우 자산 평가액이 5억원 이상","④","","","",""],["165","Forwarder가 하주를 대신해서 운송서류를 직접 작성하는데 이때 직접 작성하는 서류가 아닌 것은?","① 선복예약서(Shipping Request S/R)   ② 부두수취증(Dock Receipt D/R)\n③ 신용조회(Credit Inquiry)           ④ 선하증권(Bill of Lading)","③","","","",""],["166","한 사람의 Forwarder가 수입업자로 부터 위탁을 받아 다수의 수출업자로 부터 화물을 집화하여 컨테이너에 혼재하는 경우를 말하는 것은?","① Forwarder\u0027s Consolidation             ② Buyer\u0027s Consolidation\n③ Port Consolidation                    ④ Multi Consolidation","②","","","",""],["167","한사람의 Forwarder가 다수의 수출업자로 부터 화물을 혼재하여 혼재화물 목적지가 항만으로 되어 있는 형태는?","① Forwarder\u0027s Consolidation             ② Buyer\u0027s Consolidation\n③ Port Consolidation                    ④ Multi Consolidation","③","","","",""],["168","Forwrder가 업무형태에서 혼재(Consolidation)의 특성에 관해 적합하지 않은 것은?","① 소량화물(Less than Contanier Load; LCL)의 선적 용이\n② 과다한 도착지 국내운송료 부담\n③ Forwarder의 소량화물의 혼재이익을 취득\n④ 물량의 단위화로 하역 및 운송 취급상 용이","②","","","",""],["169","다음 중 주로 Buyer\u0027s Consolidation에 이용되는 운송구분은 다음 중 어느 것인가?","① CY/CY (FCL/FCL, Door/Door)    ② CFS/CY(LCL/FCL, Pier/Door)\n③ CFS/CFS(LCL/LCL, Pier/Pier)     ④ CY/CFS(FCL/LCL, Door/Pier)","②","","","",""],["170","다음 중 주로 Forwarder\u0027s Consolidation에이용되는 운송방법은 다음 중 어느 것인가?","① CY/CY (FCL/FCL, Door/Door)    ② CFS/CY(LCL/FCL, Pier/Door)\n③ CFS/CFS(LCL/LCL, Pier/Pier)     ④ CY/CFS(FCL/LCL, Door/Pier)","③","","","",""],["171","FCL(Full Container Load)의 경우 화주가 자신의 책임과 비용을 공장 또는 창고에서 화물을 컨테이너에 적입하게 되는데 이러한 vanning 형태를 말하는 것은?","① Shipper\u0027s Pack    ② Buyer\u0027s Pack\n③ Carrier\u0027s Pack    ④ Importer\u0027s Pack","①","","","",""],["172","다음 혼재업자(condolidator)의 임무를 설명한 것 중 적합하지 않은 것은?","① 화물의 생산일정 파악    ② 선적준비 완료된 화물의 혼재계획 수립\n③ 선적서류 작성 및 제출   ④ 국내운송료 및 선박운임료 결정","④","","","",""],["173","혼재화물(Consolidated Cargoes)의 경우 혼재된 화물의 내용, 순위 및 위치를 컨테이너별로 기재한 서류를 말하는 것은?","① Master(Ocea Carrier) B/L    ② Commercial Invoice\n③ Packing List               ④ Container Load Plan","④","","","",""],["174","대규모의 생산설비 및 건설기자재가 특정한 공사계획에 따라 일시 또는 지속적으로 운송될 경우 발생되는 화물의 취급업무를 지칭하는 것은?","① Co-Loading Service        ② Project Cargo Handling Service\n③ Consolidation Service       ④ Hanging Garment Handling Service","②","","","",""],["175","다음 중 ATA Carnet의 특성을 설명한 것 중 적합하지 않은 것은?","① 일시 수입이나 보세 운송에 있어 수입세 면제와 통관절차 간소화를 목적으로 발급되는 국제적 통관수첩이다. \n② ATA Carnet을 소지한 자가 협약 가입국에 일시반입이나 일시 수입을 위한 물품 통관시에는 세금을 지불하므로 일정기간내에 재반출할 필요가 없다. \n③ ATA Carnet 발급물품으로 2개국 이상 순회하고자 하는 경우 수출입신고서를 필요한 만큼 더 발급받으면 가능하다. \n④ ATA Carnet의 유효기간이 발급일로 부터 1년일 때 수출통관증서를 사용하며 수출신고시에는 동 증서를 수출신고서로 갈음한다. ","②","","","",""],["176","가죽 및 모피의류 등과 같은 고가의 의류수송 서비스 형태로 Cartib Box에 의한 운송 서비스를 말하는 것은?","① Co-Loading Service                 ② Project Cargo Handling Service\n③ Exhibition Cargo Handling Service     ④ Hanging Garment Handling Service","④","","","",""],["177","전시화물 취급서비스(Exhibition Cargo Handling Service)의 특징으로 적절하지 않은 것은?","① 포장의 중요성                       ② 비용절감\n③ 일시수입통관증서(ATA Carnet) 필요    ④ 왕복운송업무","②","","","",""],["178","Hanging 장치의 종류에서 Dead Space의 발생을 초래할 수 잇는 System으로 주로 가죽제품, 모피제품의 수송에 이용되는 것은?","① Rope System       ② Tag System\n③ Bar System        ④ Rack System","③","","","",""],["179","Sea \u0026 Air Service의 특성을 설명한 것 중 관계가 먼 것은?","① 해상운송의 저렴성(Ecnonomy of Seafreight)과 항공운송의 신속성(Speed of Aircargo)의 결합\n② 비용면에서 가장 효과적인 운송시간소요\n③ 전형적인 해륙복합운송형태의 서비스\n④ 화물 취급상의 문제점을 최소화 ","③","","","",""],["180","Sea \u0026 Air Service의 업무 취급 절차에 관하여 설명한 것 중 관련이 적은 것은?","① 출발지에서 최종 목적지까지 전구간을 MT(Mulimodel Transport) B/L 하나로 묶어 화주에게 발행\n② 선적지의 경우 선하증권(B/L)이 Forwarder에게 발행\n③ 도착지에서는 항공운송장(AWB)으로 항공사와 Forwarder간에 화물이 인도\n④ Forwarder는 중계지점(T/S Pinot)에 있는 파트너(대리점)과 도착지 대리점간의 화물운송 및 인수관련 업무처리 기준이 각각 달리 규정","④","","","",""],["181","국내무역업자나 해외수출업자를 대신하여 제3국에서 생산, 선적되어 우리나라를 경유하여 다시 제3국으로 운송되는 화물 서비스는?","① Transhipment Cargo Service             ② Sea \u0026 Air Cargo Service\n③ House Forwarding Service               ④ Bonded Warehouse Transaction Service","①","","","",""],["182","환적화물 취급 서비스에서 일시 양륙된 통과화물이 30일 이내에 반출하지 못할 경우는 행하여야 할 절차는?","① 화물 이적허가신청을 세관으로부터 허락을 받는다. \n② House B/L을 Forwarder가 세관에 신청한다.\n③ 통과화물반출기간연장신청서를 제출하여 세관장의 승인을 받는다. \n④ 재혼재작업신고서를 세관장에게 재출한다. ","③","","","",""],["183","통과화물의 적출(devanning) 실제수량과 관련하여 Forwarder가 중징계를 받는 경우는?","① 컨테이너에 적출시 세관원과 검수인 입회하에 작업을 진행하지 않고 CFS 실무자가 참관했을 경우\n② 적출실제수량이 신고된 수량과 상이할 경우\n③ Forwarder가 자신이 선호하는 CFS에서 컨테이너를 적출하고자 하는 경우\n④ 적출시 다른 물품이 발견되거나 고의적인 허위신고 사실이 인지된 경우","④","","","",""],["184","다음은 통과화물의 재혼재에 관한 사실및 절차를 기술한 것으로 관계가 적절하지 않은 것은?","① 일시양륙된 통과화물을 보세구역에서 재혼재하여 이적하고자 하는 경우 재혼재작업신고서를 세관장에게 제출한다. \n② 해당구역에 울타리를 치거나 황색선 등으로 구분표시를 하고 통과화물 재혼재 구역임을 알린다. \n③ 세관장은 통과화물에 대한 재혼재작업 신고가 있는 경우 세관공무원으로 하여금 당해 물품에 대한 작업상태를 확인하게 한다. \n④ 보세구역설영인은 재혼재하고자 하는 통과화물에 대한 관리대장을 비치하고 물품반출입사항 등을 기록관리한다. ","②","","","",""],["185","다음 중 House Forwarding Service의 목적으로 타당하지 않은 것은?","① 수출입업자에게 불필요한 부대경비 절감\n② 수출입업자에게 불필요한 인력절감\n③ 전문 Freight Forwarder에 의한 신속 정확한 화물 운송 \n④ 전문 Freight Forwarding 업체를 통한 생산 및 판매시장개척","④","","","",""],["186","거래상대국의 정부로부터 허가받은 보세창고(Bonded Warehouse)에 상품을 무상으로 반출하여 현지에서 매매계약을 체결하고 판매하는 거래방식은?","① 특수화물 운송서비스 및 각종대행서비스           ② 보세창고도거래서비스\n③ 환적화물취급서비스                              ④ 프로젝트화물 취급 서비스","②","","","",""],["187","다음은 BWT(Bonded Warehouse Transaction) 물품 취급에 관한 사항을 서술한 것으로 적합하지 않은 것은?","① BWT 물품은 반드시 보세창고에 장치하여야 한다. \n② 보세창고에 반입될 수 잇는 BWT 물품, Stable B/L 물품 등의 여부를 심사하기 위해서는 반입신고제가 시행되고 있다. \n③ 보세창고에 장치된 외국물품의 장치기간은 1년이내이며, 1년의 범위내에서 연장할 수 있다. \n④ BWT 물품이 분할될 때마다 적하목록 정정업무를 하여야 하고 별도의 보세화물양수도신고서에 의해 적하목록정정 일괄처리해야 한다. ","③","","","",""],["188","FIATA(International Federation of Freight Forwarders Associaltion) 관련서류 작성을 위해서 고객(화주)으로 부터 접수받는 서류 중 해당되지 않는 것은?","① FFI (FIATA Forwarding Instructions)\n② FIATA SDT(Shippers Declaration for the Transport of Dangerous Goods)\n③ FIATA SIC(Shippers Intermodal Weight Certification)\n④ FIATA FCT(Forwarders Certificate of Transport)","④","","","",""],["189","FIATA관련 서류 작성중 Forwarder의 창고작업을 위해 사용하는 입고확인서로 고객에게 발행하는 서류는 다음 중 어느 것인가?","① FCR(Forwarders Certificate of Receipt)\n② FIATA FCT(Forwarders Certificate of Trnasport)\n③ FBL(FIATA Multimodal Transport Bill of Lading)\n④ FWR(FIATA Warehouse Receipt)","④","","","",""],["190","복합운송에서 1인의 운송인이 전 구간의 운송을 인수하고 그 운송의 일부 또는 전부를 다른 운송인에게 하청을 준 경우의 형태는?","① 부분운송             ② 하청운송\n③ 공동운송             ④ 연대운송","②","","","",""],["191","다음 중 복합운송에 관한 일반적인 사실을 설명한 것으로 바르지 않은 것을 고르시오?","① 동일한 운송수단에서 적재와 하역을 반복하는 것은 복합운송에 포함되지 않는다. \n② 항공운송의 가장 큰 장점은 빠른 속도이다. \n③ 복합운송 시 각각의 운송수단별로 별도의 운송서류가 발행되는 것이 일반적이다. \n④ American Land Bridge는 태평양을 횡단하여 미국서안 항구에서 하역하여 미대륙을 트럭이나 철도로 횡단한 수 다시 서안항구에서 선박에 적재하여 유럽으로 운송하는 형태의 복합운송을 말한다. ","③","","","",""],["192","다음 중 국제항공운송협회의 약어로 적절한 것은?","① OPEC   ② ICC   ③ IATA   ④ OECD","③","","","",""],["193","다음 중 복합운송 관련 기구로 한국복합운송주선업협회의 약어로 적절한 것은?","① KIFFA   ② FIATA   ③ IATA   ④ ICAO","①","","","",""],["194"," 다음 중 복합수송 확장의 애로사항이 아닌 것은?","① 모드별 용량의 균등성        ② 국내 및 국제 수송에 있어서의 표준화의 비일관성\n③ 안전성의 문제               ④ 민간부문의 재정 한계","①","","","",""],["195","우리나라의 Forwarder의 문제점이 아닌 것은?","① 영세성   ② 전문성 부족   ③ 일관서비스 불능   ④ 통관업 진출","④","","","",""],["196","다음 중 AEO(Authorized Economic Operator)제도를 서술한 것으로 적합하지 않은 것은?","① 선박의 안전확보, 항만시설의 보안유지와 관련한 제도이다. \n② 수출입 정보를 사전에 세관에 제공하는 제도이다. \n③ 국가별 세관이 AEO 상호협정 체결 시 통관절차를 완하하는 제도이다. \n④ 우리나라는 2008년부터 도입하여 운영 중이다. ","①","","","",""],["197","복합운송주선인의 역할에 대한 설명으로 적절한 내용으로 묶인것은? \n\n㉮화주에게 운송수단선택, 운송경로 등에 대한 전문적 조언\n㉯선적서류의 작성\n㉰통관업무 직접수행\n㉱포장, LCL화물의 혼재와 분류\n㉲보험의 수배","① ㉮+㉯+㉰+㉱\n② ㉮+㉯+㉱+㉲\n③ ㉯+㉰+㉱+㉲\n④ ㉮+㉰+㉱+㉲","②","","","",""],["198","다음 중 Freight Forwarder가 수행하는 역할로 적당하지 않은 것은?","① 수출화주로 부터 수출통관과 국내운송을 위탁받아 이를 수행한다. \n② 수입통관 시에는 화주를 대신하여 수입신고를 자신의 명의로 직접 수행할 수 있다. \n③ 혼재화물에 대해 입항하는 관할세관장에게 제출할 혼재 화물 적하목록을 작성한다. \n④ 수출화주의 소량화물(LCL)를 위탁받아 이를 혼재작업을 통해 FCL로 만든다. ","②","","","",""],["199","다음 국제복합운송의 형태 중 화물의 납기를 고려할 때, 중국을 출발하여 한국을 경유, 미주지역 또는 중남미까지 운송할 경우 가장 효율적인 복합운송방식은 어느 것인가?","① Sea \u0026 Air     ② Train \u0026 Ship\n③ Piggy \u0026 Back  ④ Fishy \u0026 Back","①","","","",""],["200","다음 중 볼레로(Bolero)에 관한 특성을 기술한 것으로 거리가 먼 것은?","① 선적서류의 처리 자동화, 대금결제 자동화를 도모                                               ② 종래의 신용장 거래방식을 기본적으로 유지\n③ 시간을 단축하고 비용절감을 도모                                                       ④ SWIFT가 단독출자하여 설립","④","","","",""],["201","우리나라 ICD에 대한 설명 중 적합한 사실이 아닌 것은? ","① ICD는 LCL화물의 ghswo, 분류 등을 수행하는 CFS가 갖춰져 있다. \n② ICD는 토지이용, 운송효율성, 교통혼잡완화 등 경제적 효과가 크다. \n③ ICD는 항만기능 중 검역기능을 수행하지 않는다. \n④ ICD는 항만과 떨어진 산업단지 등 인근에 주로 위치한다. ","③","","","",""],["202","복합운송조건인 FCA에서 송하인과 수화인의 위험부담의 분기점은 언제 인가?","① 수화인이 물품을 운송인으로부터 인수하는 시점    \n② 송화인이 물품을 내륙운송인에게 인도하는 시점\n③ 운송인이 물품을 수화인에게 인도하는 시점        \n④ 운송인이 도착 시 항구에서 물품을 양륙하는 시점","②","","","",""],["203","Sea \u0026 Air 복합운송에 관한 설명 중 적당하지 않은 사실은?","① 해상운송이 지니는 운임의 저렴성과 항공운송이 갖는 신속성을 효과적으로 결합시킨 국제복합일관운송방식이다. \n② 화물의 출발지에서 목적지까지의 운송구간 중 일정구간은 선박으로 운송하고 나머지 구간을 항공기로 운송하는 방식이다. \n③ 선사나 해운업자보다는 항공회사, 항공화물업자 및 Sea \u0026 Air 전문 Broker등이 주체자가 되어 업무를 주관한다. \n④ 아시아 출발 유럽행, 중남미행, 미국행 등 운송거리가 긴 경로에서 유효하다. ","③","","","",""],["204","다음 중 국제복합운송증권(FIATA B/L)의 주요 내용으로 거리가 먼 것은?","① 화물을 인도 받기위해서는 적정히 배서된 1통의 증권원본과 상환되어야 한다. \n② 증권에 별도로 표시한 것이 없는 한 증권에 기재된 화물은 운송과 인도를 위해 수령지에서 양호한 상태로 수령하였음을 의미한다. \n③ 2가지 이상의 운송수단을 이용할 경우에 적용되며, 단일운송수단을 이용하는 경우에는 적용되지 않는다. \n④ 유통불가라는 표시가 없는 한 유통가능한 양식으로 발행하며 증권소지인은 배서 및 양도함으로써 그 권리를 양도할 수 있다. ","③","","","",""],["205","다음 중 국제복합운송증권(FIATA B/L)의 약관에 대한 설명으로 타당하지 못한 것은?","① Lien clause는 운송인, 혹은 그 대리인이 운임을 포함하여 운송관련 비용이 회수되지 않으면 해당화물을 유치할 권리를 갖는다.\n② 선박이 적법한 이유없이 보험증권에 정해진 항해로부터 이탈하였을 때는 보험자는 그 이로(Deviation)에서 책임이 해제된다고 규정하고 있다. \n③ B/L상에 표시되어 있는 \u0027said to contain\u0027, 또는 \u0027shipper\u0027s stowed, load \u0026 count\u0027조항은 부지약관을 의미한다. \n④ On-deck clause는 송화인이 동의하에 화물을 갑판위에 적재하는데, 해상적하보험의 경우 ICC(A)의 경우에는 담보가 안된다. ","④","","","",""],["206","컨테이너화물의 수입통관과 화물인도 및 수령의 절차를 설명한 것으로 적절하지 않은 것은?","① 적하목록을 선박이 입항하기 24시간 전까지 입항예쩡지 세관장에게 전자문서로 제출하되 중국, 일본 등 근거리지역으로 부터 입항하는 경우에는 선박입항 시 까지 제출한다. \n② 양륙된 회국화물의 수입신고서, 송품장, 가격신고서, 선하증권 부본, 포장명세서 등을 제출하여 관할 세관에 수입신고를 한다. \n③ 어떠한 경우에도 선하증권 원본의 소지인만 화물을 인도가능하다. \n④ 선박회사는 운임 및 부대비용을 징수한 후, 화물인도지시서(Delivery Order)를 발행한다. ","③","","","",""],["207","복합운송주선인의 역할로 인한 수출업자의 이점으로 해당되지 않는 것은?","① 소량화물의 송화인이 선박회사의 선적 거절이나 혼재(consolidation)상의 어려움의 해결된다. \n② 복합운송증권이나 House B/L을 선적 전에 운송주선인으로부터 발급받아 금융의 원활을 기할 수 있다. \n③ 국제운송의 가장 유리한 운송경로와 운송방법을 복합운송주선인으로부터 전문적인 조언을 받을 수 있다. \n④ 수많은 개별소량화물의 직접취급으로 인한 인원과 공간을 줄일 수 있으므로 경비를 절감할 수 있다. ","④","","","",""],["208","철도복합운송방식에 대한 특성을 설명한 것 중 가장 적절한 것은?","① 우리나라에서도 현재 부산항과 광양항 구간에서 2단적 컨테이너 열차를 운행하고 있다. \n② TOFC방식의 피기백 시스템은 총중량이 크나 철도터미널에서 다단적이 가능하고, 공간의 소요가 적어 철도터미널에서 선호하는 방식이다. \n③ 철도/도로 겸용 운송시스템은 장거리 간선수송에서 2단 적재열차보다 더 많은 컨테이너를 운송할 수 있어 유리하다. \n④ 철도/도로 겸용 운송시스템인 Roadriler는 TOFC방식에 비하여 터미널 비용 및 트레일러 견인료를 절감할 수 있어 경제적이다. ","④","","","",""],["209","Forwarder가 발행하는 FIATA B/L 약관에 기재된 Forwarder의 책임한도액에 대한 설명 중 거리가 먼 것은?","① 송화인이 화물의 성질, 화물가액을 포워더에 고지하고 종가운임을 지급하며, FIATA B/L상에 기재 시 신고가액이 한도액이 된다. \n② 포워더의 인도지연으로 인한 손해발생 시 FIATA B/L에 의거한 복합운송계약상 운임의 2배상당액을 초과하지 않는다. \n③ 화물의 멸실, 손상에 대해 포장당 또는 단위당 SDR 666.67상당액 또는 총중량 kg당 SDR2 상당액 중 더 많은 금액을 초과하지 않는다. \n④ 포워더의 총책임은 화물의 전손에 대한 책임한도를 초과하지 않는다. ","③","","","",""],["210","다음 중 BOLERO의 기능으로 적합하지 않은 것은?","① 각 볼레로 이용자의 주소, 보증 정보 등의 공통항목 저장한다. \n② 무역금융 및 보험, 대금 결제, 물류 등 무역에서 발생되는 모든 업무를 전용네트워크를 통해 처리한다. \n③ 볼레로 선하증권과 해상화물운송장 거래에 포함된 정보 등록과 유지관리를 한다. \n④ 볼레로 서류의 작성, 전자서명, 확인, 송신, 수신을 위한 도구로서의 역할을 한다. ","②","","","",""],["211","다음 중 복합운송에 사용되는 정형거래 조건이 아닌 것은?","① EXW (공장인도조건)        ② FOB (본선인도조건)    \n③ CPT (운송비지급인도조건)   ④ DDP (관세지급인도조건)","②","","","",""],["212","보세구역에 장치되어 있는 외국물품이 장치기간경과전임에도 불구하고 공고후 매각할 수 있는 물품이 있는데 대상물품이 아닌 것은?","① 살아있는 동식물                                                                             ② 부패하거나 부패할 우려가 있는 물품\n③ 다른 외국물품을 해할 우려가 있는 물품                                                                 ④ 보세창고료가 현저하게 늘어날 우려가 있는 물품","④","","","",""],["213","복합운송에서 Freight Forwarder가 취급할 수 있는 사업영역에 해당되지 않는 것은?","① 국제운송물류에 대한 전반적인 컨설팅                                                          ② 화물의 집화, 분배, 혼재 서비스\n③ 보험의 수배 및 담보조건 등에 관한 제안                                                                      ④ 운송사고 하자물품에 대한 검정보고서의 발급","④","","","",""],["214","다음 중 파나마운하에 대한 설명으로 옳지 않은 것은?","① 아시아에서 미국 동부지역으로의 All water service를 이용할 경우 통과하는 곳이다.\n② 태평양지역의 발보아와 대서양지역의 크리스토발을 연결하는 인공의 운하이다.\n③ Panamax Ship이란 파나마운하를 지나갈 수 있는 최대 크기의 선박을 말한다.\n④ 아시아에서 미국 동부지역으로의 컨테이너화물 운송시 파나마운하를 거쳐\n운송하는 것이 MLB(Mini Land Bridge) Service보다 운임수준이 높은 편이다.","④","","","",""],["215","소량화물(LCL)인 경우 화인에 반드시 표시되어야 하는 사항은?","① 원산지와 최종도착지      ② 화번과 최종도착지    \n③ 주화인과 화번            ④ 주화인과 최종도착지","②","","","",""],["216","항공화물 혼재업자(consoliator)의 역할에 관한 설명 중 틀린 것은?","① 항공사의 운송수단을 이용하여 항공사와 같은 입장에서 송화인과 화물운송교섭을 한다.\n② 자체 화물운송요율과 운송약관을 적용하여 자체항공화물운송장(House Air waybill)을 발행한다.\n③ 항공회사와 대리점계약을 체결하고 항공사를 대리하여 화물집하활동을 하고 항공사를 대신하여 운송장을 발행한다.\n④ 대리점으로서 송화인을 위한 화물의 예약․혼재, 트럭운송, 포장, 통관 관련서류를 작성한다.","③","","","",""],["217","다음 중 운송주선인의 일반적인 기능이라고 볼 수 없는 것은?","① 소량화물의 혼재운송                 ② 운송수단의 수배                                        ③ 수출승인의 대행                     ④ 복합운송의 주선","③","","","",""],["218","선박을 보유하지 않는 자가 운송계약을 체결하는 운송인을 무엇이라 하는가?","① Forwarder  ② Contract Carrier     ③ NVOCC    ④ Common carrier","③","","","",""],["219","다음 중 Dead Freight(공적운임)에 관한 설명으로 옳은 것은?","① 지불하지 않아도 되는 운임                                                                  ② 손상된 화물의 운임\n③ 화물을 싣지 않고도 지불해야 하는 운임                                                         ④ 선박이 파선하여 선주가 손해를 입은 운임","③","","","",""],["220","다음 중 불특정 화주를 상대로 운송서비스를 제공하는 운송인은?","① Forwarder  ② Common Carrier  ③ Industrial Carrier   ④ Consolidator","②","","","",""],["221","다음에서 복합운송인의 책임체계 중 단일책임으로서 전운송구간 동일형은?","① Network Liability System        ② Uniform Liability System\n③ Combined Liability System
