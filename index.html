    cameraDiag: '',
    query: { text: '' },
    querySource: 'camera',
    matches: [],
    manualText: '',
    uploadDraft: null,
    ocrEngine: null,
    ocrEnginePromise: null,
  };

  const $main = document.getElementById('main');
  const $statusPill = document.getElementById('statusPill');
  document.getElementById('settingsBtn').addEventListener('click', goSettings);

  // ---------- text helpers ----------
  function escapeHtml(s) {
    return (s ?? '').toString().replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function truncate(s, n) { s = (s ?? '').toString(); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function colLetter(i) { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }

  // ---------- matching ----------
  // Keeps only Hangul, Latin letters and digits, so OCR noise like ©@®_< and circled numbers drop out.
  function normalize(s) {
    return (s ?? '').toString().toLowerCase().replace(/[^0-9a-z가-힣]/g, '');
  }
  function bigramBag(s) {
    const n = normalize(s);
    const map = new Map();
    for (let i = 0; i < n.length - 1; i++) { const g = n.slice(i, i + 2); map.set(g, (map.get(g) || 0) + 1); }
    return { n, map, size: Math.max(0, n.length - 1) };
  }
  function dice(a, b) {
    if (!a.n || !b.n) return 0;
    if (a.n === b.n) return 1;
    if (!a.size || !b.size) return a.n.includes(b.n) || b.n.includes(a.n) ? 0.8 : 0;
    const [small, large] = a.map.size < b.map.size ? [a, b] : [b, a];
    let common = 0;
    for (const [g, c] of small.map) { const d = large.map.get(g); if (d) common += Math.min(c, d); }
    return (2 * common) / (a.size + b.size);
  }
  const bagCache = new WeakMap();
  function rowBags(r) {
    let bags = bagCache.get(r);
    if (!bags) {
      bags = { q: bigramBag(r.q), full: r.opts ? bigramBag(r.q + ' ' + r.opts) : null };
      bagCache.set(r, bags);
    }
    return bags;
  }
  function answerLabel(row) { return row.symbol ? row.symbol + ' ' + row.text : row.text; }
  // A photo usually holds the stem and all four options, so also compare against stem + options.
  function findMatches(rows, query) {
    const qb = bigramBag(query.text);
    const scored = rows
      .map((r) => {
        const bags = rowBags(r);
        const score = Math.max(dice(qb, bags.q), bags.full ? dice(qb, bags.full) : 0);
        return { q: r.q, symbol: r.symbol, text: r.text, sheet: r.sheet, score };
      })
      .filter((r) => r.score > 0.08);
    scored.sort((a, b) => b.score - a.score);
    const seen = new Set();
    const out = [];
    for (const r of scored) {
      const key = normalize(r.q);
      if (seen.has(key)) continue;
      seen.add(key);
      out.push(r);
      if (out.length >= 3) break;
    }
    return out;
  }
  // Typed search: questions containing every typed word (in the stem or options) come first, ranked by similarity;
  // remaining slots fall back to similarity alone, which catches spelling variants like "로로선" vs "로로(Ro-Ro)선".
  function keywordSearch(rows, input, limit) {
    const words = input.split(/\s+/).map(normalize).filter(Boolean);
    if (!words.length) return { items: [], exactCount: 0 };
    const qb = bigramBag(input);
    const seen = new Set();
    const exact = [], rest = [];
    for (const r of rows) {
      const key = normalize(r.q);
      if (seen.has(key)) continue;
      seen.add(key);
      const bags = rowBags(r);
      const score = Math.max(dice(qb, bags.q), bags.full ? dice(qb, bags.full) : 0);
      const item = { q: r.q, symbol: r.symbol, text: r.text, sheet: r.sheet, score };
      const hay = bags.full ? bags.full.n : bags.q.n;
      (words.every((w) => hay.includes(w)) ? exact : rest).push(item);
    }
    exact.sort((a, b) => b.score - a.score);
    rest.sort((a, b) => b.score - a.score);
    const items = exact.slice(0, limit).map((x) => Object.assign(x, { exact: true }));
    for (const x of rest) {
      if (items.length >= limit || x.score <= 0.08) break;
      items.push(Object.assign(x, { exact: false }));
    }
    return { items, exactCount: exact.length };
  }

  // ---------- storage: localStorage ----------
  const LS_KEY = 'snap_answer_dataset_v1';
  function saveLocal(rows, meta) {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ rows, fileName: meta.fileName })); } catch (e) {}
  }
  function loadLocal() {
    try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }

  // ---------- excel parsing: auto (multi-sheet, 문제/보기/정답) ----------
  const Q_EXACT = ['문제', '질문', 'question', 'q'];
  const A_EXACT = ['정답', 'answer', 'ans', 'a'];
  const O_EXACT = ['보기', '선택지', '지문', 'options', 'choice', 'choices'];
  function findHeaderRow(raw2d) {
    const scanRows = Math.min(raw2d.length, 12);
    for (let r = 0; r < scanRows; r++) {
      const row = raw2d[r] || [];
      let qIdx = -1, aIdx = -1, oIdx = -1;
      row.forEach((cell, i) => {
        const c = (cell ?? '').toString().trim().toLowerCase();
        if (qIdx === -1 && Q_EXACT.includes(c)) qIdx = i;
        if (aIdx === -1 && A_EXACT.includes(c)) aIdx = i;
        if (oIdx === -1 && O_EXACT.includes(c)) oIdx = i;
      });
      if (qIdx !== -1 && aIdx !== -1 && qIdx !== aIdx) return { headerRow: r, qIdx, aIdx, oIdx };
    }
    return null;
  }
  function parseOptions(optionsRaw) {
    const s = (optionsRaw ?? '').toString();
    if (!s) return [];
    const parts = s.split(/([①②③④⑤⑥⑦⑧])/).filter((p) => p !== '');
    const opts = [];
    for (let i = 0; i < parts.length - 1; i++) {
      if (/^[①②③④⑤⑥⑦⑧]$/.test(parts[i])) {
        const text = parts[i + 1].replace(/\s+/g, ' ').trim();
        if (text) opts.push({ marker: parts[i], text });
      }
    }
    return opts;
  }
  const MARKER_BY_NUM = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧'];
  function resolveAnswer(rawAnswer, options) {
    const raw = (rawAnswer ?? '').toString().trim();
    let marker = (raw.match(/[①②③④⑤⑥⑦⑧]/) || [])[0] || null;
    if (!marker) {
      const numMatch = raw.match(/^\d+/);
      if (numMatch) marker = MARKER_BY_NUM[parseInt(numMatch[0], 10) - 1] || null;
    }
    if (marker) {
      const found = options.find((o) => o.marker === marker);
      if (found) return { symbol: marker, text: found.text };
    }
    return { symbol: '', text: raw };
  }
  function extractSheetRows(raw2d, sheetName) {
    const header = findHeaderRow(raw2d);
    if (!header) return { rows: [], headerFound: false };
    const { headerRow, qIdx, aIdx, oIdx } = header;
    const rows = [];
    for (let r = headerRow + 1; r < raw2d.length; r++) {
      const row = raw2d[r] || [];
      const q = (row[qIdx] ?? '').toString().trim();
      const rawAnswer = (row[aIdx] ?? '').toString().trim();
      if (!q || !rawAnswer) continue;
      const optionsRaw = oIdx !== -1 ? (row[oIdx] ?? '').toString() : '';
      const options = parseOptions(optionsRaw);
      const resolved = resolveAnswer(rawAnswer, options);
      rows.push({ q, symbol: resolved.symbol, text: resolved.text, sheet: sheetName, opts: options.map((o) => o.text).join(' ') });
    }
    return { rows, headerFound: true };
  }
  async function autoExtractWorkbook(file) {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const summary = [];
    let allRows = [];
    wb.SheetNames.forEach((name) => {
      const raw2d = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: false, defval: '' });
      const { rows, headerFound } = extractSheetRows(raw2d, name);
      summary.push({ name, count: rows.length, headerFound });
      allRows = allRows.concat(rows);
    });
    const firstSheetRaw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' });
    return { rows: allRows, summary, firstSheetRaw };
  }
  function extractEmbeddedWorkbook(workbook) {
    let allRows = [];
    (workbook || []).forEach((sheet) => {
      const { rows } = extractSheetRows(sheet.rows, sheet.name);
      allRows = allRows.concat(rows);
    });
    return allRows;
  }

  // ---------- excel parsing: manual fallback (simple 2-column sheets) ----------
  const Q_HINTS = ['문제', '질문', 'question', '문항', '번호', 'no'];
  const A_HINTS = ['정답', '답', 'answer', 'ans'];
  function guessColumnsFallback(headerRow) {
    let q = 0, a = headerRow.length > 1 ? 1 : 0;
    (headerRow || []).forEach((cell, i) => {
      const c = (cell ?? '').toString().toLowerCase();
      if (Q_HINTS.some((h) => c.includes(h))) q = i;
      if (A_HINTS.some((h) => c.includes(h))) a = i;
    });
    return { q, a };
  }
  function columnLabel(raw2d, idx, hasHeader) {
    const headerText = hasHeader && raw2d[0] ? (raw2d[0][idx] ?? '').toString().trim() : '';
    const sampleRow = hasHeader ? raw2d[1] : raw2d[0];
    const sample = sampleRow ? (sampleRow[idx] ?? '').toString().trim() : '';
    const label = headerText || (colLetter(idx) + '열');
    return sample ? label + ' — "' + truncate(sample, 16) + '"' : label;
  }
  function buildRowsFallback(raw2d, qCol, aCol, hasHeader) {
    const data = hasHeader ? raw2d.slice(1) : raw2d;
    return data
      .map((r) => ({ q: (r[qCol] ?? '').toString().trim(), symbol: '', text: (r[aCol] ?? '').toString().trim(), sheet: '' }))
      .filter((r) => r.q || r.text);
  }

  // ---------- camera ----------
  // The viewfinder uses object-fit: cover, so crop to the part of the frame the user actually sees.
  function captureCanvas(video) {
    const vw = video.videoWidth, vh = video.videoHeight;
    const box = video.getBoundingClientRect();
    const boxRatio = box.width && box.height ? box.width / box.height : vw / vh;
    let sw = vw, sh = vh;
    if (vw / vh > boxRatio) sw = vh * boxRatio; else sh = vw / boxRatio;
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(sw); canvas.height = Math.round(sh);
    canvas.getContext('2d').drawImage(video, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, canvas.width, canvas.height);
    return canvas;
  }

  // ---------- local OCR: PaddleOCR PP-OCRv5 (mobile det + Korean rec) on onnxruntime-web, free, runs on the phone ----------
  const OCR_MODELS = {
    det: 'https://huggingface.co/PaddlePaddle/PP-OCRv5_mobile_det_onnx/resolve/main/inference.onnx',
    rec: 'https://huggingface.co/PaddlePaddle/korean_PP-OCRv5_mobile_rec_onnx/resolve/main/inference.onnx',
  };
  const OCR_CACHE = 'paddleocr-ko-v5';
  const ORT_WASM_BASE = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/';
  function setOcrStatus(text) {
    const el = document.getElementById('scanBusyText');
    if (el) el.textContent = text;
  }
  // The HF links redirect to signed URLs that change every time, so the browser cache never hits; keep a copy in Cache Storage.
  async function fetchModel(url, onBytes) {
    let cache = null;
    try {
      cache = await caches.open(OCR_CACHE);
      const hit = await cache.match(url);
      if (hit) return new Uint8Array(await hit.arrayBuffer());
    } catch (e) { cache = null; }
    const res = await fetch(url);
    if (!res.ok) throw new Error('model download failed: ' + res.status);
    const reader = res.body.getReader();
    const chunks = [];
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      got += value.length;
      onBytes(got);
    }
    const buf = new Uint8Array(got);
    let off = 0;
    for (const c of chunks) { buf.set(c, off); off += c.length; }
    if (cache) { try { await cache.put(url, new Response(buf)); } catch (e) {} }
    return buf;
  }
  async function getOcrEngine() {
    if (state.ocrEngine) return state.ocrEngine;
    if (!state.ocrEnginePromise) {
      state.ocrEnginePromise = (async () => {
        ort.env.wasm.wasmPaths = ORT_WASM_BASE;
        ort.env.wasm.numThreads = 1;
        const got = { det: 0, rec: 0 };
        const report = () => setOcrStatus('OCR 모델 받는 중 (처음 한 번만) ' + ((got.det + got.rec) / 1048576).toFixed(1) + ' / 약 17MB');
        const [detBuf, recBuf] = await Promise.all([
          fetchModel(OCR_MODELS.det, (n) => { got.det = n; report(); }),
          fetchModel(OCR_MODELS.rec, (n) => { got.rec = n; report(); }),
        ]);
        setOcrStatus('OCR 엔진 준비 중...');
        const opts = { executionProviders: ['wasm'], graphOptimizationLevel: 'all' };
        const det = await ort.InferenceSession.create(detBuf, opts);
        const rec = await ort.InferenceSession.create(recBuf, opts);
        return { det, rec };
      })();
    }
    try {
      state.ocrEngine = await state.ocrEnginePromise;
    } catch (e) {
      state.ocrEnginePromise = null;
      throw e;
    }
    return state.ocrEngine;
  }

  // Detection: DB text-region map at longest side 960 (BGR, ImageNet mean/std), as PP-OCRv5's inference.yml specifies.
  async function detectTextBoxes(engine, src) {
    const W = src.width, H = src.height;
    const ratio = 960 / Math.max(W, H);
    const rw = Math.max(32, Math.round((W * ratio) / 32) * 32);
    const rh = Math.max(32, Math.round((H * ratio) / 32) * 32);
    const c = document.createElement('canvas');
    c.width = rw; c.height = rh;
    const ctx = c.getContext('2d');
    ctx.drawImage(src, 0, 0, rw, rh);
    const px = ctx.getImageData(0, 0, rw, rh).data;
    const N = rw * rh;
    const input = new Float32Array(3 * N);
    for (let i = 0; i < N; i++) {
      const r = px[i * 4] / 255, g = px[i * 4 + 1] / 255, b = px[i * 4 + 2] / 255;
      input[i] = (b - 0.485) / 0.229;
      input[N + i] = (g - 0.456) / 0.224;
      input[2 * N + i] = (r - 0.406) / 0.225;
    }
    const out = await engine.det.run({ [engine.det.inputNames[0]]: new ort.Tensor('float32', input, [1, 3, rh, rw]) });
    const prob = out[engine.det.outputNames[0]].data;

    // Connected components of prob > 0.3, then a rotated box per component (principal axis), unclipped by 1.5.
    const label = new Int32Array(N);
    const stack = new Int32Array(N);
    const boxes = [];
    const sx = W / rw, sy = H / rh;
    let next = 0;
    for (let start = 0; start < N; start++) {
      if (label[start] || prob[start] <= 0.3) continue;
      next++;
      let top = 0, count = 0, sum = 0, mx = 0, my = 0, mxx = 0, myy = 0, mxy = 0;
      stack[top++] = start;
      label[start] = next;
      while (top) {
        const p = stack[--top];
        const x = p % rw, y = (p / rw) | 0;
        count++; sum += prob[p];
        mx += x; my += y; mxx += x * x; myy += y * y; mxy += x * y;
        if (x > 0 && !label[p - 1] && prob[p - 1] > 0.3) { label[p - 1] = next; stack[top++] = p - 1; }
        if (x < rw - 1 && !label[p + 1] && prob[p + 1] > 0.3) { label[p + 1] = next; stack[top++] = p + 1; }
        if (y > 0 && !label[p - rw] && prob[p - rw] > 0.3) { label[p - rw] = next; stack[top++] = p - rw; }
        if (y < rh - 1 && !label[p + rw] && prob[p + rw] > 0.3) { label[p + rw] = next; stack[top++] = p + rw; }
      }
      if (count < 12 || sum / count < 0.6) continue;
      mx /= count; my /= count;
      const cxx = mxx / count - mx * mx, cyy = myy / count - my * my, cxy = mxy / count - mx * my;
      const half = (cxx + cyy) / 2, spread = Math.sqrt(((cxx - cyy) / 2) ** 2 + cxy * cxy);
      const elongated = half - spread > 0 ? (half + spread) / (half - spread) > 4 : true;
      let theta = elongated ? 0.5 * Math.atan2(2 * cxy, cxx - cyy) : 0;
      if (Math.abs(theta) > 0.35) theta = 0;
      boxes.push({ id: next, mx, my, theta });
    }
    if (!boxes.length) return [];
    const byId = new Map(boxes.map((b) => [b.id, Object.assign(b, { pmin: Infinity, pmax: -Infinity, qmin: Infinity, qmax: -Infinity })]));
    for (let p = 0; p < N; p++) {
      const b = label[p] && byId.get(label[p]);
      if (!b) continue;
      const x = p % rw - b.mx, y = ((p / rw) | 0) - b.my;
      const ux = Math.cos(b.theta), uy = Math.sin(b.theta);
      const pp = x * ux + y * uy, qq = -x * uy + y * ux;
      if (pp < b.pmin) b.pmin = pp; if (pp > b.pmax) b.pmax = pp;
      if (qq < b.qmin) b.qmin = qq; if (qq > b.qmax) b.qmax = qq;
    }
    const result = [];
    for (const b of boxes) {
      let w = b.pmax - b.pmin + 1, h = b.qmax - b.qmin + 1;
      const d = (w * h * 1.5) / (2 * (w + h));
      w += 2 * d; h += 2 * d;
      if (Math.min(w, h) < 5) continue;
      const ux = Math.cos(b.theta), uy = Math.sin(b.theta);
      const pc = (b.pmin + b.pmax) / 2, qc = (b.qmin + b.qmax) / 2;
      const cx = b.mx + pc * ux - qc * uy, cy = b.my + pc * uy + qc * ux;
      result.push({ cx: cx * sx, cy: cy * sy, w: w * sx, h: h * sy, theta: b.theta });
    }
    return result;
  }

  // Recognition: height 48, width by aspect ratio (padded to at least 320), BGR scaled to [-1, 1], greedy CTC.
  async function recognizeBox(engine, src, box) {
    const ratio = box.w / Math.max(1, box.h);
    const rw = Math.min(3200, Math.max(8, Math.ceil(48 * ratio)));
    const imgW = Math.min(3200, Math.max(320, rw));
    const c = document.createElement('canvas');
    c.width = rw; c.height = 48;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    const ux = Math.cos(box.theta), uy = Math.sin(box.theta);
    const kx = rw / box.w, ky = 48 / box.h;
    ctx.setTransform(kx * ux, -ky * uy, kx * uy, ky * ux,
      -kx * (ux * box.cx + uy * box.cy) + rw / 2,
      -ky * (-uy * box.cx + ux * box.cy) + 24);
    ctx.drawImage(src, 0, 0);
    const px = ctx.getImageData(0, 0, rw, 48).data;
    const plane = 48 * imgW;
    const input = new Float32Array(3 * plane);
    for (let y = 0; y < 48; y++) {
      for (let x = 0; x < rw; x++) {
        const i = (y * rw + x) * 4, o = y * imgW + x;
        input[o] = px[i + 2] / 127.5 - 1;
        input[plane + o] = px[i + 1] / 127.5 - 1;
        input[2 * plane + o] = px[i] / 127.5 - 1;
      }
    }
    const out = await engine.rec.run({ [engine.rec.inputNames[0]]: new ort.Tensor('float32', input, [1, 3, 48, imgW]) });
    const t = out[engine.rec.outputNames[0]];
    const [, T, C] = t.dims;
    const probs = t.data;
    let text = '', confSum = 0, kept = 0, prev = -1;
    for (let s = 0; s < T; s++) {
      let best = 0, bestP = -1;
      for (let k = 0; k < C; k++) { const v = probs[s * C + k]; if (v > bestP) { bestP = v; best = k; } }
      if (best !== 0 && best !== prev) {
        text += best - 1 < OCR_DICT.length ? OCR_DICT[best - 1] : ' ';
        confSum += bestP; kept++;
      }
      prev = best;
    }
    return { text: text.trim(), conf: kept ? confSum / kept : 0 };
  }

  // Reads the crop line by line, top to bottom; lines the model is unsure of (<0.5, PaddleOCR's drop score) are skipped.
  async function paddleOcr(src) {
    const engine = await getOcrEngine();
    setOcrStatus('글자 위치를 찾는 중...');
    const boxes = await detectTextBoxes(engine, src);
    boxes.sort((a, b) => a.cy - b.cy);
    const rows = [];
    for (const b of boxes) {
      const row = rows[rows.length - 1];
      if (row && Math.abs(b.cy - row[0].cy) < Math.min(b.h, row[0].h) * 0.5) row.push(b); else rows.push([b]);
    }
    const lines = [];
    let done = 0;
    for (const row of rows) {
      row.sort((a, b) => a.cx - b.cx);
      const parts = [];
      for (const b of row) {
        done++;
        setOcrStatus('글자 읽는 중... ' + done + ' / ' + boxes.length);
        const r = await recognizeBox(engine, src, b);
        if (r.text && r.conf >= 0.5) parts.push(r.text);
      }
      if (parts.length) lines.push(parts.join(' '));
    }
    return lines.join('\n');
  }

  class UserFacingError extends Error {}
  // Keep every line (stem and options both help matching); only drop a leading question number like "2." or "10)".
  function cleanOcrText(raw) {
    return (raw || '')
      .split(/\r?\n/)
      .map((l) => l.trim().replace(/^\d{1,3}\s*[.)]\s*/, ''))
      .filter(Boolean)
      .join(' ')
      .replace(/\s+/g, ' ')
      .trim()
      .slice(0, 600);
  }
  function cameraErrorMessage(e) {
    const name = e && e.name;
    if (name === 'NotAllowedError' || name === 'SecurityError') return '카메라 사용이 거부됐어요. 브라우저의 사이트 권한에서 카메라를 허용했는지 확인해 주세요.';
    if (name === 'NotFoundError') return '사용할 수 있는 카메라를 찾지 못했어요.';
    if (name === 'NotReadableError') return '다른 앱이 카메라를 사용 중이에요. 잠시 후 다시 시도해 주세요.';
    if (name === 'Timeout') return '카메라가 15초 동안 응답하지 않았어요. 카메라 권한을 묻는 창이 떴는지 확인해 주세요.';
    return '카메라를 시작하지 못했어요. 이 파일을 https로 열었는지 확인해 주세요.';
  }
  function cameraPolicyBlocked() {
    const pol = document.permissionsPolicy || document.featurePolicy;
    return !!(pol && typeof pol.allowsFeature === 'function' && !pol.allowsFeature('camera'));
  }
  function cameraDiagnostics(e) {
    const pol = document.permissionsPolicy || document.featurePolicy;
    return [
      e && e.name ? '오류 ' + e.name : null,
      '보안연결 ' + (window.isSecureContext ? 'O' : 'X'),
      '카메라API ' + (navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? 'O' : 'X'),
      pol && typeof pol.allowsFeature === 'function' ? '카메라정책 ' + (pol.allowsFeature('camera') ? '허용' : '차단') : null,
      window.top === window.self ? '단독 페이지' : '틀 안',
    ].filter(Boolean).join(' · ');
  }

  // ---------- camera lifecycle ----------
  function stopCameraAndReset() {
    if (state.stream) state.stream.getTracks().forEach((t) => t.stop());
    state.stream = null;
    state.cameraStarted = false;
  }
  async function onStartCamera() {
    const btn = document.getElementById('startCamBtn');
    if (btn) { btn.disabled = true; btn.textContent = '카메라 준비 중...'; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      state.cameraError = window.isSecureContext ? '이 브라우저에서는 카메라를 사용할 수 없어요.' : '파일로 직접 열면 브라우저가 카메라를 막아요. https 주소로 열어 주세요.';
      state.cameraDiag = cameraDiagnostics(null);
      render();
      return;
    }
    if (cameraPolicyBlocked()) {
      state.cameraError = '이 화면이 카메라 사용을 막고 있어요.';
      state.cameraDiag = cameraDiagnostics(null);
      render();
      return;
    }
    let timedOut = false;
    let timer;
    // Without a size request most browsers hand out 640x480, which is too small for Korean text.
    const gum = navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    gum.then((s) => { if (timedOut) s.getTracks().forEach((t) => t.stop()); }, () => {});
    const timeout = new Promise((_, reject) => { timer = setTimeout(() => { timedOut = true; reject({ name: 'Timeout' }); }, 15000); });
    try {
      state.stream = await Promise.race([gum, timeout]);
      const track = state.stream.getVideoTracks()[0];
      const caps = track && track.getCapabilities ? track.getCapabilities() : {};
      if (caps.focusMode && caps.focusMode.includes('continuous')) {
        track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
      }
      state.cameraStarted = true;
      state.cameraError = null;
      state.cameraDiag = '';
    } catch (e) {
      state.cameraError = cameraErrorMessage(e);
      state.cameraDiag = cameraDiagnostics(e);
    } finally {
      clearTimeout(timer);
    }
    render();
  }
  async function onCapture() {
    const video = document.getElementById('video');
    const busy = document.getElementById('scanBusy');
    const captureBtn = document.getElementById('captureBtn');
    if (!video || video.readyState < 2) return;
    const canvas = captureCanvas(video);
    if (busy) busy.hidden = false;
    if (captureBtn) captureBtn.disabled = true;
    state.cameraError = null;
    state.cameraDiag = '';
    try {
      const text = cleanOcrText(await paddleOcr(canvas));
      if (!text) throw new UserFacingError('사진에서 문제를 찾지 못했어요. 문제가 화면 가운데 오도록 다시 찍어 주세요.');
      state.query = { text };
      state.querySource = 'camera';
      state.matches = findMatches(state.dataset.rows, state.query);
      setView('result');
    } catch (e) {
      const unexpected = !(e instanceof UserFacingError);
      state.cameraError = unexpected ? '문제를 읽지 못했어요. 인터넷 연결을 확인하고 다시 찍거나, 아래에서 직접 입력해 주세요.' : e.message;
      state.cameraDiag = unexpected ? '오류: ' + ((e && e.message) || String(e)).slice(0, 160) : '';
      if (busy) busy.hidden = true;
      if (captureBtn) captureBtn.disabled = false;
      render();
    }
  }

  // ---------- navigation ----------
  function goSettings() { stopCameraAndReset(); setView('settings'); }
  function setView(v) { state.view = v; render(); }

  function updateStatusPill() {
    if (state.view === 'loading') { $statusPill.textContent = '불러오는 중'; return; }
    if (!state.dataset) { $statusPill.textContent = '파일 없음'; return; }
    $statusPill.textContent = state.dataset.rows.length + '문항 로드됨';
  }

  function render() {
    updateStatusPill();
    if (state.view === 'loading') $main.innerHTML = renderLoading();
    else if (state.view === 'upload') { $main.innerHTML = renderUpload(); bindUpload(); }
    else if (state.view === 'scan') { $main.innerHTML = renderScan(); bindScan(); }
    else if (state.view === 'manual') { $main.innerHTML = renderManual(); bindManual(); }
    else if (state.view === 'result') { $main.innerHTML = renderResult(); bindResult(); }
    else if (state.view === 'settings') { $main.innerHTML = renderSettings(); bindSettings(); }
  }

  function renderLoading() {
    return '<div class="loading"><div class="spinner"></div><p>불러오는 중...</p></div>';
  }

  // ---------- upload view ----------
  function renderUpload() {
    if (!state.uploadDraft) {
      return (
        '<div class="upload">' +
        '<div class="upload-hero">' +
        '<div class="card-stack" aria-hidden="true"><span></span><span></span><span></span></div>' +
        '<h2>엑셀로 답안지를 올려주세요</h2>' +
        '<p>문제와 정답이 담긴 엑셀 파일을 올리면<br>이 안에서 정답을 검색할 수 있어요.</p>' +
        '</div>' +
        '<label class="btn-primary btn-block file-btn">' + ICONS.upload + ' 엑셀 파일 선택' +
        '<input type="file" id="fileInput" accept=".xlsx,.xls,.csv" hidden></label>' +
        '<p class="hint-text">.xlsx, .xls, .csv 파일을 지원해요</p>' +
        '</div>'
      );
    }
    return '<div class="upload">' + renderUploadPreview() + '</div>';
  }
  function renderUploadPreview() {
    const d = state.uploadDraft;
    if (d.mode === 'auto') return renderAutoSummary(d);
    return renderManualPicker(d);
  }
  function renderAutoSummary(d) {
    const rows = d.summary
      .map((s) => '<div class="info-row"><span>' + escapeHtml(s.name) + '</span><strong>' + (s.headerFound ? s.count + '개' : '인식 안 됨') + '</strong></div>')
      .join('');
    return (
      '<div class="draft-card">' +
      '<span class="draft-title">' + escapeHtml(d.fileName) + '</span>' +
      '<p class="row-count">총 ' + d.rows.length + '개 문항을 찾았어요</p>' +
      '<div class="info-card">' + rows + '</div>' +
      '<button class="btn-primary btn-block" id="saveDraftBtn"' + (d.rows.length ? '' : ' disabled') + '>' + ICONS.check + ' 저장하고 시작하기</button>' +
      (state.dataset ? '<button class="btn-ghost btn-block" id="cancelDraftBtn">취소</button>' : '') +
      '</div>'
    );
  }
  function renderManualPicker(d) {
    const rows = buildRowsFallback(d.raw2d, d.qCol, d.aCol, d.hasHeader);
    const previewRows = d.raw2d.slice(0, 6);
    const colCount = Math.max(...d.raw2d.slice(0, 6).map((r) => r.length), 1);
    let table = '<div class="preview-scroll"><table class="preview"><thead><tr>';
    for (let c = 0; c < colCount; c++) {
      table += '<th class="' + (c === d.qCol ? 'col-q' : c === d.aCol ? 'col-a' : '') + '">' + colLetter(c) + '열</th>';
    }
    table += '</tr></thead><tbody>';
    previewRows.forEach((r) => {
      table += '<tr>';
      for (let c = 0; c < colCount; c++) {
        table += '<td class="' + (c === d.qCol ? 'col-q' : c === d.aCol ? 'col-a' : '') + '">' + escapeHtml(truncate((r[c] ?? '').toString(), 14)) + '</td>';
      }
      table += '</tr>';
    });
    table += '</tbody></table></div>';

    let qOpts = '', aOpts = '';
    for (let c = 0; c < colCount; c++) {
      const label = escapeHtml(columnLabel(d.raw2d, c, d.hasHeader));
      qOpts += '<option value="' + c + '"' + (c === d.qCol ? ' selected' : '') + '>' + label + '</option>';
      aOpts += '<option value="' + c + '"' + (c === d.aCol ? ' selected' : '') + '>' + label + '</option>';
    }

    return (
      '<div class="draft-card">' +
      '<span class="draft-title">' + escapeHtml(d.fileName) + '</span>' +
      table +
      '<div class="check-row"><input type="checkbox" id="headerCheck"' + (d.hasHeader ? ' checked' : '') + '><label for="headerCheck">첫 번째 행은 머리글이에요</label></div>' +
      '<div class="field-row"><label>문제(질문) 컬럼</label><select id="qColSelect">' + qOpts + '</select></div>' +
      '<div class="field-row"><label>정답 컬럼</label><select id="aColSelect">' + aOpts + '</select></div>' +
      '<p class="row-count">' + rows.length + '개의 문항을 찾았어요</p>' +
      '<button class="btn-primary btn-block" id="saveDraftBtn"' + (rows.length ? '' : ' disabled') + '>' + ICONS.check + ' 저장하고 시작하기</button>' +
      (state.dataset ? '<button class="btn-ghost btn-block" id="cancelDraftBtn">취소</button>' : '') +
      '</div>'
    );
  }
  function bindUpload() {
    const fileInput = document.getElementById('fileInput');
    if (fileInput) fileInput.addEventListener('change', onFileSelected);
    const d = state.uploadDraft;
    if (d && d.mode === 'manual') {
      const headerCheck = document.getElementById('headerCheck');
      if (headerCheck) headerCheck.addEventListener('change', (e) => { d.hasHeader = e.target.checked; $main.innerHTML = renderUpload(); bindUpload(); });
      const qSel = document.getElementById('qColSelect');
      if (qSel) qSel.addEventListener('change', (e) => { d.qCol = Number(e.target.value); $main.innerHTML = renderUpload(); bindUpload(); });
      const aSel = document.getElementById('aColSelect');
      if (aSel) aSel.addEventListener('change', (e) => { d.aCol = Number(e.target.value); $main.innerHTML = renderUpload(); bindUpload(); });
    }
    const saveBtn = document.getElementById('saveDraftBtn');
    if (saveBtn) saveBtn.addEventListener('click', onSaveDraft);
    const cancelBtn = document.getElementById('cancelDraftBtn');
    if (cancelBtn) cancelBtn.addEventListener('click', () => { state.uploadDraft = null; setView('scan'); });
  }
  async function onFileSelected(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      const result = await autoExtractWorkbook(file);
      if (result.rows.length > 0) {
        state.uploadDraft = { mode: 'auto', fileName: file.name, rows: result.rows, summary: result.summary };
      } else {
        const raw2d = result.firstSheetRaw;
        if (!raw2d.length) { alert('파일에서 데이터를 찾지 못했어요.'); return; }
        const guess = guessColumnsFallback(raw2d[0]);
        state.uploadDraft = { mode: 'manual', raw2d, qCol: guess.q, aCol: guess.a, hasHeader: true, fileName: file.name };
      }
      render();
    } catch (err) {
      alert('엑셀 파일을 읽지 못했어요. 파일 형식을 확인해 주세요.');
    }
  }
  async function onSaveDraft() {
    const d = state.uploadDraft;
    const rows = d.mode === 'auto' ? d.rows : buildRowsFallback(d.raw2d, d.qCol, d.aCol, d.hasHeader);
    const meta = { fileName: d.fileName };
    saveLocal(rows, meta);
    state.dataset = { rows, fileName: d.fileName };
    state.uploadDraft = null;
    setView('scan');
  }

  // ---------- scan view ----------
  function renderScan() {
    return (
      '<div class="scan">' +
      '<p class="hint-text">문제 하나를 보기까지 네모 칸에 꽉 차게, 밝은 곳에서 흔들리지 않게 비춰 주세요 · 처음 한 번은 글자 데이터를 받느라 시간이 걸려요</p>' +
      '<div class="viewfinder" id="viewfinder">' +
      (state.cameraStarted ? '<video id="video" autoplay playsinline muted></video>' : '<div class="placeholder">' + ICONS.camera + '</div>') +
      '<div class="scan-busy" id="scanBusy" hidden><div class="spinner"></div><p id="scanBusyText">처리 중...</p></div>' +
      (state.cameraStarted ? '<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>' : '') +
      '</div>' +
      (!state.cameraStarted
        ? '<button class="btn-primary btn-block" id="startCamBtn">' + ICONS.camera + ' 카메라 켜기</button>'
        : '<button class="btn-capture" id="captureBtn">' + ICONS.search + ' 이 문제 찾기</button>') +
      (state.cameraError ? '<p class="error-text">' + escapeHtml(state.cameraError) + '</p>' + (state.cameraDiag ? '<p class="hint-text">' + escapeHtml(state.cameraDiag) + '</p>' : '') : '') +
      '<p class="error-text" id="camPlayMsg" hidden></p>' +
      '<button class="btn-primary btn-block" id="manualBtn">' + ICONS.pencil + ' 문제 직접 입력해서 찾기</button>' +
      '</div>'
    );
  }
  function bindScan() {
    const startBtn = document.getElementById('startCamBtn');
    if (startBtn) startBtn.addEventListener('click', onStartCamera);
    const captureBtn = document.getElementById('captureBtn');
    if (captureBtn) captureBtn.addEventListener('click', onCapture);
    document.getElementById('manualBtn').addEventListener('click', () => setView('manual'));
    if (state.cameraStarted && state.stream) {
      const v = document.getElementById('video');
      if (v) {
        v.muted = true;
        v.srcObject = state.stream;
        v.play().catch((err) => {
          const msg = document.getElementById('camPlayMsg');
          if (msg) { msg.textContent = '카메라 화면을 띄우지 못했어요 (' + cameraDiagnostics(err) + ')'; msg.hidden = false; }
        });
      }
    }
  }

  // ---------- manual view ----------
  function renderManual() {
    return (
      '<div class="manual">' +
      '<button class="icon-btn" id="backBtn">' + ICONS.back + '</button>' +
      '<h2 class="section-title">문제 직접 입력</h2>' +
      '<input type="search" id="manualInput" enterkeyhint="search" autocomplete="off" spellcheck="false" ' +
      'placeholder="문제 속 단어 2~3개 (예: 선하증권 법적 성질)" value="' + escapeHtml(state.manualText) + '">' +
      '<div class="hit-list" id="manualResults"></div>' +
      '</div>'
    );
  }
  function renderManualResults(text) {
    const box = document.getElementById('manualResults');
    if (!box) return;
    if (!text.trim()) {
      box.innerHTML = '<p class="hint-text">단어를 띄어서 입력하면 치는 동안 바로 찾아줘요.</p>';
      return;
    }
    const { items, exactCount } = keywordSearch(state.dataset.rows, text, 5);
    if (!items.length) {
      box.innerHTML = '<div class="empty-card">맞는 문제가 없어요. 다른 단어로 찾아보세요.</div>';
      return;
    }
    const head = exactCount
      ? '단어가 모두 들어간 문제 ' + exactCount + '개' + (exactCount > 5 ? ' · 단어를 더 넣으면 좁혀져요' : '')
      : '단어가 모두 들어간 문제는 없어서 비슷한 문제를 보여드려요';
    box.innerHTML = '<p class="row-count">' + head + '</p>' + items.map((m) =>
      '<div class="hit-card">' +
      '<div class="confidence-row"><span class="confidence-pill ' + (m.exact ? 'good' : 'warn') + '">' + (m.exact ? '단어 일치' : '비슷한 문제') + '</span>' +
      (m.sheet ? '<span class="sheet-tag">' + escapeHtml(m.sheet) + '</span>' : '') + '</div>' +
      '<p class="answer-q">' + escapeHtml(m.q) + '</p>' +
      '<p class="answer-a-wrap"><span class="answer-a">' + escapeHtml(answerLabel(m)) + '</span></p>' +
      '</div>'
    ).join('');
  }
  function bindManual() {
    document.getElementById('backBtn').addEventListener('click', () => setView('scan'));
    const input = document.getElementById('manualInput');
    let timer = null;
    input.addEventListener('input', () => {
      state.manualText = input.value;
      clearTimeout(timer);
      timer = setTimeout(() => renderManualResults(input.value), 120);
    });
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
    renderManualResults(input.value);
    input.focus();
  }

  // ---------- result view ----------
  function renderResult() {
    const best = state.matches[0];
    const alts = state.matches.slice(1);
    let confClass = 'warn', confLabel = '낮은 신뢰도';
    if (best) {
      if (best.score >= 0.55) { confClass = 'good'; confLabel = '일치도 높음'; }
      else if (best.score >= 0.25) { confClass = 'warn'; confLabel = '비슷한 문항'; }
    }
    return (
      '<div class="result">' +
      '<button class="icon-btn" id="backBtn">' + ICONS.back + '</button>' +
      '<div class="recognized-row"><span class="label">검색한 문제</span>' +
      '<div class="recognized-edit"><input type="text" id="recognizedInput" value="' + escapeHtml(state.query.text) + '">' +
      '<button class="icon-btn" id="researchBtn">' + ICONS.check + '</button></div></div>' +
      (best
        ? '<div class="answer-card"><div class="confidence-row"><span class="confidence-pill ' + confClass + '">' + confLabel + '</span>' +
          (best.sheet ? '<span class="sheet-tag">' + escapeHtml(best.sheet) + '</span>' : '') + '</div>' +
          '<p class="answer-q">' + escapeHtml(best.q) + '</p>' +
          '<p class="answer-a-wrap"><span class="answer-a">' + escapeHtml(answerLabel(best)) + '</span></p></div>' +
          (alts.length ? '<div class="alt-list">' + alts.map((m) => '<div class="alt-card"><span class="alt-q">' + escapeHtml(truncate(m.q, 40)) + '</span><span class="alt-a">' + escapeHtml(answerLabel(m)) + '</span></div>').join('') + '</div>' : '')
        : '<div class="empty-card">일치하는 문항을 찾지 못했어요. 위 텍스트를 수정해서 다시 검색해 보세요.</div>') +
      '<button class="btn-primary btn-block" id="rescanBtn">' + (state.querySource === 'camera' ? ICONS.camera + ' 다시 스캔하기' : ICONS.search + ' 다시 검색') + '</button>' +
      '</div>'
    );
  }
  function bindResult() {
    const back = () => setView(state.querySource === 'camera' ? 'scan' : 'manual');
    document.getElementById('backBtn').addEventListener('click', back);
    document.getElementById('researchBtn').addEventListener('click', () => {
      const val = document.getElementById('recognizedInput').value.trim();
      state.query = { text: val };
      state.matches = findMatches(state.dataset.rows, state.query);
      render();
    });
    document.getElementById('rescanBtn').addEventListener('click', back);
  }

  // ---------- settings view ----------
  function renderSettings() {
    return (
      '<div class="settings">' +
      '<button class="icon-btn" id="backBtn">' + ICONS.back + '</button>' +
      '<h2 class="section-title">설정</h2>' +
      '<div class="info-card">' +
      '<div class="info-row"><span>불러온 파일</span><strong>' + escapeHtml((state.dataset && state.dataset.fileName) || '-') + '</strong></div>' +
      '<div class="info-row"><span>문항 수</span><strong>' + ((state.dataset && state.dataset.rows.length) || 0) + '개</strong></div>' +
      '<div class="info-row"><span>저장 위치</span><strong>이 브라우저에만 저장</strong></div>' +
      '<div class="info-row"><span>사진 인식</span><strong>PaddleOCR PP-OCRv5 (무료)</strong></div>' +
      '</div>' +
      '<button class="btn-secondary btn-block" id="replaceBtn">' + ICONS.upload + ' 새 엑셀 파일로 교체</button>' +
      '</div>'
    );
  }
  function bindSettings() {
    document.getElementById('backBtn').addEventListener('click', () => setView(state.dataset ? 'scan' : 'upload'));
    document.getElementById('replaceBtn').addEventListener('click', () => { state.uploadDraft = null; setView('upload'); });
  }

  // ---------- init ----------
  function init() {
    let ds = loadLocal();
    if (!ds && typeof EMBEDDED_WORKBOOK !== 'undefined' && EMBEDDED_WORKBOOK.length) {
      const rows = extractEmbeddedWorkbook(EMBEDDED_WORKBOOK);
      if (rows.length) ds = { rows, fileName: '해운실무기출문제.xls (내장됨)' };
    }
    state.dataset = ds;
    setView(ds ? 'scan' : 'upload');
    getOcrEngine().catch(() => {});
  }
  init();
})();
</script>
</body>
