onal Convention for the Unification of Certain Rules of Law Relating to Bills of Lading, 1924","③","","","",""],["233","다음 중 복합운송의 경우가 아닌 것은?","① 운송책임의 단일성     ② 복합운송증권발행\n③ 일관운임설정          ④ 운송주선인만 관여한 운송","④","","","",""],["234","다음중 복합운송인이 발행하는 복합운송증권(CTD)의 특징으로 적절하지 못한 것은?","① 도로․철도․내수로․해상 또는 항공운송이 결합된 복합운송이 상이한 운송인에 의하여 이루어지더라도 복합운송증권은 처음부터 끝까지 전운송구간을 커버하는 서류이다.\n② 복합운송증권은 복합운송인에게 통운송(through transport)의 전체적인 책임을 지고, 어느 구간에서 발생하였든 화물의 멸실이나 손상에 대해 책임을 지는 해상운송인이 발행한다. \n③ 복합운송증권은 실질적인 운송인(actual carrier)에 의해서만 발행되는 선하증권과는 달리 운송인 뿐만 아니라 운송주선인(freight forwarder)에 의해서도 발행된다.\n④ 복합운송증권은 본선적재 전에 복합운송인이 수탁 또는 수취한 상태에서 발행되는 서류이다.","②","","","",""],["235","다음 중 정기선 경영회사의 경영요건과 관련이 적은 것은?","① 적절한 수의 선박          ② 1척의 선박만으로도 운영 \n③ 해외점포구성              ④ 터미널 시설구비","②","","","",""],["236","다음에서 부정기선을 경영하는 회사가 중점을 두어야 할 사항과 관계가 먼 것은?","① 적절한 배선을 통한 유리한 수요에 계약   ② 운임률의 급격변동 고려\n③ 전용부두 및 창고를 구비                ④ 정확한 정보수집을 통한 물동량 파악","③","","","",""],["237","장기운송계약(COA)를 체결했을 해운경영에 주는 이점에 적절한 내용이 아닌 것은?","① 장기계약을 담보로 자금조달용이         ② 해운시황변동에 따른 위험을 감소\n③ 단기용선을 통해 조달하여 안정성 확보   ④ 안정된 경영으로 해운 산업발전에 기여","③","","","",""],["238","다음 중 해운기업에서의 품질관리의 중요성이 대두된 배경을 설명한 것과 관계가 적절하지 못한 것은?","① 선박의 전문화 및 대형화              ② 해양오염 및 해양사고의 대형화\n③ 해양환경보호를 위한 시스템 개발       ④ 해운구간의 단일운임을 적용과 책임","④","","","",""],["239","다음 중 해운기업의 품질관리를 위한 ISM 코드의 목적으로 타당하지 않은 것은?","① 국제적 기준 이상의 수준유지\n② 선박의 안전 및 해양오염방지\n③ 해운기업의 해상 및 육상부서의 안전관리 시스템 수립\n④ 선박안전관리에 관련된 사람의 범위를 축소하여 인건비 절약","④","","","",""],["240","다음에서 ISM코드의 경제적인효과를 통한 기대효과로 올바르지 않은 것은?","① 인명과 재산피해의 감소    ② 생산성향상을 통한 비용의 절감\n③ 보험료의 상승             ④ 대형해난 사고의 최소화","③","","","",""],["241","ISM 코드에 의거한 안전관리시스템은 의무적으로 외부심사를 받아야 하는 내용을 설명한 것 중 올바르지 않은 것은?","① 육상조직 - 매년 연차심사      ② 선박 - 2년 6개월에 중간심사\n③ 선박 - 매 5년마다 갱신심사    ④ 육상조직 - 매 2년마다 갱신심사","④","","","",""],["242","다음에서 ISM 코드의 기대 효과라고 할 수 없는 것은?","① 인명과 재산 피해를 야기시킬 수 있는 사고의 감소        \n② 선박 운항 효율의 증가\n③ 안전 및 환경보호를 위한 안전문화의 확립     \n④ 항만국 통제(PSC)의 면제","④","","","",""],["243","다음 중 해사관습과 해사실무를 통일하는 해사사법의 기관은? ","① UN 무역개발회의(UN Conference on Trade and Development)\n② 국제해법회(Commite Maritime International)\n③ 국제해사기구(Inter-Governmental Maritime Consulatiative Organization)\n④ 국제해운회의소(International Chamber of Shipping)","②","","","",""],["244","다음 중 운송인인 선박회사가 다수의 송화인의 개개의 화물을 운송하는 것을 인수하는 계약은?","① 용선운송계약      ② 정기용선계약\n③ 개품운송계약      ④ 항해용선계약","③","","","",""],["245","다음 중 항해용선계약의 특징을 설명한 것으로 바람직하지 못한 것은?","① 선장은 선주가 임명한다. \n② 항해 항차수를 계약내용으로 한다. \n③ 용선자가 부족한 선복을 보충하기 위해서이다.\n④ 항해에 대한 대가는 운임이며, 선박적재량 또는 선복량에 따라 지불한다. ","③","","","",""],["246","다음에서 해상기업으로 적용되지 않는 것은?","① 해상예선업      ② 해난구조업        ③ 해상보험업      ④ 준설업","③","","","",""],["247","다음 해상운송에서 선박의 성질에 관한 설명 중 올바른 것은?","① 동산성     ② 비인격성      ③ 합성물      ④ 법인성","③","","","",""],["248","다음에서 해상기업의 주체가 아닌 자는 누구인가?","① 정기용선자      ② 선박공유자     ③ 선박소유자      ④ 선박의 선장","④","","","",""],["249","다음에서 해상운송은 컨테이너화 되어 가고 있는데 그 이유로 올바른 것은?","① 자본이 적게 소요된다.         ② 선박의 정박 기간이 늘어난다.\n③ 안전하게 운송할 수 있다.      ④ 하역인부를 많이 고용할 수 있다.","④","","","",""],["250","해운원가의 특성을 기술한 것 중 바람직하지 못한 것은?","① 운송원가는 생산을 전제로 원가각 계상된다. \n② 해운원가는 진행기준(기간별) 원가계산이다. \n③ 해운원가에서 금리는 선비로 인정되지 않는다. \n④ 복합운송의 경우는 그에 따른 원가도 계상해야 한다. ","③","","","",""],["251","해운원가의 구성요소로 해당되지 않는 것은?","① 자본비     ② 관리비      ③ 재고비      ④ 운항비","③","","","",""],["252","화물량의 증감에 따라 비례하여 발생하는 제반비용은?","① 화물변동비     ② 운항변동비    ③ 운항고정비    ④ 일반관리비","①","","","",""],["253","선박을 운항가능한 상태로 유지하기 위한 비용은?","① 일반관리지     ② 운항변동비    ③ 운항고정비    ④ 영업외비용","③","","","",""],["254","다음 중 선박의 입출항 및 정박을 위한 제반비용인 항비의 종류가 아닌 것은?","① 도선료(pilotage)                      ② 예선료(tug charge)                                          ③ 부두사용료(wharfage)                 ④ 운항준비비(Running cost)","④","","","",""],["255","화물변동비 중 화물 수입 및 화물량의 크기에 따라 발생하는 비용은 다음 중 어느 것인가?","① 하역비          ② 화물비\n③ 장비비          ④ 대리점비","④","","","",""],["256","해운용역을 생산하기 위한 원가의 발생을 인식하고 이를 분류, 종합, 분석하는 것을 의미하는 것은?","① 일반관리비계산          ② 선박취득관리비계산\n③ 운항준비비용계산        ④ 해운원각계산","④","","","",""],["257","해운원가계산의 목적으로 타당하지 않는 것은?","① 판매가격의 결정에 필요한 원가자료를 제공\n② 예산집행계획 및 통제에 필요한 원가자료를 제공\n③ 선박투입을 위한 운항준비비계상을 제공\n④ 화물운송에 따른 손익을 계산하는데 필요한 원가자료를 제공","③","","","",""],["258","해상운임의 종류에서 운임부과방법에 따른 분류로 적당하지 않은 것은?","① 종가운임(ad valorem freight)    ② 차별운임(discrimination rate)\n③ 최저운임(minmum rate)         ④ 경쟁운임(open rate)","④","","","",""],["259","북미 태평양 연안항만에거 하역되어 동부내륙지역으로 육상운송되는 화물에 대해 낮은 해상운임률을 적용하여 화물을 유치하기 위한 정책운임은 다음 중 어느 것인가?","① 무차별 운임(freight all kinds rate)  ② 경쟁운임(open rate)\n③ 특별운임(Special rates)            ④ O.C.P. Rate(overland common point rate)","④","","","",""],["260","한 개의 중량이 3톤 이상의 초중량화물에 부과하는 할증료는 다음 중 어느 것인가?","① 장척할증료(lengthy surcharge)         ② 중량할증운임(heavy lift surcharge)\n③ 용적할증운임(measurement surcharge)  ④ 체선할증료(port cogestion surcharge)","②","","","",""],["261","부정기선 운임의 산정기준에 대해 서술한 내용 중 적합하지 않은 것은?","① 운임조건은 용선계약에 의해 결정된다.    ② 운임은 적재화물의 수량에 대해 결정한다. \n③ 운임은 중량과 용적에 의해 결정된다.     ④ 운임은 선복에 대하여 결정되기도 한다. ","③","","","",""],["262","다음 중 부적운임(dead freight)에 대한 설명 중 적합한 것은?","① 기항지 간에 용적이나 중량 등을 기준으로 한 운임을 말한다.\n② 선적 시에 양하항을 확정하지 않고 출항 후 일정기간 뒤에 양하항이 지정되는 양하선택권부 화물에 부과하는 운임을 말한다. \n③ 송화인이 운송계약체결 후 화물의 관리를 태만하게 하였거나 또는 여약한 선적을 이행하지 못한 경우 선주에게 지불해야 할 운임을 말한다. \n④ 해운동맹이 비동맹선사와의 경재, 특정화물의 유치, 대량화물에 대한 우대 등을 위해 일정조전을 갖춘 굥우 요율을 인하하여 적용하는 운임을 말한다. ","③","","","",""],["263","다음은 해상운임의 지급 시기에 대하여 서술한 내용 중 적합하지 않은 것은?","① 해상운임은 선적과 동시에 송화인에게 지급하는 운임을 선불운임(freight prepaid)라고 한다. \n② 양륙지에서 매수인이 화물을 수령할 때 지급하는 운임을 후불운임(freight collect)라고 한다. \n③ 일반적으로 CIF계약이나 CFR계약에서는 통상운임이 후불로 지불 된다. \n④ FOB와 같이 후불인 경우에는 양륙지에서 화물인도지시서(Delivery Order) 발급일, 즉 운임지급일의 환율을 적용한다. ","③","","","",""],["264","다음에서 항공운송을 선택하는 화물의 종류라고 할 수 있는 것은?","① 고가화물(보석, 반도체 등)         ② 장척화물      ③ 저가화물        ④ 산적화물","①","","","",""],["265","다음 중 화물의 수량이 많은 경우에 이용할 수 있는 운송수단은?","① 자동차운송         ② 항공운송       ③ 해상운송        ④ 복합운송","③","","","",""],["266","다음 중 복합운송 할 때 화물의 손상에 대해 책임을 지는 사람은?","① 선주               ② 화주          ③ 트럭운송버자     ④ 복합운송인","④","","","",""],["267","다음에서 운송 물류 활동을 구성하는 요소가 아닌 것은?","① 운송모드(mode)  ② 운송 네트워크(network)  ③ 운송 노드(node)  ④ 운송 링크(link)","②","","","",""],["268","다음에서 정기선 항로에서 컨테이너 운송과 재래식 정기선에서 사용하는 계약은?","① 개품운송계약    ② 항해용선계약      ③ 정기용선계약      ④ 물건운송계약","①","","","",""],["269","부정기선 항로에서 항해용선계약을 체결 했을 시 운송의 책임자는 누구인가?","① 선주         ② 화주          ③ 해상운송인        ④ 중개인","③","","","",""],["270","개품운송계약의 대표적인 것은 컨테이너 운송이고, 이는 국제해운에서 어떤 계약으로 발전하였는가?","① 국제복합운송계약    ② 항해용선계약      ③ 정기용선계약      ④ 물건운송계약","①","","","",""],["271","해상운송인은 송하인에게 운항광고에 명시한 지정항과 운항표에 따라서 감항 능력이 있는 선박을 정시에 입항시켜야 할 의무는?","① 하역준비완료통지의무         ② 선박제공의 의무\n③ 감항능력주의의무             ④ 항해을 빨리 완성할 의무","②","","","",""],["272","다음에서 운송 모드(mode)에 해당되는 것이 아닌 것은?","① 해상운송    ② 복합운송      ③ 화물터미널    ④ 항공운송","③","","","",""],["273","다음에서 일반적으로 생산자의 공장에서 소비자의 문전까지 문전 서비스를 하는 형태의 운송 서비스는?","① 해상운송    ② 복합운송      ③ 철도운송    ④ 항공운송","②","","","",""],["274","다음에서 본선인도조건(free on board:FOB)에 대한 설명 중 적절하지 않은 것은?","① 무역 상거래 조건의 하나로 FOB의 가격은 수입항 인도 가격이라고 한다. \n② 매도인이 본선상에서 화물의 인도를 마칠 때까지의 일체의 비용과 위험을 부담한다. \n③ FOB의 가격은 무역상품을 수출항에서 매수자에게 인도할 때의 가격을 말한다. \n④ 화물의 인도이후에는 매수인의 책임이 된다.  ","①","","","",""],["275","화물을 도착항에서 인도를 받으려면 반드시 필요한 유가 증권은?","① 환어음  ② 선하증권     ③ 약속어음    ④ 지급위탁증권","②","","","",""],["276","본선이 목적항에 입항한 후 수화인은 선화증권을 선박회사에 주고 지급 받는 서류는?","① 화물인도지시서  ② 소요량증명서    ③ 원산지 증명서    ④ 구매확인서","①","","","",""],["277","다음에서 용선운송에서 B/L 보다 우선하는 것은?","① 지급위탁증권    ② 용선계약서    ③ 지연손해금    ④ 용선료","②","","","",""],["278","다음 중 자본력이 약한 운항선사가 선복을 보충하면서 선대(fleet)를 늘리는 일종의 할부제도 내지 리스제도는?","① 나용선계약       ② 항해용선계약\n③ 정기용선계약     ④ 선복용선계약","①","","","",""],["279","다음에서 발틱국제해사위원회에 대한 설명으로 적절한 것은?","① 1905년 발틱해와 백해지역의 교역에 주로 참여하던 선주들의 공동이익을 위하여 코펜하겐에서 창설된 순수 민간기구이다. \n② 국적을 불문하고 선박을 검사하고 선급을 정하여 100톤 이상의 모든 항해선의 등급과 내용이 기록된 Lloyd\u0027s Register Book을 통하여 정보를 제공함에 있다.\n③ 국가별 대리점협회와 개별 대리점으로 구성된 기구로서 1926년 비엔나에서 국제적인 대리업의 확장에 따른 제반 문제점을 다루기 위해 설립되었다.\n④ 선원문제에 관한 선주의 권익보호와 자문을 위해 1909년 창설된 민간기구로 런던에 본부를 두고 있다.","①","","","",""],["280","다음에서 운송인(carrier)인 선박회사가 다수의 송화인의 개개의 화물을 운송하는 것을 인수하는 계약은?","① 나용선계약       ② 개품용선계약       ③ 정기용선계약     ④ 선복용선계약","②","","","",""],["281","다음은 개품운송계약의 설명으로 올바르지 않은 것은?","① 개품운송계약에서 운송계약은 불요식 계약이므로 별도의 계약서 작성은 필요 없다.\n② 무역계약상의 가격조건에 따라 선복을 확보하여야 할 책임이 수출업자에 있는지 또는 수입업자에 있는지가 결정된다.\n③ 개품운송계약은 송화인 또는 그 대리인인 운송인이 선박회사, 대리점, freight forwarder 등이 발행하는 배선표를 잘 검토하여 적당한 선박을 선정한 다음 운송을 신청하여 운송인이 이를 승낙함으로써 운송계약이 체결된다. \n④ 타인소유의 선박을 일정한 조건을 정하여 차용할 때의 계약을 말한다.","④","","","",""],["282","다음에서 선주는 일체의 선박부속용구를 갖추고 선원을 승선시키는 등 선박의 운항상태를 갖추어 선박을 소정의 항구에서 용선자에게 인도하여야 하는 의무의 계약은?","① 나용선계약       ② 기간용선계약       ③ 정기용선계약     ④ 선복용선계약","②","","","",""],["283","다음에서 서로다른 운송수단이 2개이상 결합되어 있지만 운송구간에 대한 단일 책임을 지는 운송수단은?","① 해상운송    ② 항공운송      ③ 철도운송    ④ 복합운송","④","","","",""],["284","본선이 입항하면 CY 운영자는 집화된 컨테이너를 갠드리크레인을 사용하고 선적하고, 송화인에게 무엇을 발급해 주는가?","① 환어음  ② 지급위탁증권     ③ 약속어음    ④ 선하증권","④","","","",""],["285","다음에서 운송수단을 직접 보유하지 않고 선박회사, 항공회사, 철도회사 등의 실제운송인을 하청운송인으로 사용하여 운송사업을 하는 자는?","① 철도운송인    ② 해상운송인     ③ 항공운송인     ④ 복합운송인","④","","","",""],["286","다음의 국가들 중 Hague Rules에 가입을 하지 않은 나라는?","① Canada    ② France     ③ Australia    ④ Japan","②","","","",""],["287","다음에서 선하증권의 이전(transfer)에 대한 설명으로 적절하지 않은 것은?","① 선하증권 소유자가 자기의 소유권을 새로운 소유자에게 이전시키는 목적으로 그 물건을 타인에게 교부하는 것을 이전(transfer)이라 한다. \n② 지시식 선하증권, 배서금지문언이 없는 기명식 선하증권, 무기명식 선하증권 및 선택무기명식 선하증권의 이전은 양도라고 한다. \n③ 양도배서금지문언이 있는 기명식 선하증권의 이전은 지명채권양도라고 한다.\n④ 선하증권에서 양도는 기명식 선하증권에 대하여 사용된다. ","④","","","",""],["288","다음에서 기명식 선하증권과  이전(transfer)에 대한 설명으로 올바르지 않는 것은?","① 기명식 선하증권은 양도는 가능하다.  \n② 기명식 선하증권의 양수인은 양도된 취지를 운송인에게 합법적으로 통지하여야 된다.\n③ 기명식 선하증권의 양도된 사실을 통지 하기 전에 이미 양도인에게 물건이 인도된 경우에 양도는 무효가 된다.\n④ 선하증권에서 양도는 기명식 선하증권에 대하여 사용된다. ","③","","","",""],["289","다음에서  해상화물 운송장의 법적 특징으로 관계가 먼 것은?","① 물품을 수취 또는 선적을 증명하는 서류라는 점에서는 B/L의 성격과 일치한다.\n② 물품을 인수하기 위하여 수화인의 운송인에게 제시하여야 하는 B/L과는 달리 제시할 필요가 없다.\n③ 해상화물운송장은 물품을 대표하는 유가증권적 성격이 강하다. \n④ 해상화물운송장은 기명식으로된 유통불능성의 성격을 지니고 있다. ","③","","","",""],["290","다음 중 선하증권의 이전과 관련된 용어의 부적절한 설명은?","① 이전은 유통증권 또는 권리증권의 소유자가 자기의 소유권을 새로운 소유자에게 이전시키는 목적으로 그 물건을 타인에게 교부하는 것을  말한다. \n② 유통은 양도의 개념으로 증권상의 권리를 유통이라는 방법으로 양수받은 자는 증권상의 정당한 권리자이지만, 정당한 소지인이 아니다. \n③ 배서는 유통증권의 소지인이 가지고 있는 증권상의 권리를 타인에게 이전하는 목적으로 통상 그 증권의 배면에 서명하고 피이전자에게 이것을 교부하는 것을 말한다. \n④ 양도는 화물의 양도와는 달르기 때문에 배서의 형식과  그 방법은 중요치 않다. ","④","","","",""],["291","다음에서 Hague Rules에 대한 설명으로 적합하지 않은 것은?","① Hague Rules는 선하증권에 대한 약간의 통일에 관한 국제조약이다. \n② Hague Rules는 각국의 해상물건운송법에 대한 특별법의 지위만을 가지고 있을 뿐이다. \n③ Hague Rules의 적용을 받는 해상물건운송계약은 선하증권 또는 이와 유사한 권리증권에 의해 증명된 운송계약에 한한다.\n④ Hague Rules는 단순히 선하증권만을 규정하는 통일법으로 그 지위를 갖는다. ","④","","","",""],["292","다음에서 유통불능선하증권(Non-negotiable B/L)에 대한 설명으로 올바르지 않는 것은?","① 유통불능선하증권(Non-negotiable B/L)은 권리증권이라고 볼 수 없다. \n② 유통불능선하증권은 물건을 수령해야 할 사람이 특정인으로 되어 있는 기명식 선하증권(Straight B/L)을 말한다.\n③ 유통불능선하증권은 물건의 인도청구권을 표창하고 물건을 상징하고 있기 때문에 권리증권이라고 할 수 있다. \n④ 유통불능선하증권의 경우, 선박회사는 물건을 목적지에서 수화인 난에 기재된 특정인에 인도하는 의무를 부담하고 있으므로 선하증권의 제시와는 관계가 없다. ","③","","","",""],["293","다음에서 유통가능선하증권(Negotiable B/L)에 대한 설명으로 부적합한 것은? ","① 유통가능선하증권(Negotiable B/L)은 선하증권의 수화인 난에 To order of Mr. A, To bearer라고 기재되어 있는 경우이다. \n② 유통가능선하증권은 배서 또는 인도에 의하여 유통되므로 운송인은 증권의 제시없이도 인도할 수 있다.\n③ 유통가능선하증권의 경우 운송인은 증권의 회수가 없으면 물건을 인도할 수 없으므로 증권의 소지인은 물건들을 완전하게 점유할 수 있다.\n④ 유통가능선하증권은 물건의 상징이고 완전한 권리증권이다.","②","","","",""],["294","다음 중 만약 본선이 도착하였음에도 불구하고 선하증권이 도착하지 아니한 경우의 해결책으로 가장 좋은 방법은?","① 우선, 본선이 그 항에서 서류가 도착하는 것을 기다리는 방법이 있을 수 있다. \n② 선박회사가 선박의 체선을 피하기 위하여 화물을 하역 또는 양륙하여 창고에 보관하는 방법이 있을 수 있다. \n③ 현재 실무적으로 광범위하게 사용되고 있는 것이 화물의 L/G(Letter of Guarantee; 수입화물선취보증서) 인도를 통해 문제를 해결 할 수 있다. \n④ 물품의 인도를 신속히 하고 서류의 분실에 따른 제반위험을 회피하고자 하는 목적으로 비유통성 해상화물운송장(Non-Negotiable Sea Waybill)을 사용할 수 있다.  ","④","","","",""],["295","다음 중 선하증권이 인도에 의해 유통되는 경우에 관한 설멍으로 바람직하지 않은 것은?","① 선하증권은 지참인식으로 발행되어 지참인식의 배서를 한경우에는 인도만으로 유통한다. \n② 선하증권이 특정인의 지시식으로 발행되어 그 자가 백지백서애 배서한 경우에는 인도만으로 유통한다. \n③ 선하증권은 지참인식으로 발행되기 때문에 언제든지 인도만으로 유통할 수 있다. \n④ 선하증권은 분실할 경우 위험이 있기 때문에 실제로 지참인식으로 발행되는 경우는 거의 없으므로 배서를 해야만 인도 유통이 가능하다. ","③","","","",""],["296","다음에서 배서에 대한 설명으로 부적당한 것은?","① 지시식의 어음, 수표 또는 지시금지가 없는 기명식의 어음, 수표 등 유가증권을 제3자에게 양도하는 방법을 말한다.\n② 소지인식은 피배서인을 지정하지 아니하고 단순히 소지인에게 인도하라는 취지의 인도문언과 함께 배서인이 서명하는 방법이다. \n③ 양도방법이 배서에 의하도록 결정되어 있는 경우 배서 이외의 방법으로 양도할 수 있다. \n④ 신용장에서 요구되고 있는 환어음, 운송증권 등은 전형적인 증권적 채권이므로 배서에 의하여 제3자에게 자유로이 양도될 수 있다. ","③","","","",""],["297","다음에서 연지급신용장과 같은 효과를 지닌 신용장은?","① 매입신용장(negotiation credit)     ② 인수신용장(acceptance credit)   \n③ 지급신용장(payment credit)       ④ 확인신용장(confirmed credit)","②","","","",""],["298","다음에서 Siberian Land Bridge(SLB)에 의한 국제복합운송경로의 운송구가별 적용법규가 알맞게 연결된 것은?","① 해상운송기간: 사회주의 연락운수 규칙 \n② 소련 국경에서 유럽국경까지의 철도운송구간: 도로에 의한 국제물품운송에 관한 국제조약\n③ 유럽 및 소련 내륙 도로운송구간: 도로에 의한 물품 운송에 관한 국제조약\n④ Vostochny에서 소련 국경까지의 철도운송구간: Hague Rules  ","③","","","",""],["299","다음은 해상화물운송장의 단점을 설명한 것으로 적당하지 않은 것은?","① 자유로이 수화인을 변결할 수 있으므로 화환어음을 매도하기 위해서는 은행을 수화인으로 해야 한다. \n② 해상화물운송장의 제출 없이도 물품을 인도 받을 수 있기 때문에 L/G인도에 따른 문제로 화물인도를 신속히 할 수 있다.\n③ 해상화물운송장은 권리증권이 아니기 때문에 항해 중에 증권을 이전함으로써 물품을 전매하는 것이 불가능하다. \n④ 해상화물운송장은 담보력이 없다.","②","","","",""],["300","다음에서 선하증권에서 운송물의 동일성을 표시하는 사항을 기입할 필요에 대한 설명으로 적당한 것은?","① 해상화물 운송에 있어서 화물의 적재를 손쉽게 할 수 있기위해서 이다. \n② 선하증권은 원래 본선의 선장이 발행하는 해상운송물의 수취증과 같은 역할을 하기 때문이다. \n③ 화물의 대금을 정확하게 지불 받기위해서이다. \n④ 화물의 최종 목적지에서 확인은행의 대리인에게 대금의 지불수단으로 사용하기 위해서이다. ","②","","","",""],["301","다음 선하증권의 송화인에 대한 설명으로 올바르지 않은 것은?","① 선하증권에 기재될 모든 사항을 정확하게 운송인에게 신고하여야 하고 부정확한 사항으로 인한 손실 및 비용에 대하여 책임을 져야 한다. \n② 운송인이 서명한 선하증권(bill of lading)을 취득할 권리를 가진 자이다.\n③ 선하증권 발행자인 운송인은 권리 양도증서가 없어도 선하증권상에 기재된 송화인이 아닌 자에게 선하증권을 교부할 수 있다.\n④ 위험물의 등급에 적합한 용기에 포장하고 위험물임을 표시하는 mark 및 label을 부착할 의무가 있다","③","","","",""],["302","다음에서 복합운송증권에 대한 개념을 잘못 설명하고 있는 것은?","① 복합운송에 대해 복합운송인이 발행한는 증권이다.\n② 발행자인 운송인이 운송품의 수령을 증명하고, 운송계약의 증거가 되는 권리증권의 성격이다. \n③ 복합운송증권은 선하증궘과 똑같이 유통증권으로서의 기능을 갖고 있다. \n④ 복합운송증권은 선하증권과 달리 유가증권의 성격을 갖고 있지 않다. ","④","","","",""],["303","다음 중 매입신용장에서 추심은행의 역할은?","① 매수인의 대리인     ② 매도인(어음의 발행인)의 대리인\n③ 지급은행의 대리인   ④ 확인은행의 대리인","②","","","",""],["304","다음은 OCP(Overland Common Point)에 대한 설명으로 부적절한 것은?","① 미국대륙에서 공동운임을 과징하는 지역을 말한다.\n② 우리 나라 수출업자들이 OCP지역에 대하여 관심을 갖고 있는 것은 이 지역으로 가는 OCP화물이 OCP Rate라는 할인운임의 혜택을 받고 있기 때문이다\n③ 최근에는 선사들에 의한 MLB 및 IPI 일반수송이 발달함에 따라 OCP Service는 증가하고 있다. \n④ OCP서비스를 이용하려는 경우 선하증권이면에 OCP목적지, 운송수단(철도, 트럭, 항공), OCP운송인을 명시하여야 한다","③","","","",""],["305","다음 중 복합운송서류가 자동수리 되기 위해서 갖추어야 할 요건과 관계가 없는 것은?","① 상품의 발송, 수탁 또는 본선적재 내용을 명기하여야 한다. \n② 용선계약 또는 범선에 선적하였다는 표시가 있어야 한다. \n③ 약식운송서류도 수리할 수 있다. \n④ 발급된 원본 모두가 제시되어야 한다. ","②","","","",""],["306","다음 한국, 대만, 홍콩, 호주지역은 NVOCC의 어느 국가가 총대리점으로 TRS 서비스를 맡고 있는가?","① 러시아  ② 영국     ③ 프랑스      ④ 독일","④","","","",""],["307","다음은 중국대륙의 국제복합운송경로에 대한 설명으로 적합하지 않은 것은?","① 중국대륙을 횡단하여 유럽까지 화물을 운송할 수 있는 중국횡단철도(Trans Chinese Rail :TCR)가 1992년 12월 1일부터 개통되었다\n② TCR은 러시아의 Vostochny를 통하여 북유럽으로 가는 시베리아횡단 철도(TSR)보다 2,000㎞ 가량 거리가 짧아 졌다.  \n③ 부산에서 로테르담까지 해상운송하는 거리가 10,370㎞인데 이 TCR을 이용하면 해상운송거리보다 9,420㎞정도로 짧아지고 운송기간도 1주일 정도 줄일 수 있다. \n④ TCR을 이용하여 유럽행 화물을 운송하는 경우 운송비를 15∼20% 정도 절감시킬 수 있다. ","③","","","",""],["308","다음 중 신용장의 이용을 규율하고 있는 규칙으로 신용장통일규칙은 언제 탄생되었는가?","① 1933년    ② 1983년       ③ 1905년      ④ 1972년","①","","","",""],["309","다음 중 MLB의 운송경로에 대해 알맞게 설명한 것은?","① 미국대륙이 극동과 유럽을 이어주는 운송시스템에서 다리역할을 한다는 개념에서 Mini Land Bridge라고 부른다.\n② LA-NY간의 북미 내륙운송비가 비싸기 때문에 SLB보다 경쟁력이 약하다.\n③ MLB서비스선박회사 중에는 국내선사로서 한진해운, 현대해운 등이 있고, 외국선사는 APL, Sea-Land, BBS, Evergreen Line, Maersk 등이 있다.\n④ 한국에서 북미의 서해안항까지 해상운송되고 그 항구에서 철도에 환적된 다음 미국의 주요도시까지 철도운송된다. ","③","","","",""],["310","다음에서 Sea\u0026Air 복합운송의 유용성에 대한 특성으로 알맞지 않은 것은?","① 적정재고의 조절 \n② 적기선적의 운송수단 \n③ 운송기회 및 시설부족지역의 운송수단 \n④ 도난의 위험성이 많은 유럽 및 동남아시아지역으로의 해상운송의 대체운송수단","④","","","",""],["311","다음 중 해상운송을 통하여 화물을 보내는 것이 불안한 지역 또는 국가로 해당되지 않는 곳은?","① West Indies    ②  Africa     ③ North America     ④ Latin America ","③","","","",""],["312","다음에서 매입신용장의 지급인이 아닌 것은?","① 신용장 발행 은행 ② 신용장발행은행의 본 지점  ③ 환거래은행   ④ 수출지의 은행","④","","","",""],["313","다음 중 항만시설이 빈약하거나 Port Congestion이 심한 지역이 아닌 곳은?","① Venezuela   ② Iceland   ③ Incheon     ④ African Ports ","③","","","",""],["314","다음에서 4면이 육지로 둘러 쌓여 있는 내륙국가로서 이웃나라의 항구를 이용하여 화물을 수입하는 국가가 아닌 국가는?","①  Zambia   ② Iraq   ③ Nigeria     ④ Austria ","②","","","",""],["315","물건의 국제운송은 2개의 체약국간에 이루어지는 것을 필요하지 않는데 다음의 해상운송에 적용되지 않는 경우는?","① 해상운송계약 중에 정해진 선적항이 체약국에 있을 때 \n② 선하증권 또는 해상운송계약을 증명하는 기타의 증권이 체약국에서 발행될 때 \n③ 해상운송계약 중에 정해진 양하항이 체약국에 있을 때 \n④ 해상운송계약 중에 정해진 선택양하항이 가상의 양하항이고 또 체약국에 없을 때 ","④","","","",""],["316","Sea \u0026 Air 복합운송서비스에서 Carrier형에 대한 설명으로 알맞은 것은?","① 확실한 화물의 취급, 정확한 운송소요일수, 운송정보 등을 화주에게 제공하고 있다.\n② 선사와 항공사의 일정한 스페이스를 연간계약으로 확보하고 양쪽의 운임에 자기의 서비스비용을 가산하여 통운임을 정한다.\n③ 중계지점으로부터 최종목적지까지를 자기회사소속 항공기만 이용하는 서비스 형태이다. \n④ 직접 화주에 판매하지 않고 주로 포워더에게 도매를 하는 점이 특징이다,","③","","","",""],["317","FIATA(International Federation of Freight Forwarder Association) 복합운송증권에 관한 설명으로 옳지 않은 것은?","① 프레이트 포워더(Freight Forwarder)는 화주의 단독위험으로 화물을 보관할 수 있다.\n② FBL에 따르면, 화물의 손상, 멸실 등의 경우, 프레이트 포워더는 무과실을 입증하지 못하는 한 배상책임을 면할 수 없다.\n③ 해상운송이나 내수로운송이 포함되지 않은 국제복합운송의 경우, 프레이트 포워더의 책임은 멸실 또는 손상된 화물의 총중량 1kg당 8.33SDR(Special Drawing Rights)을 초과하지 않는 금액으로 제한된다.\n④ 프레이트 포워더의 총책임은 화물의 전손에 대한 책임한도를 초과한다. ","④","","","",""],["318","합화물터미널사업의 등록을 한 자가 그 등록한 사항을 변경하고자 하는 경우에는 변경등록을 하여야 한다. 다음 중 복합화물터미널사업의 변경등록을 하지 않아도 되는 경미한 사항만으로 올바르게 묶인 것은 무엇인가?","① 화물터미널의 부지면적을 10% 범위 내에서 변경하는 것, 화물터미널의 구조ㆍ설비를 변경하는 것, 영업소의 명칭ㆍ소재지를 변경하는 것, 공사기간을 변경하는 것\n② 화물터미널의 부지면적을 10% 범위 내에서 변경하는 것, 화물터미널의 구조ㆍ설비를 변경하는 것, 영업소의 명칭ㆍ소재지를 변경하는 것\n③ 화물터미널의 부지면적을 20% 범위 내에서 감소시키는 것, 화물터미널의 구조ㆍ설비를 변경하는 것, 영업소의 명칭ㆍ소재지를 변경하는 것, 공사기간을 변경하는 것\n④ 화물터미널의 부지면적을 5% 범위 내에서 변경하는 것, 화물터미널의 구조ㆍ설비를 변경하는 것, 영업소의 명칭ㆍ소재지를 변경하는 것","②","","","",""],["319","다음에서 선하증권의 전자화와 관련한 설명으로 거리가 먼 것은?","① 전자선하증권은 전자네고 구현을 위한 핵심기반이다. \n② 1990년 전자선하증권에 관한 CMI 통일규칙이 제정되었다. \n③ Bolero는 전자선하증권의 유통을 위해 Rule Book을 활용한다. \n④ TradeCard는 전자선하증권 서비스를 세계 최초로 제공하였다. ","④","","","",""],["320","다음 중 복합운송의 특징에 속하지 않는 것은?","① 두가지 이상의 서로 다른 운송수단에 의해 물품이 운송되어야 한다. \n② 복합운송인이 전 구간 운송에 대해 주체로서 책임을 진다. \n③ 선박, 선적항 또는 양륙항과 관련하여 \"예정된\" 이라는 표시가 있는 복합운송서류는 수리할 수 있다.  \n④ 복합운송서류는 반드시 물품이 본선에 적재된 후에 발급된다. ","④","","","",""],["321","신용장에서 요구하는 B/L의 조건이 다음과 같을 경우 B/L의 Consignee란에 표시되는 내용 중 가장 정확한 것은?\n\n\"Full Set of Clean on Board Bills of Landing Made Out to Order of Korea XX Bank, Notify Applicant\"","① TO ORDER                               ② APPLICANT\n③ TO ORDER OF KOREA XX BANK           ④ KOREA XX BANK ","③","","","",""],["322","다음에서 Hague Rules에 관한 설명으로 옳지 않은 것은?","① 운송인은 본선 선적개시 시부터 출항 시까지 선박의 내항성(Seaworthiness)에 대한 주의를 게을리 하지 말아야할 의무가 있다.\n② 항해 또는 선박 자체의 취급에 대하여 선장이나 선원의 과실인 항해과실에 대하여는 운송인이 책임진다.\n③ 선박의 항해에 필요한 승조원을 배치하고 선박의 의장 및 필수품을 보급할 의무가 운송인에게 있다.\n④ 운송인은 물품의 선적, 적부, 운송, 보관 또는 양하가 적절하고 신중하게 행하여 지지 않아서 발생한 물품의 손해에 대하여 책임을 면할 수 없다.","②","","","",""],["323","이종책임체계(Network Liability System)는 화주에 대하여 복합운송인이 전 운송구간에 걸쳐 책임을 부담하지만 손해발생 구간이 확인 된 경우 해상운송구간에서는 무엇에 의해 책임체계가 결정되는가?","① Warsaw Convention    ② CIM 조약     ③ CMR 조약      ④ Hague Rules","④","","","",""],["324","다음에서 Hague Rule의 적용범위를 규정하고 있는 측면으로 해당되지 않는 것은?","① 지리적 측면    ② 인적 측면       ③ 내용적 측면      ④ 경제적 측면","④","","","",""],["325","1980년 UN 국제복합운송조약에서 채택하고 있는 복합운송인의 책임제도는?","① Unifor Liability System           ② Modified Uniform Liability System\n③ Tie-up System                   ④ Flexible Liability System","②","","","",""],["326","다음 해상운송인의 책임을 규정한 선화증권에 대한 국제조약과 관련이 없는 것은?","① Hague Visby Rules             ② Harter Acts\n③ Hamburg Rules                ④ York Antwerp Reules","④","","","",""],["327","다음의 선하증권의 법정기재사항 중 중량 및 용적에 (weight or Measurement)에 관련된 내용과 관계가 적은 것은?","① 개품운송계약의 운임산정기준은 중량톤 또는 용적톤 중 큰 쪽을 선택하도록 되어 있기 때문에 선하증권에 중량과 용적을 함께 기재하고 있다.\n② 운송물의 중량과 용적은 포장물을 포함한 총중량과 총용적을 기재한다\n③ 선하증권에 기재된 중량은 수출입 실적의 기준이 된다\n④ 선하증권상의 중량은 송화인의 손해배상 책임의 기준이 된다. ","④","","","",""],["328","복합운송은 서로 다른 운송수단을 결합하여 운송하는 형태를 말하는데 다음 중 복합운송시스템으로 볼 수 없는 것은?","① 피기백(Piggy-back)시스템\n② 시앤에어(Sea-and-Air)운송시스템\n③ 랜드브리지(Land bridge)시스템\n④ 허브앤스포크(Hub-and-Spoke)운송시스템","④","","","",""],["329","다음에서 선하증권의 유통의 효과를 설명한 것으로 관계가 먼 것은?","① 물건의 인도 청구권의 이전    ② 물건의 소유권의 이전\n③ 물건의 담보권의 이전         ④ 물건의 이익의 이전","④","","","",""],["330","합운송주선업의 등록을 하고자 하는 자는 1억원 이상의 보증보험에 가입하여야 한다. 다음 중 보증보험 가입의 의무가 면제되는 경우로 가장 올바르게 묶인 것은?","① 자본금이나 자산평가액이 10억원 이상인 경우, 금융기관에서 2억원 이상의 지급 보증을 받은 경우\n② 자본금이나 자산평가액이 20억원 이상인 경우, 금융기관에서 1억원 이상의 지급 보증을 받은 경우\n③ 금융기관에서 15억원 이상의 지급 보증을 받은 경우, 3억원 이상의 화물배상책임보험에 가입한 경우\n④ 금융기관에서 1억원 이상의 지급 보증을 받은 경우, 자본금이나 자산평가액이 10억원 이상인 경우, 1억원 이상의 화물배상책임보험에 가입한 경우, 컨테이너 장치장을 소유하고 있는 경우","④","","","",""],["331","다음 중 복합운송(Multimodal Transport)방식에 적합한 정형무역 거래조건(Trade Terms)만으로 나열된 것은?","① CIP, DAF, FAS       ② CFR, CIP, FOB\n③ CPT, FCA, CIP       ④ FCA, CIF, CIP","③","","","",""],["332","다음 중 Hague Rules의 선하증권의 기재사항으로 관계가 없는 것은?","① 주요한 화인(leading mark)    \n② 수화인의 신용정도\n③ 화물의 외관상 상태  \n④ 각 경우에 따라 송화인이 서면으로 제출한 포장화물의 개수, 수량 또는 중량  ","②","","","",""],["333","다음 중 해상운송에서 선주가 선박의 편의치적(Flag ofConvenience)을 선호하는이유와 관계가 없는 것은?","① 금융기관이 선박에 대한 권리행사가 용이하기 때문에 국제금융시장에서 자금조달이 용이하다.  \n② 선박의 운항 및 안전기준 등의 이행회피에 따르는 비용절감이 가능하다.\n③ 편의치적선으로 등록된 선박은 세계 각국의 항만에서의 입출항이 용이하다. \n④ 선박운항에 따른 재무상태, 거래내역을 정부에 보고하지 않는 등 선박운항에 따른 정부의 지도 감독회피가 가능하다.","③","","","",""],["334","신용장결제방식에 의한 국제화물운송의 경우에, 환적(Transhipment)에 대한 설명으로 옳지 않은 것은?","① 환적은 화물의 훼손 및 멸실의 가능성이 있으므로 매수인의 경우 환적을 허용하기를 꺼\n리게 된다.\n② 복합운송이나 컨테이너 화물인 경우 환적에 대한 언급이 없는 경우 환적이 허용되는 것\n으로 본다.\n③ 환적은 일반적으로 선적항에서 목적항까지의 운송과정에서 본선으로부터 양하 및 타선으\n로의 재적재의 이적(移積)과정을 거치는 것을 말한다.\n④ 환적 금지조항이 있으면 해상운송 뿐만 아니라 복합운송 및 항공운송의 경우에도 환적은 당연히 금지된다.","④","","","",""],["335","다음 포워딩(Forwarding) 업무 중 LCL화물을 집화하여 FCL화물로 만드는 업무는?","① Projection         ② Combination\n③ Consolidation      ④ Packaging","③","","","",""],["336","다음 중 Hague Rules의 지리적 범위에 대한 설명으로 올바르지 않은 것은?","① 제10조에 의거하면 Hague Rules는 체약국 내에서 발행되는 모든 선하증권에 적용된다. \n② 비체약국간의 3국간 항로에도 선하증권이 발행되는 경우에는 Hague Rules가 적용된다. \n③ Hague Rules는 입하 및 출하의 양쪽 적하품에만 적용된다. \n④ 선하증권은 통상의 경우 출발항에서 발생되므로 현실로는 체약국에서 떠나는 적하품 전부에 대하여 Hague Rules가 적용된다. ","③","","","",""],["337","다음 중 Freight Forwarder의 주요 업무에 해당하지 않는 것은?","① 통관대행        ② 운송관련 서류의 작성\n③ 운송의 수배     ④ 선박의 운항스케줄에 따른 배선","④","","","",""],["338","다음 중 선하증권의 배서와 환어음의 배서의 차이점을 설명한 것으로 거리가 먼 것은?","① 환어음은 일단 정당한 소지인에게 양도되면 권리나 양도인에 대한 개인적 항변에 침해받지 않기 때문에 피배서인의 권리가 배서인의 권리보다는 크다. \n② 선하증권을 훔친 자나 정당한 권리를 갖지 못한 자로부터 양도받은 선의의 양수인이라 하더라도, 그 화물의 진정한 소유자에게 대항할 수 없기 때문에 피배서인이 배서인보다 더 큰 권리를 가질 수 없다.\n③ 선하증권은 정당한 권리자에 의해 양도되어야 한다. \n④ 환어음의 이면(裏面)이나 보전(補箋)에 기재하지 아니해도 효격이 있을 수 있다. ","④","","","",""],["339","극동아시아를 출항하여 파나마 운하를 경유해서 미국 동안(東岸) 또는 걸프만 지역의 항까지 해상운송한 후 그 곳에서 미국의 내륙지역(중계지 경유 포함)까지 철도나 트럭으로 복합운송하는 방식은?","① MLB(Mini-Land Bridge)       ② RIPI(Reversed Interior Point Intermodal)\n③ MBS(Micro Bridge Service)    ④ ALB(American Land Bridge)","②","","","",""],["340","다음에서 TSCS(Trans Suberian Container Service)에 대한 설명으로 부적절한 것은?","① NVOCC가 소련구간에 대한 전소화물통과공단(SOTRA)과 TSCS 운송계약을 체결한다.\n② NVOCC는 각 운송구간별 운송주체자와 계약을 체결한 SOTRA와 총대리점계약을 체결하여 TSR서비스를 제공하고 있다\n③ TSCS서비스는 철도대신 항공기로 Siberia를 횡단하는 Sea \u0026 Air 복합운송방식만을 채택하고 있다. \n④ TRS의 운임체계는 독일의 PCT가 품목별무차별운임제도를 도입함으로써 단순화되었다","③","","","",""],["341","다음에서 컨테이너 안의 화물 수량이 선하증권 상에 기재 된 내용과 달라 클레임이 제기될 경우를 대비하여 운송인이 이와 관련한 면책을 주장하기 위해 선하증권 상에 기재하는 문구는?","① Importer\u0027s Load \u0026 Count        ② Shipper\u0027s Load \u0026 Count\n③ Consignee\u0027s Load \u0026 Count      ④ Error and Omissions Excepted","②","","","",""],["342","다음 중 수입상이 대금을 지급하기 전에 운송서류를 인도받으면서 그 운송서류를 제공한 은행에게 약정된 기일에 수입화물에 관한 대금결제를 서약한 보증서 성격의 서류는?","① Bill of Exchange        ② Letter of Indemnity\n③ Commercial Invoice     ④ Trust Receipt","④","","","",""],["343","다음에서 선하증권에서 물건의 담보권 이전에 대한 설명으로 바람직한 것은?","① 선하증권의 유통에 의하여 물건의 점유가 상징적으로 양수인에게 이전되고 물건이 인도되는 것을 말한다. \n② 권리증권이 채권을 담보하려는 의사로서 채권자에게 배서, 인도된 경우에는 물건에 대한 담보권이 이전한다. \n③ 당사자의 의사에 따라 이전하는 것이므로 물건의 인도나 대금지급과 소유권의 이전과는 일단 관계가 없다\n④ 물건에 대한 이전의 의사를 어떻게 표시하느냐, 즉 권리증권의 배서, 인도행위 그 자체가 상관습상 소유권의 이전의사를 표시하는 것을 말한다. ","②","","","",""],["344","다음 중 복합운송주선업협회에 관한 설명으로 옳지 않은 것은?","① 복합운송주선업자ㆍ화물터미널사업자는 사업자협회를 전국 또는 특별시ㆍ광역시ㆍ도 단위로 설립할 수 있다.\n② 복합운송주선업협회에 관하여 이 법에 규정한 것 외에는 민법 중 사단법인에 관한 규정을 준용한다.  \n③ 협회를 설립하고자 하는 경우에는 당해 협회의 회원이 될 자격이 있는 자 5분의 1이상의 발기인이 정관을 작성하여 당해 협회의 회원이 될 자격이 있는 자의 과반수가 출석한 창립총회의 의결을 거쳐야 한다. \n④ 창립총회의 의결을 거친 후 건설교통부장관의 설립인가를 받아야 한다.","③","","","",""],["345","다음에서 Sea \u0026 Air 복합운송 중 Carrier형의 단점으로 알맞게 설명한 것은?","① Carrier형 서비스를 제공하는 항공회사는 자기회사의 항공운임에 해상운임을 가산한 전구간 일관운송운임을 정한다.\n② Carrier형 항공회사는 항공운송구간만을 커버하는 항공화물운송장을 발행한다. \n③ 복합운송서비스지역이 자기회사노선이 있는 지역으로 한정된다. \n④ 해상운송에 대해서는 Air Waybill면에 \"Conjunction Clause\"을 삽입함으로서 해상운송과 항공운송을 일관하여 인수하였음을 증명하고 계약한다,","③","","","",""],["346","다음에서 선적서류에 대한 설명 중 옳지 않은 것은?","① 포장명세서에는 물품 명세, 단위별 중량, 화인, 일련번호 등이 기재된다.\n② 항공화물운송장은 유가증권이다\n③ 상업송장은 대금청구서의 역할을 하고 있다.\n④ 적하목록은 선사(대리점)가 작성하는 적재화물의 명세표이다.","②","","","",""],["347","다음 중 선하증권을 다른사람에게 양도하기 위해 배서할 때 피배서인의 표시방법으로 해당되지 않는 것은?","① 기명식    ② 지시식     ③ 백지식     ④ 무기명식","④","","","",""],["348","다음에서 극동아시아에서 유럽까지 시베리아 횡단 철도를 이용하는 복합운송 경로는?","① SLB       ② ALB        ③ CLB     ④ MLB","①","","","",""],["349","다음에서 선화증권 상 수화인에 대한 설명으로 올바르지 않는 것은?","① 수화인에게는 운임 및 기타 요금의 지급의무 등이 있다. \n② 목적지에서 선하증권을 제시하고 운송인에게 증권상에 기재된 화물의 인도를 청구할 수 있는 채권자이다.\n③ 수화인은 선하증권을 취득함으로써 증권상의 운송급부와 청구권을 취득한다\n④ 우리 나라 상법 및 Hamburg Rules도 선하증권의 임의 기재사항으로 규정하고 있다.","④","","","",""],["350","다음 중 복합운송주선업에 대한 설명으로 적당하지 않은 것은?","① 복합운송주선업은 2가지 이상의 운송수단을 이용하여 화물의 운송을 주선하는 사업이다.\n② 복합운송주선업은 타인 소유의 자동차나 선박을 이용하여 화물을 운송하는 사업이다.\n③ 복합운송주선업은 자기의 명의와 타인의 계산으로 화물의 운송을 주선하는 사업이다.\n④ 복합운송주선업은 타인의 수요에 응하여 화물의 운송을 주선하는 사업이다.","③","","","",""],["351","다음 중 선하증권에 대한 설명으로 맞지 않은 것은?","① 증권에 명시된 화물수취증이다.   ② 운송의 법적 계약서이다. \n③ 운암계산서이다.                 ④ 화물에 대한 권리를 입증한다. ","③","","","",""],["352","Hague Rules의 인적적용범위에 대한 설명으로 적합하지 않은 것은?","① Hague Rules는 한편에 있어서 해상물건운송계약에 의거하여 운송채무를 부담하는 선박소유인 또는 용선자에 대하여 적용된다. \n② Hague Rule는 송화인 및 선하증권 또는 이와 유사한 증권의 소지인에 대해서도 적용된다. \n③ Hague Rules에서 운송인은 운송계약에 있어서 송화인의 상대방이 되는 선박소유자 및 용선자이다.\n④ Hague Rules에서 운송인과 같은 이해관계인의 국적은 특정국가에만 적용된다. ","④","","","",""],["353","다음에서  Freight Forwarder의 기능 및 업무에 관한 설명으로 옳지 않은 것은?","① 자체 운송 수단을 보유하지 않지만 집화, 분배, 혼재 등의 업무를 수행하는 운송의 주체\n자로서의 기능을 수행한다\n② 화주의 대리인으로서 적절한 운송수단을 선택하여 운송에 따르는 제반 업무를 처리해 주는\n전통적인 운송주선 기능을 담당한다.\n③ 화주를 대신하여 적하보험 수배와 관련된 업무를 수행할 수 없다.\n④ 프레이트 포워더는 운송과 관련된 법적 책임 주체이다.","③","","","",""],["354","극동의 주요 항만에서 북미 서안의 주요 항만까지 해상운송하며, 북미 서안에서 철도를 이용하여 미 대륙을 횡단하고, 북미 동부 또는 남부항에서 다시 대서양을 해상 운송으로 횡단하여 유럽지역 항만 또는 유럽 내륙까지 일관수송하는 복합운송경로는?","① MLB(Mini-Land Bridge)       ② RIPI(Reversed Interior Point Intermodal)\n③ MBS(Micro Bridge Service)    ④ ALB(American Land Bridge)","④","","","",""],["355","다음 선하증권에 기재되는 중량 및 용적은 다음 어느 서류의 기재내용과 일치해야 하나?","① 운항준비서    ② 용적·중량증명서    ③ 인도지시서   ④ 하도지시서","②","","","",""],["356","다음 중 수입화물이 선하증권보다 먼저 목적항에 도착하여 통관이 지연되어 화물의 변질, 보관료 증가, 판매기회의 상실 등의 부담이 발생할 우려가 있을 때 이러한 불편을 해소하기 위하여 수화인이 사용할 수 있는 서류는?","① D/O(Delivery Order)       ② T/S(Tally Sheet)\n③ L/G(Letter of Guarantee)   ④  T/R(Trust Receipt)","③","","","",""],["357","다음 중 Container B/L의 경우 운송물 수취지로 기재되는 장소가 될 수 없는 곳은?","① CY(Con- tainer Yard)   ②  CFS(Container Freight Station)    \n③ RFS(Rail Freight Station  ④  Port of Loading","④","","","",""],["358","다음 중 해상운송에서 사용되는 C/P(Charter Party)라는 용어와 밀접한 관련이 있는 것은?","① Shipping conference   ②  Liner vessel  ③ Tramper  ④ Tariff rate","③","","","",""],["359","다음 중 화주가 프레이트 포워더에게 화물의 멸실ㆍ훼손에 관한 클레임을 청구할 때 제출하는 서류가 아닌 것은?","① Claim Letter  ②  B/L Copy\n③ Survey Report ④ Cargo Insurance Policy","④","","","",""],["360","다음에서 무신용장거래의 경우 매수인에 대한 설명으로 올바른 것은?","① 매수인은 매도인 앞으로 일람출급의 환어음을 발행한다. \n② 매수인은 환어음과 선하증권에 백지배서한다. \n③ 매수인은 백지배서된 지시식 선하증권을 가지고 있으므로 선하증권의 소지인이 된다. \n④ 매수인이 운송인에게 물건을 인도하고 운송인은 매수인의 지시식으로 선하증권을 발행한다. ","③","","","",""],["361","다음 중 화물자동차와 철도가 결합되어 운송되는 복합운송방식은?","① 피기백 방식(Piggy back system)    ②  피쉬백 방식(Fishy back system)\n③ 버디백 방식(Birdy back system)    ④  랜드 브리지 방식(Land bridge system)","①","","","",""],["362","다음에서 선하증권의 기재사항 중 우리나라 상법 상 임의 기재사항은?","① 선장명, 선박톤수                 ②  본선항해번호, 환율\n③ 운송물의 종류, 중량 또는 용적    ④  선적항, 양륙항","②","","","",""],["363","다음 중 선하증권 법정기재사항에서 포장의 종류및 개수에 대한 설명으로 관계가 없는 것은?","① 송화인의 운송물이 손상·멸실되거나 과부족 등이 발생할 때에 운송인에게 손해배상을 청구하는데 선하증권에 기재된 운송물의 개수가 산정기준이 된다.\n② Hague Rules는 송화인이 당해 화물의 가격을 신고하고, 선하증권에 기재한 경우에는 그 화물이 손상 또는 멸실하였을 때 그 신고가격이 운송인의 손해배상 한도액이다. \n③ 선하증권에 container내에 적입된 물건의 포장단위가 기재되지 않고 container단위만 기재되어 있는 경우 각 container가 포장(package)의 단위로 간주된다. \n④ 선하증권에 container에 적입된 포장의 개수가 기재되어 있는 경우 container내에 적입된 포장의 개수는 일괄적으로 전체를 하나의 포장의 수로 취급된다. ","④","","","",""],["364","다음에서 Sea \u0026 Air 복합운송에 대한 설명으로 올바른 것은?","① 출발지로부터 중계지까지는 항공운송되고 거기에서 최종목적지까지는 해상으로 운송되는 복합운송형태이다. \n② 최초에는 한국, 일본을 비롯한 극동지역으로부터 OCP화물이 영국 및 유럽항구에 도착한 후 북미내륙 OCP Area로 항공운송되는 형태이었다. \n③ 해상운송의 저렴성과 항공운송의 신속성이라는 장점을 결합한 방식이다. \n④ 주로 Micro Bridge Service(MBS)의 경로에 주로 채택된 운송수단방식이다. ","③","","","",""],["365","복합운송주선업의 승계 중 상속 신고시에 첨부해야 하는 서류로 올바르지 못한 것은 어느 것인가?","① 신고인인 상속인과 피상속인의 관계를 증명하는 서류\n② 신고인과 동 순위의 다른 상속인이 있는 경우 그의 동의서\n③ 피상속인의 사망 증명 서류. \n④ 상속인의 거주지를 관할하는 시장ㆍ군수 또는 구청장의 동의서 ","④","","","",""],["366","장금복합운송은 부산항에서 미국의 네브라스카, 사우드타코타, 시카고 등 록키산맥 동부 내륙까지의 복합운송에 전문화 된 기업이다. 이 기업이 주로 이용하는 국제복합운송경로는?","① CLB   ② IPI    ③ ALB     ④ SLB","②","","","",""],["367","다음의 예는 선화증권의 배서방식 중 어는 것을 말하는가?\n          Deliver to . . . Co., Ltd\n          Tigers Trading Co., Ltd.\n          (signed)\n          ----------\n          Manger","① 기명식    ② 지시식     ③ 백지식     ④ 선택무기명식","①","","","",""],["368","다음은 복합운송서비스와 관련된 설명으로 옳지 않은 것은?","① 선사가 발행하는 것을 Master B/L, 복합운송업자가 발행하는 것을 House B/L이라 한다.\n② 복합운송의 대표적인 형태가 Sea \u0026 Air 방식이며, 각종 Land Bridge 방식도 이의 일종이다.\n③ 국제복합운송은 이른 바 “Door to Door Service”를 지향하는 것으로 복합운송업자는 하주에 대해 전운송구간에 대한 일괄책임을 진다.\n④ 복합운송서류는 전복합운송구간의 단일책임을 강화하기 위하여 원칙적으로 선박을 보유한 복합운송업자만이 발행할 수 있다.","④","","","",""],["369","다음 중 미국서안에서 철도 등의 내륙운송을 거쳐 미국 동안 또는 걸프지역 항만까지 수송하는 해륙복합운송의 형태는?","① Interior Point Intermodal      ② Mini Land Bridge\n③ Micro Land Bridge            ④ America Land Bridge","②","","","",""],["370","다음에서 외관상 운송품의 상태에 대한 선하증권상의 기재에 대한 설명으로 옳지 않은 것은?","① 선적선하증권(On Board B/L)의 경우에는 선적에서 양륙항까지 운송인이 책임을 진다. \n② 운송인이 선적 또는 수취할 때 외관상으로 점검하여 이상이 없으면 그 책임을 지지 않는다.\n③ 수치선하증권(Received B/L)의 경우에는 수취에서 인도 이전까지의 화물의 사고 발생에 대해 운송인이 책임을 진다. \n④ 본선수취증(mate\u0027s receipt)에 고장적요가 있는 경우에는 운송인에게 책임이 없다는 취지를 표시하기 위해 선하증권에도 고장적요가 기재된다. ","③","","","",""],["371","다음에서 복합운송방식을 성립시키는 기본요건에 해당되지 않는 것은?","① 단일운임 적용           ② 단일증권 발행\n③ 단일책임 체계           ④ 도로운송과 철도운송 간의 연계운송","④","","","",""],["372","다음 중 운송화물이 선박에 적재되었음을 증명하며, 적재된 화물을 목적지에서 수화인에게 인도할 것을 약정하여 선박회사가 발행하는 유가증권으로 옳은 것은?","① 해상화물운송장(Sea Waybill)          ② 수입화물선취보증장(Letter of Guarantee)\n③ 신용장 (Letter of Credit)             ④ 선하증권(Bill of Lading)","④","","","",""],["373","다음 Hague Rules에서의 인적적용범위에서 이해관계인에 대한 설명으로 적절한 것은?","① 운송인은 해상운송계약의 전부를 이행하는 자로 계약운송인으로부터 위탁받아 현실로 운송행위를 하는 자를 말한다. \n② 수화인은 계약운송인과 해상운송계약을 체결하는 자를 말한다. \n③ 계약운송인은 송화인과 해상운송계약을 체결한 자를 말한다. \n④ 운송취급인은 물건을 인도를 받을 권리를 가진 자를 말한다. ","③","","","",""],["374","다음은 운송과 관련된 국제조약으로 조약과 관련된 운송수단으로 바르게 연결된 것은?\n가. Hamburg Rules 1978\n나. UNCTAD/ICC Rules 1992\n다. Motreal Convention 1999","     가          나         다\n① 항공운송 - 해상운송 - 복합운송\n② 도로운송 - 항공운송 - 해상운송\n③ 해상운송 - 복합운송 - 도로운송\n④ 해상운송 - 복합운송 - 항공운송","④","","","",""],["375","다음에서 수취선하증권(Received B/L) 상의 선박의 명칭에 관련 된 설명으로 올바르지 않은 것은?","① 수취선하증권상의 선박명란에 선적 예정인 선박명을 기재한다. \n② 선박명란에 선박명과 함께 \"or subsequent vessel\"이라고 기재하여 발행한다. \n③ 선박의 명칭을 \"intended vessel name\"으로 기재해도 수리한다고 규정하고 있다.\n④ 운송인이 운송물을 실제로 선박에 선적한 후 발행되므로 선하증권에 선박명칭이 기재된다.","④","","","",""],["376","다음에서 운송물의 멸실, 훼손, 지연 손해가 복합운송의 어느 구간에서 발생하였는가를 묻지않고 복합운송인은 동일한 기준에 따라 책임을 지는 체계는?","① 분할책임체계             ② 변형단일책임체계\n③ 단일책임체계             ④ 절충형책임체계","③","","","",""],["377","다음 중 무신용장 거래와 신용장 거래의 경우의 차이점으로 적당한 것은?","① 원칙적으로 무신용장거래와 신용장거래는 별 차이가 없다. \n② 매도인은 환어음과 선하증권에 백지배서한다. \n③ 환어음 및 선적서류를 제시받는 수출지의 은행이 지급·인수·매입 또는 연지급을 한다.\n④ 매도인이 운송인에게 물건을 인도하고 운송인은 매도인의 지시식으로 선하증권을 발행한다. ","③","","","",""],["378","다음에서 항공화물 혼재업자(consoliator)의 역할에 관한 설명 중 틀린 것은?","① Unifor Liability System           ② Network Liability System\n③ Tie-up System                   ④ Flexible Liability System","④","","","",""],["379","해상운송에서 선박회사가 선적된 화물을 확인한 후 화물에 이상이 있는 경우 사고부 선하증권(Dirty B/L)울 발행하는데 이를 은행이 매입하지 않으므로 수출상은 선박회사에 무엇을 제출하면 Clean B/L을 발행 받을 수 있는가?","① L/I(Letter of Indemnity)              ② T/R(Trust Receipt)\n③ L/G(Letter of Guarantee)             ④ Shipped B/L","①","","","",""],["380","실제적으로 선하증권의 송화인(shipper)란에는 운송곙약자가 제시한 서류에 의거하요 기입되는 내용이 아닌 것은?","① 운송계약의 당사자가 아닌 제3자의 성명     ② 신용장상의 수익자  \n③ 수입업자의 대리인                         ④ 지급은행의 대리인","④","","","",""],["381","다음에서 해상화물운송장(Sea Waybill)에 대한 설명으로 부적합한 것은?","① 권리증권이므로 항해 중에 증권을 이전함으로써, 물품의 전매나 담보가 가능하다. \n② 해상화물운송장에 관한 규칙은 CMI uniform rules for Sea Waybill 1990 이다. \n③ 계약상품의 인도 또는 적재를 입증하는 비유가 증권 서류이다. \n④ 송화인에게 발행하는 서류이지만, 선하증권과 달리 운송품 인도청구권을 상징하지 않기 때문에 양도성이 없다. ","①","","","",""],["382","다음 중 UNCTAD/ICC 복합운송증권규칙에 대한 내용으로 옳지 않은 것은?","① 단일운송 또는 복합운송의 여부와 무관하게 운송계약에 적용할 수 있다. \n② 운송인의 반증책임을 전제로 한 과실책임원칙과 함께 변형통합책임체계를 채택하였다. \n③ 화물 인도 후 9개월 내에 소송이 제기되지 않으면 운송인은 모든 책임을 면한다.  \n④ 운송인은 사용인의 항해과실 및 본선 관리상의 과실, 고의 또는 과실에 의한 화재가 아닌 경우 면책이지만 감항성 결여는 예외없이 귀책사유이다. ","④","","","",""],["383","Hague Rules에서 적용대상에서 생동물을 제외시킨 이유로 올바르지 않은 것은?","① 운송인이 운송을 인수하는 것을 기피한다. \n② 생동물의 운송은 항해상 각종의 위험을 수반할 수 있다.  \n③ 특약을 엄중하게 제한 하면 운임이 크게 오른다.  \n④ 송화인에게 너무 편중된 이익을 초래한다. ","④","","","",""],["384","국내 상법상 선하증권의 기재사항 중 법정기재사항이 아닌 것은?","① 선박의 명칭    ② 송하인의 성명       ③ 면책종항     ④ 운임","③","","","",""],["385","다음 이종책임체계에서 복합운송인이 항공운송구간에서는 무엇에 의해서 책임체계가 결정되는가?","① CIM 조약               ② Hague Rules\n③ Warsaw Convention     ④ CMR 조약","③","","","",""],["386","다음 신용장의 종류에서 수출지의 은행이 지급인 및 인수인이 되는 것이 통례인 것은?","① 매입신용장(negotiation credit)     ② 연지급신용장(deferred payment credit)     \n③ 지급신용장(payment credit)       ④ 확인신용장(confirmed credit)","②","","","",""],["387","다음 중 운송서류의 정당한 수화인에 관한 설명으로 옳지 않은 것은?","① 지시식 선하증권 중 \"to order\"로 발행된 경우 신용장 매입은행이 배서한 선하증권 원본 소지인\n② 기명식 선하증권으로 발행된 경우 consignee란에 기재되어 있는 자\n③ 지시식 선하증권 중 \"to order of shipper\"로 발행된 경우 shipper가 배서한 선하증권 원본 소지인\n④ 지시식 선하증권 중 \"to the order of D bank\"로 발행된 경우 D은행이 지시한 자","①","","","",""],["388","다음에서 복합운송증권과 통선하증권과의 차이를 설명한 것 중 올바른 것은?","① 복합운송증권은 복합운송계약의 하청형태이고 통선하증권은 형태를 불문한다. \n② 복합운송증권은 각 운송인 분할책임이고 통선하증권은 전구간 단일책임이다. \n③ 복합운송증권은 B/L 형식이나 통선하증권은 B/L 이외의 형식도 존재한다. \n④ 복합운송증권은 증권의 발행인으로 선박회사와 그 대리인이나 통선하증권은 운송주업자도 가능하다. ","①","","","",""],["389","화환어음의 결제 방식중 무신용장거래의 경우 누가 환어음과 선하증권에 백지배서하는가?","① 매수인      ② 매도인      ③ 운송인     ④ 수입인","②","","","",""],["390","다음 중 국제운송에서 Freight Forwarder가 취급할 수 있는 사업영역에 해당되지 않는 것은?","① 국제운송물류에 대한 전반적인 컨설팅\n② 화물의 집화, 분배, 혼재 서비스\n③ 보험의 수배 및 담보조건 등에 관한 제안\n④ 운송사고 하자물품에 대한 검정보고서의 발급","④","","","",""],["391","복합운송주선업자가 등록한 사항을 변경하고자 하는 경우에는 변경사유가 발생한 날부터 몇 일 이내에 변경등록을 하여야 하는가?","① 10일 이내    ② 15일 이내\n③ 30일 이내    ④ 60일 이내","③","","","",""],["392","신용장에서 환어음 만기가 선적일 후 일정기간으로 명시된 경우 하나의 환어음에 대하여 세 세트의 다음과 같은 선하증권이 제시되었다면 어느 일자를 선적일로 간주하는가?\n\n구분                선하증권1   선하증권2  선하증권3\nonboard notation date   11/19      11/22      11/24\n발행일                11/20      11/19      11/23\n","① 11월 19일                                                                                ② 11월 20일\n③ 11월 22일                                                                              ④ 11월 24일","④","","","",""],["393","다음 중  무신용장거래의 경우 매수인의 권리에 대한 설명으로 맞는 것은?","① 선하증권을 발행하는 자     ② 운송인이 물건을 인도하여야 할 증권상 권리를 가진 자   \n③ 선하증권에 백지배서하는 자 ④ 환어음을 발행하는 자","②","","","",""],["394","다음 중 신용장통일규칙에 대한 설명 중 적합하지 않은 것은?","① 일류 검사기관이 발행한 검사증명서를 요구하였다면 수익자 이외의 자라면 어떤자가 발행하였더라도 검사증명서는 수리할 수 있다.  \n② 신용장에서 서류사본을 개설의뢰인에게 선적 후 즉시 송부한 것을 증명하는 \"beneficiary\u0027s certificate를 요구하였다면 이 경우 이 증명서에는 수익자가 선적 후 3일 이내에 서류 사본을 송부하였다는 것이 기재되어야 한다. \n③ 신용장은 취소불능이라는 표시가 없더라도 취소가 불가능하다. \n④ 서로 다른 국가에 있는 은행의 지점은 separate bank로 간주되다. ","②","","","",""],["395","다음 중 갑판적의 물건에 대한 Hague Rules의 적용을 제외한 이유와 관련된 사항을 설명한 것으로 적합하지 않은 것은?","① 갑판적 물건이 현실로 갑판에 적재되어 운송되어지는 것을 조건으로 적용되어야 한다.  \n② 선하증권에 갑판적이라고 기재하는 것만으로도 갑판적 물건이라고 적용되어야 한다.\n③ 갑판적 물건이 최초부터 선창에 적재된 경우 또는 운송 중에 선창에 적재된 경우에는 Hague Rules가 적용되어야 한다. \n④ 물건의 일부가 선창에 적재된 경우에는 그 물건이 가분물이면 전부에 대하여 Hague Rules가 적용되어야 한다. ","②","","","",""],["396","다음 중 신용장거래에서 용선계약부 선하증권의 서명권자가 아닌 것은?","① Carrier    ② Owner     ③ Master    ④ Charterer","①","","","",""],["397","다음 중 피배서인의 이름이 명기되지 않고 송화인 또는 신용장 발행은행  지시를 받아, 화물을 인도하라는 문언과 함께 배서인이 서명하는 배서 방식은?","① 기명식    ② 지시식     ③ 백지식     ④ 선택무기명식","②","","","",""],["398","신용장거래엣 선하증권 요구시 별도의 허용문언이 없는 경우 하자로 취급받게 되는 선하증권의 내용은?","① packing may not be sufficient for the sea journey\n② goods shipped on deck\n③ shipper\u0027s load and count\n④ the carrier reserves the right to tranship","②","","","",""],["399","다음 중 복합운송주선업을 등록하고자 하는 자가 등록을 하기 위한 기준으로 맞지 않는 것은?","① 자본금 또는 자산평가액은 개인인 경우 자산평가액이 6억원 이상인 것\n② 컨테이너 장치장을 소유하거나 이를 사용할 수 있는 계약을 체결하였을 것\n③ 1억원 이상의 보증보험에 가입할 것\n④ 부지면적이 3만 3천 제곱미터 이상일 것 ","②","","","",""],["400","다음 중  해상운송인의 책임에 대한 설명으로 적합하지 않은 것은?","① Hague Rules는 과실책임주의를 채택하고 있다.   \n② Hauge Rules의 운송인의 운송계약상의 의무, 운송인의 권리 및 면책을 규정하고 있다.  \n③ Hamburg Rules는 과실책임주의를 채택하고 추정과실 및 태만의 원칙까지도 채택하고 있다. \n④ Hamburg Rule는 운송이이 물건의 멸실, 손상, 인도지연의 사실에 대해 그 방지를 위한 합리적인 방법으로 요구되는 모든 조치를 했을 경우에도 그 책임을 진다고 규정한다. ","④","","","",""],["","","","","","","",""],["","","","","","","",""],["","","","","","","",""],["","","","","","","",""],["","","","","","","",""],["","","","","","","",""],["","","","","","","",""],["","","","","","","",""],["","","","","","","",""],["","","","","","","",""],["","","","","","","",""],["","","","","","","",""],["","","","","","","",""],["","","","","","","",""]]},{"name":"선박운용(운항), 컨테이너 장비, 항만터미널","rows":[["海運實務 試驗問題 (선박운용(운항), 컨테이너 장비, 항만 터미널)","","","",""],["","","","",""],["번호","문제","보기","정답",""],["1","다음 중 선박의 용적 및 중량 톤수에 관해 서술한 것 중 적합하게 설명한 것은?","① 총톤수: 화물이나 여객 운송을 위해 쓰이는 실제 용적이다. \n② 순톤수: 선박의 크기를 표시하는 단위로 보통 상갑판 이하의 모든 용적에 차폐된 장소의 용적을 더한 용적이다. \n③ 배수톤수: 선박이 물에 잠김으로써 배제한 물의 무게로 선박의 무게에 해당되는 양인 배수량에 톤수를 붙인 것이다. \n④ 운하톤수: 선박이 적재할 수 있는 최대의 무게를 나타내는 톤수를 말한다. ","③",""],["2","선박이 적재할 수 있는 최대의 무게를 나타내는 톤수를 말하는 것은? ","① 재화중량톤수    ② 배수톤수  ③ 순톤수   ④ 운하톤수 ","①",""],["3","다음에서 흘수(draft)에 대한 설명으로 잘못된것은?","① 선박의 용골에서 수면까지의 수직거리를 흘수라 한다.\n② 선수에 만재흘수선표가 표시된다.\n③ 흘수에는 용골흘수와 형흘수가 있다.\n④ 적당한 흘수를 확보하는 것은 선박의 안전을 위하여 대단히 중요하다.","②",""],["4","물속에서 잠긴 선체의 깊이로, 선박의 용골에서 수면까지의 수직거리를 말하는 것은?","① 흘수   ② 톤수   ③ 건현   ④ 트림","①",""],["5","일반적으로 해상에서 이용되는 선박의 속력 단위로 적합한 것은?","① 헤르쯔(Hz)   ② 마일(mile)   ③ 킬로미터(km)   ④ 노트(knot)","④",""],["6","선박 복원성의 좋고 나쁨을 판단하는 가장 중요한 요소는 어느 것인가?","① 선박의 무게     ② 선박의 부심\n③ 선박의 경심     ④ 메타센터의 높이","④",""],["7","다음의 설명으로 옳은 것은?","① 외판은 선박의 현측에서 맞은편 현측까지 이어진 바닥판이다. \n② 갑판은 선체의 외곽을 이루어 수밀을 유지하고 부력을 형성한다. \n③ 화물창은 화물 수송을 위하여 설계된 공간이다. \n④ 상갑판은 갑판 중에서 맨 위층에 있는 갑판이다. ","③",""],["8","선박에서 화물수송을 위하여 설계된 공간을 무엇이라 하는가?","① 갑판    ② 기관실    ③ 연료실    ④ 화물창","④",""],["9","황늑골식 구조 양식에 대한 설명 중 가장 옳은 것은?","① 종강도가 커서 배의 중량이 가볍다. \n② 구조가 복잡하여 건조 작업이 어렵다. \n③ 선창 내에 돌출부가 많아 공간을 효과적으로 사용할 수 없다. \n④ 늑판(floor), 늑골(frame), 보(beam) 등의 횡강도 부재를 중점적으로 배치하는 구조이다. ","④",""],["10","선채의 구조 형식에서 주로 종강도 부재를 중심으로 배치된 구조 양식으로 유조선과 같이 액체화물을 적재하는 선박 등에 채용되는 방식은?","① 종늑골식 구조   ② 이중저 구조   ③ 횡늑골식 구조   ④ 혼합식 구조","①",""],["11","선체저항에 대한 설명 중 맞는 것은?","① 조차저항은 속력이 빨라질수록 감소한다. \n② 속장비는 조파저항 때문에 고려한다. \n③ 고속선에서의 조파저항은 무시하여도 좋다.\n④ 잠수함은 조파저항으로 인하여 그 속력을 낼 수 없다. ","②",""],["12","선박이 이접안 할때 부서 위치와 그 주요 업무가 바르게 짝지어지지 못한 것은?","① 선교 - 선장, 보좌, 수동 조타     ② 기관실 - 기관, 기기감시, 운전\n③ 선수 - 선수부 계류              ④ 조리실 - 통신 및 검역 준비","④",""],["13","다음 중 엘니뇨(El Niño) 및 라니냐(La Niña) 현상과 관련이 있는 해역은?","① 열대 인도양   ② 열대 서부 대서양    \n③ 북극해 및 남극해   ④ 열대 동부 태평양","④",""],["14","다음 중 선박검사의 종류로 적합하지 않는 것은?","① 정부검사   ② 선급검사     ③ 예비검사   ④ 국제협약검사","③",""],["15","선박검사의 종류 중에서 선박 감항성의 유지와 해상선박보험 등에 필요한 검사는 다음 중 어느 것인가?","① 정부검사   ② 선급검사    ③ 예비검사   ④ 국제협약검사","②",""],["16","해상보험의 기본이 되고 항시 분쟁의 소지가 있는 선박의 감항성을 유지하기 위해 산박은 정기검사를 얼마만에 실시하는가?","① 등록검사로 부터 30개월 경과     ② 정기 검사일로 부터 12개월 경과\n③ 등록검사 또는 매 5년마다        ④ 제조 후 8년 이후부터 매년마다 검사","③",""],["17","선급검사 중 기기계속검사(CMS)는 어느 주기마다 검사를 실시하는가?","① 정기 검사일로 부터 12개월 이후   ② 정기검사일로 부터 30개월 경과\n③ 매 5년 마다                     ④ 정기검사 interval중 매년마다 1/5씩 검사","④",""],["18","주요 국제협약에 따른 검사의 종류에 해당되지 않는 것은?","① 국제 만재흘수선협약에 의거한 검사   ② 해양오염방지협약에 의거한 검사\n③ 로테르담규칙에 의거한 검사          ④ 해상인명안전협약에 의거한 검사","③",""],["19","다음은 항만국 통제 검사(Port State Control)에 대한 특성을 설명한 것 중 적합하지 않은 것은?","① 선박안전기준의 국제적 적합성   ② 선원자격기준의 국제적 적합성\n③ 근로조건기준의 국제적 적합성   ④ 운송인의 의무의 국제적 적합성","④",""],["20","선박 운항 관리 목표와 거리가 먼 내용은?","① 정시운항    ② 안전운항      ③ 경제운항    ④ 항로변경","④",""],["21","총 선대의 운항계획 수립 시의 고려하여할 사항이 아닌 것은?","① 운송수요의 변동   ② 선적항의 인적관리   ③ 항해거리 및 시간  ④ 선원의 가용능력","②",""],["22","선박의 운항 Schedule의 종류가 아닌 것은?","① Pro forma schedule   ② Long term schedule   \n③ Short term schedule   ④ Costal schedule","③",""],["23","선박 운항시 지연 운항의 발생요인으로 거리가 먼 것은?","① 지연입고, 화물상태 불량, 화물중량초과등의 화물관련 요인\n② 선박 또는 기기의 고장\n③ 시간당 평균 하역 능력\n④ 선석대기 및 작업지연등의 항만 사정","③",""],["24","선박 지연 운항 발생시 schedule의 회복 원칙으로 타당한 것은?","① 가능한 Port Skip은 지향한다.\n② Port production을 저감한다. \n③ Gang hour를 준수하여 접안즉시 작업시행한다.\n④ 최단 시간내 회복하고 1 round voyage 이상 계속 지연 방지한다. ","④",""],["25","다음 중 선박유지를 위한 제반 비용인 선박관리비에 해당되지 않는 것은?","① 감가상각비    ② 보험료    ③ 복리후생비    ④ 선용품비","④",""],["26","선박이 적재할 수 있는 화물의 중량을 의미하는 톤(ton)수는?","① 총톤수  ② 순톤수  ③ 재화중량톤수  ④ 배수량톤수","③",""],["27","다음 중 선박의 크기를 나타내는 톤수로만 묶인 것을 찾으시오?\n\nⓐ R/T(Revenue Ton) ⓑ G/T(Gross Ton)\nⓒ W/T(Weight Ton) ⓓ DWT(Dead Weight Ton)\nⓔ M/T(Measurement Ton) ⓕ Displacement Ton","① ⓑ - ⓓ - ⓕ\n② ⓑ - ⓒ - ⓓ\n③ ⓐ - ⓑ - ⓔ\n④ ⓐ - ⓓ - ⓔ","①",""],["28","선주가 속한 국가가 아닌 제3국의 국적을 취득한 선박을 이르는 말은?","① VLCC선    ② 편의치적선    ③ LASH선    ④ 나용선","②",""],["29","다음 선박의 톤수 중 순톤수(Net tonnage:N/T)에 대한 설명으로 맞는 것은?","① 갑판 아래의 적량과 갑판 위의 밀폐된 장소의 적량을 합한 것으로 선박의 안전과 위생에 사용되는 부분의 적량(제외적량:exemptions)을 제외한 것을 말한다.\n② 선박의 각 창의 용적과 특수화물창고 등 선박의 화물적재능력을 용적톤으로 표시한 것으로 관습상 40ft³(1.133m³)를 1톤으로 나타내고 있다.\n③ 용선계약, 선박매매거래 등 상거래의 산출기준이 되는 톤수를 말한다.\n④ 선주나 용선자의 상행위와 관련된 용적이기 때문에 항만세 ,톤세, 운하통과료,등대사용료, 항만시설사용료 등의 모든 세금과 수수료의 산출기준이 된다.","④",""],["30","다음 중 선박의 복원력에 영향을 미치지 않는 것은 어느 것인가?","① 배수량              ② 트림            ③ 선폭                ④ 현호","②",""],["31","다음 중 여객이나 화물의 운송을 할 수 있는 선박 안의 장소의 크기를 나타내는 톤수는 어느 것인가?","① 총톤수      ② 배수톤수      ③ 순톤수      ④ 재화용적톤수","②",""],["32","다음 중 선박의 배수량을 적절하게 표시한 것은?","① 수면하의 용적 x 물의 비중    ② 수면하의 중량 x 물의 비중\n③ 수면상의 용적 x 물의 비중    ④ 수면상의 중량 x 물의 비중","①",""],["33","다음 중 만재흘수선을 표시해야 하는 선박이 만재흘수선 이상으로 적재하여 항해 할 수 있는 경우는 어느 것인가?","① 연해구역을 항해할 때    ② 평수구역을 항해할 때\n③ 근해구역을 항해할 때    ④ 국제항해 시 귀국할 때","②",""],["34","다음은 부심을 설명한 것으로 적당한 것은?","① 전 중량의 중심         ② 수면상의 용적의 중심\n③ 수면하 용적의 중심     ④ 수면하 중량의 중심","③",""],["35","다음 중 2호 선저도료(A/F paint)를 사용하는 주된 목적으로 타당한 것은?","① 선체의 부식을 방지하기 위함이다.    ② 수선부의 손상을 방지하기 위함이다. \n③ 해조류의 부착을 방지하기 위함이다.  ④ 건조시간을 단축하기 위함이다. ","③",""],["36","다음 중 예인선에 적합한 기관은? ","① 디젤기관       ② 터빈기관     ③ 왕복동기관     ④ 가솔린기관","③",""],["37","다음 중 예항 시 피예선에서 닻줄을 내어 주는 이유는?","① 예색의 분리 용이           ② 회수를 쉽게 하기 위해\n③ 수곡선을 유지하기 위해     ④ 파단력을 높이기 위해","③",""],["38","다음 중 초기복원력에 적합한 것은?","① 경하상태의 복원력      ② 경사가 처음 시작될 때의 복원력\n③ 신조당시의 복원력      ④ 경사가 10도 미만인 때의 복원력","④",""],["39","다음 보원력에 대한 특성을 설명한 것 중 적합하지 않은 것은?","① 선박의 안정성 판단에 중요한 기준이다. \n② 복원력이 너무 작으면 선박이 전복되기 쉽다. \n③ 선박의 횡경사와 종경사에 대한 것을 연구한 것이다. \n④ 복원력이 부족하면 선박으로서의 의미를 상실한다. ","③",""],["40","선박에서 흔히 불안전 상태라고 이야기하는 경우는 다음 중 어느 것인가?","① 중심이 경심보다 위에 있을 때    ② 중심이 경심보다 아래 있을 때\n③ 중심과 경심의 위치가 같을 때    ④ 중심이 부심 아래 있을 때","①",""],["41","다음 중 트림과 관계가 먼 것은 어느 것인가?","① 능파성      ② 타효      ③ 속력      ④ 복원력","④",""],["42","선박의 조난이 발생하고 퇴선을 결정하기 전에 퇴선 준비사항과 관계가 먼 것은?","① 구명동의를 착용한다.      ② 비상부서배치표에 따른다. \n③ 적절한 의복 착용         ④ 멀미약 복용","④",""],["43","다음에서 Rope가 절단되는 순간의 최대하중을 무엇이라고 하는 가?","① 시험하중      ② 사용하중      ③ 파단하중      ④ 안전사용하중","③",""],["44","다음 중 용골 하(下)면에서 부터 수면까지 수직거리를 표시하는 Draft를 말하는 것은?","① Model Draft    ② Keel Draft\n③ Deep Draft     ④ Full Loaded Draft","②",""],["45","다음 중 체크밸브(check valve)에 관한 것으로 가장 적합한 것은?","① 황천 시 작동시키는 조타기의 밸브이다. \n② 배수관의 도중에 설치하여 해수의 역류를 방지하는 밸브이다. \n③ 황천 시 스크류의 공전을 막기 위한 밸브이다. \n④ 보일러의 증기를 개폐하는 밸브이다. ","②",""],["46","다음에서 유조선의 구조설비에 해당되지 않는 것은?","① 파형격벽      ② 펌프실     ③ 방유구획      ④ 이중저 ","④",""],["47","다음 중 선저외측의 만곡부 외판에 붙은 만곡부 용골(Bilge Keel)의 설치 목적으로 타당한 것은?","① 선속을 증대시킨다.          ② 선체의 종강력을 증대시킨다\n③ 선체의 횡요를 완화시킨다.    ④ 조파저항을 감소시킨다.","③",""],["48","다음에서 냉동식 LPG 탱커의 재액화라인에 연결되어 있는 관이 아닌 것은 어느 것인가?","① 스파지관      ② 분사노즐관     ③ 증기관        ④ 재액관","③",""],["49","다음에서 국내외의 화물을 주로 취급하는 항만에 해당 하는 것은?","① 상항      ② 산업항    ③ 어항      ④ 관광항","①",""],["50","다음에서 태풍 등의 황천을 피하기 위한 항으로 진해항, 흑산도항 같은 항만을 무엇이라고 하는가?","① 상항(Commercial Port)     ② 산업항(Industrial Port)\n③ 관광항(Recreation Port)    ④ 피난항(Refuge Port)","④",""],["51","항만을 입지조건으로 분류한 것 중 해항(sea 함 등 거의 모든 선박에 널리 사용되는 장치는?","① 만곡부 용골              ② 횡요 감쇠 탱크(anti-rolling tank)\n③ 핀 안정기(fin-stabilizer)     ④ 자이로 안정기","①",""],["95","선박에서 사용되는 타의 종류로 타두재의 앞쪽에는 없고 뒤쪽에만 타면적이 있는 것을 무엇이라고 하는가?","① 균형타(Balanced rudder)           ② 불균형타(Unbalanced rudder)\n③ 반균형타(Semi-balanced rudder)     ④ 타두재(Rudder stock)","②",""],["96","다음 조타장치에서 조종성(Manoeuvrability)의 종류로 해당이 없는 것은?","① 보침성(Couse keeping ability)      ② 추종성(Yaw check ability)\n③ 유동성(Mobility)                  ④ 선회성(Trurning ability)","③",""],["97","다음에서 우회전 단추진기선의 특성을 이용할 수 있는 계류법은 어느 것인가?","① 지중해식 계류법    ② 우현계류법    ③ 좌현계류법         ④ 정횡계류법","③",""],["98","다음 중 횡강력 구성재와 종강력 구성재를 겸하고 있는 것은?","① Deck Beam     ② Side Plateing    ③ Frame          ④ Beam Bracket","②",""],["99","선박의 깊이란 선박 길이의 중앙에 있어서, 상갑판 빔의 현측 상면에서 어디까지의 수직거리인가?","① 용골 상면           ② 가용골 상면    ③ 가용골 하면         ④ 용골 하면","①",""],["100","다음에서 선체가 진행 시 생기는 마찰 저항의 원인을 기술한 것으로 적절한 것은?","① 압력의 차이          ② 조파 작용     ③ 물의 점성            ④ 흘수 감소","③",""]]},{"name":"해운경영, 해상보험, 해상운임, 선원관리, 해양법규 등","rows":[["海運實務 試驗問題 (해운경영, 해상보험, 해상운임, 선원관리, 해양법규 등)","","",""],["","","",""],["번호","문제","보기","정답"],["1","경영을 관리의 일련의 과정으로 이해 할 때, 그 과정 요소에 대한 설명으로 적합한 것은?","① 실행(Do) – 경영과정을 감독하고 발생된 오류사항을 수정하는 것\n② 계획(Plan) – 목표 설정과 목표 달성 방법을 미리 생각하여 준비하는 것\n③ 감독(Control) – 조직의 목표를 달성하기 위해 인력을 적절하게 투입하는 것\n④ 통제(See) – 설정된 목표와 방법에 따라 자원이나 인력을 사용하는 것","②"],["2","다음 중 해운 기업의 특징을 설명한 것 중 거리가 먼 것은 어느 것인가?","① 해운업은 제품을 생산하는 산업이 아닌 서비스 산업이다.\n② 해운서비스는 화물이나 여객을 수송함으로써 이익을 창출하기 때문에 주요 생산 수단인 선박에 대한 관리가 중요하다.\n③ 해운업은 선박운항업무가 중심이므로 선박운항기술을 요구한다.\n④ 해운업은 서비스산업이라 자본 집약도가 낮다. ","④"],["3","해운기업에서 경영계층을 분류할 때 계층간 그 역할 및 직급이 바르게 짝지어진 것은?","① 최고경영자(CEO) - 조직의 경영에 책임을 진다.\n② 중간관리자(이사) - 매일 활동에 대한 세부 계획을 세운다. \n③ 하위경영자(부장) - 하부조직이 수행할 구체적인 목표를 세우고 정책을 실현한다.\n④ 하위경영자(실장) - 조직의 나아갈 방향을 제시한다. ","①"],["4","해운기업의 경영관리 특징을 설명한 것으로 옳지 않는 것은? ","① 육상과 선박에 대한 관리업무가 필요하다.\n② 해외거래 및 외지업무가 필요하다.\n③ 선박운항을 중심으로 한 기술적 요소가 강하다. \n④ 설비투자 부문보다 인적관리가 강한 노동집약적 산업이다. ","④"],["5","선박회사가 선박의 감항능력을 확보하는 시기에 관한 설명 중 맞는 것은? ","① 선적지에서 선적 직전까지\n② 선적지에서 선적 개시로부터 출항시까지\n③ 선적지에서 출항 직전까지\n④ 선적지 출항 후 양하 완료까지","②"],["6","다음 중 해운의 의의로 적당하지 않은 것은?","① 경제적으로 국가의 무역촉진, 국제수지개선 및 노동수요 창출에 의한 고용 효과 증진\n② 국방상으로는 군사상 또는 안보상 필요에 있어서 필수적인 요소\n③ 정치적으로 해운수요의 공급원인 무역환경을 독점하기위한 수단\n④ 외교적으로 자국 상선대의 전세계 운항 및 간접적인 국위선양 효과 ","③"],["7","해운의 기본 적인 특징을 서술한 것으로 관계가 먼 것은?","① 대량운송        ② 운송로가 자유롭고 무한정\n③ 국제성이 강함   ④ 고가의 운송비","④"],["8","다음 해운의 기능과 역할을 서술한 것으로 타당하지 않은 것은?","① 자국상선대 확충을 통한 국제무역발전의 촉진효과\n② 해운력은 국방력의 척도임으로 국가안보의 기여 효과 \n③ 원유나 기초 원자재의 물량 확보를 통한 국내 물가의 안정효과\n④ 해상운임을 통한 국제수지의 경감효과","④"],["9","해상화물 운송의 발달과정을 서술한 것으로 옳바르지 않은 것은?","① 1765년 최초의 증기선 건조\n② 세계 2차 대전 이후 상선 경영 도입\n③ 1966년 미국과 유럽간 컨테이너운송 본격화(RO/RO선 등장)\n④ 1970년대 이후 컨테이너 규격화, 적재 및 하역의 기계화","①"],["10","해상화물 운송의 중개 또는 선박의 대여 및 매매의 중개을 하는 해운사업은 다음 중 어느 것인가?","① 해상여객운송사업    ② 해상화물운송사업\n③ 해운중개업          ④ 선박관리업","③"],["11","내항화물운송 및 외항 정기 및 부정기 화물운송을 주요 사업으로 하는 해운사업은 다음 중 어느 것인가?","① 해운 대리점업       ② 해상화물 운송사업\n③ 선박대여업          ④ 해운여객 운송사업","②"],["12","화주나 선박운항 업자로 부터 위탁을 받아 항만에서 해상운송을 하기 전후로 화물을 선박에 적재하거나 양륙하는 사업은?","① 항만검수사업       ② 해운대리점업\n③ 항만운송사업       ④ 해상여객사업","③"],["13","한국해운발전과정을 연대별로 기술한 것 중 올바르지 않는 것은?","① 50년대 발아기로 대한해운공사의 설립\n② 60년대 성장기로 경제개발계획에 따른 해상 물동량의 급신장\n③ 70년대 도약기로 해운업체데 대한 금융 및 세제상의 지원\n④ 80년대 침체기로 육상해운전문인력부족","④"],["14","2000년대의 한국해운발전의 현황을 기술 한 것으로 적합하지 않은 것은?","① WTO 시대에 따른 국제적인 개방화    ② 각 선사나 해운회사의 부채 비율 증가\n③ 비효율적인 선대의 매각 및 축소      ④ 대대적인 구조 조정","②"],["15","해운과 무역에 대한 관련성을 정리한 것 중 타당하지 않는 것은?","① 무역이 없으면 해운이 발달할 수 없고, 해운이 없으면 무역이 발달할 수 없다. \n② 해운수요는 무역의 파생적 수요(derived demand)이다. \n③ 무역상품구조의 변화와 선박의 종류와 그 변화에는 영향이 미치지 않는다. \n④ 무역지역구조의 변화는 수송거리의 변화를 가져온다. ","③"],["16","해상운송 초기의 운송인으로 선주, 선장 및 하주가 동일인인 운송인을 말하는 것은?","① 자가운송인(Private Carrier)              ② 상인운송인(Merchant Carrier)\n③ 공공운송인(Common Carrier)             ④ 기업운송인(Industrial Carrier)","①"],["17","해상운송의 발달과정에서 특정한 항로의 항구사이를 반복운항하는 선박의 경영만을 전문으로 하는 운송 전문 경영자는 다음 중 누구인가?","① 자가운송인(Private Carrier)              ② 상인운송인(Merchant Carrier)\n③ 공공운송인(Common Carrier)             ④ 기업운송인(Industrial Carrier)","③"],["18","해상운송과 세계 교역과의 상관성을 설명한 것 중 거리가 먼 것은?","① 전세계 교역물동량의 95% 이상을 담당\n② 대부분 이국간의 거래이므로 무역/교역과 불가분의 관계\n③ 교역량 상승 및 하락율은 해상물동량의 상승 및 하락율에 유사한 형태의 동향\n④ 운송로의 자유성에 제약이 있으므로 근해운송에만 집중","④"],["19","다음 중 세계 주요 4대 해운 시장으로 거리가 먼 것은?","① 영국 런던(Baltic Exchange)     ② 싱가포르\n③ 일본 동경                    ④ 미국 뉴욕(New York Maritime Exchange) ","②"],["20","해운시장의 경향을 파악하여 용선활동을 하는 이의 역할과 관계가 먼 것은?","① 정보수집가(Information Collector)   ② 정보의 판단자(Judge)\n③ 정보의 판매자                   ④ 정보의 보급자(Distributor)","③"],["21","선박 운항비(operating costs)에 해당 되지 않는 항목은 다음 중 어느 것인가?","① 선원비(manning costs)   ② 선용품비(stores costs)\n③ 연료비(bunker expense)  ④ 보험료(insurance)","③"],["22","해운업의 주 수익원은 무엇인가?","① 운임수입     ② 부대수입     ③ 대선수입     ④ 영업외수입","①"],["23","용선계약상 약정된 정박기일 내에 화물의 선적이 끝나지 않은 경우에 연장된 정박일수에 해당하는 약정금액을 화주로 부터 선주가 징수하는 지체료는?","① 조출료    ② 체선료    ③ 수수료    ④ 수임료","②"],["24","해상운송의 주된 영업활동 이외의 활동에서 획득한 제반 수입의 종류에 해당하지 않는 것은?","① 수입이자     ② 자산평가이익    ③ 환차이익     ④ 항만관련수입","④"],["25","해운업에서 수입인식의 4가지 기준에 해당되지 않는 것은?","① 화물선적기준      ② 본선출항기준    ③ 보험차익기준      ④ 항해진행기준","③"],["26","목적항에 도착하여 화물의 양륙이 완료된 시점에서 수익을 인식하는 수입인식기준은 무엇이라고 하는가?","① 화물선적기준      ② 본선출항기준    ③ 항해진행기준      ④ 항해완료기준","④"],["27","우리나라 기업회계기준으로 많이 활용되는 수입인식기준은 다음 중 무엇인가?","① 화물선적기준      ② 본선출항기준    ③ 항해진행기준      ④ 항해완료기준","③"],["28","해운원가의 특성을 기술한 것 중 바람직하지 못한 것은?","① 운송원가는 생산을 전제로 원가각 계상된다. \n② 해운원가는 진행기준(기간별) 원가계산이다. \n③ 해운원가에서 금리는 선비로 인정되지 않는다. \n④ 복합운송의 경우는 그에 따른 원가도 계상해야 한다. ","③"],["29","해운원가의 구성요소로 해당되지 않는 것은?","① 자본비     ② 관리비      ③ 재고비      ④ 운항비","③"],["30","화물량의 증감에 따라 비례하여 발생하는 제반비용은?","① 화물변동비     ② 운항변동비    ③ 운항고정비    ④ 일반관리비","①"],["31","선박을 운항가능한 상태로 유지하기 위한 비용은?","① 일반관리지     ② 운항변동비    ③ 운항고정비    ④ 영업외비용","③"],["32","다음 중 선박의 입출항 및 정박을 위한 제반비용인 항비의 종류가 아닌 것은?","① 도선료(pilotage)          ② 예선료(tug charge)\n③ 부두사용료(wharfage)     ④ 운항준비비(Running cost)","④"],["33","화물변동비 중 화물 수입 및 화물량의 크기에 따라 발생하는 비용은 다음 중 어느 것인가?","① 하역비          ② 화물비      ③ 장비비          ④ 대리점비","④"],["34","해운용역을 생산하기 위한 원가의 발생을 인식하고 이를 분류, 종합, 분석하는 것을 의미하는 것은?","① 일반관리비계산          ② 선박취득관리비계산\n③ 운항준비비용계산        ④ 해운원각계산","④"],["35","해운원가계산의 목적으로 타당하지 않는 것은?","① 판매가격의 결정에 필요한 원가자료를 제공\n② 예산집행계획 및 통제에 필요한 원가자료를 제공\n③ 선박투입을 위한 운항준비비계상을 제공\n④ 화물운송에 따른 손익을 계산하는데 필요한 원가자료를 제공","③"],["36","해상운임의 종류에서 운임부과방법에 따른 분류로 적당하지 않은 것은?","① 종가운임(ad valorem freight)    ② 차별운임(discrimination rate)\n③ 최저운임(minmum rate)         ④ 경쟁운임(open rate)","④"],["37","북미 태평양 연안항만에거 하역되어 동부내륙지역으로 육상운송되는 화물에 대해 낮은 해상운임률을 적용하여 화물을 유치하기 위한 정책운임은 다음 중 어느 것인가?","① 무차별 운임(freight all kinds rate)    ② 경쟁운임(open rate)\n③ 특별운임(Special rates)            ④ O.C.P. Rate(overland common point rate)","④"],["38","한 개의 중량이 3톤 이상의 초중량화물에 부과하는 할증료는 다음 중 어느 것인가?","① 장척할증료(lengthy surcharge)        ② 중량할증운임(heavy lift surcharge)\n③ 용적할증운임(measurement surcharge) ④ 체선할증료(port cogestion surcharge)","②"],["39","부정기선 운임의 산정기준에 대해 서술한 내용 중 적합하지 않은 것은?","① 운임조건은 용선계약에 의해 결정된다. \n② 운임은 적재화물의 수량에 대해 결정한다. \n③ 운임은 중량과 용적에 의해 결정된다. \n④ 운임은 선복에 대하여 결정되기도 한다. ","③"],["40","다음 중 부적운임(dead freight)에 대한 설명 중 적합한 것은?","① 기항지 간에 용적이나 중량 등을 기준으로 한 운임을 말한다.\n② 선적 시에 양하항을 확정하지 않고 출항 후 일정기간 뒤에 양하항이 지정되는 양하선택권부 화물에 부과하는 운임을 말한다. \n③ 송화인이 운송계약체결 후 화물의 관리를 태만하게 하였거나 또는 여약한 선적을 이행하지 못한 경우 선주에게 지불해야 할 운임을 말한다. \n④ 해운동맹이 비동맹선사와의 경재, 특정화물의 유치, 대량화물에 대한 우대 등을 위해 일정조전을 갖춘 굥우 요율을 인하하여 적용하는 운임을 말한다. ","③"],["41","다음은 해상운임의 지급 시기에 대하여 서술한 내용 중 적합하지 않은 것은?","① 해상운임은 선적과 동시에 송화인에게 지급하는 운임을 선불운임(freight prepaid)라고 한다. \n② 양륙지에서 매수인이 화물을 수령할 때 지급하는 운임을 후불운임(freight collect)라고 한다. \n③ 일반적으로 CIF계약이나 CFR계약에서는 통상운임이 후불로 지불 된다. \n④ FOB와 같이 후불인 경우에는 양륙지에서 화물인도지시서(Delivery Order) 발급일, 즉 운임지급일의 환율을 적용한다. ","③"],["42","다음 중 적화보험약관의 해석원칙으로 부적합한 것은?","① 작성자 이익의 원칙   ② 수기문언 우선의 원칙\n③ 계약당사자 의사 존중의 원칙 ④ 증권상의 문언중심의 해석원칙","①"],["43","다음 중 해상고유의 위험(peril of the sea)이 아닌 것은?","① 침몰(sinking)   ② 충돌(collision)   ③ 좌초(stranding)   ④ 화재(fire) ","④"],["44","다음 보험용어 중 잘못 짝지어진 것은?","① 피보험자 - The assured         ② 보험의 목적 - Subject-matter insured\n③ 피보험이익 - Insurable interest   ④ 보험가액 - Amount insured","④"],["45","다음 중 해상보험에 대한 설명으로 적합하지 않은 것은?","① 피보험이익은 계약 체결시에는 존재하지 않아도 상관없으나 사고발생시에는 반드시 존재하여야 한다.\n② 고지사항은 보험인수 및 보험료산정에 영향을 미치는 사항들이다.\n③ Warranty를 위반하면 위반시부터 보험자는 책임을 면하게 된다.\n④ 법정보험가액은 계약체결시의 시장가액이며 이는 보험자가 보상하는 최고한도액이다.","④"],["46","적화보험 FPA조건에서의 담보위험이 아닌 것은?","① 선박의 좌초   ② 투하     ③ 선박의 충돌   ④ 갑판유실","④"],["47","경제학적 의미에서 본 보험의 정의는 다음 중 어느 것인가?","① 위험증가와 결합에 의하여 불확실성을 감소시키는 제도\n② 위험을 개별가계나 기업으로부터 위험을 전담하는 금융기관으로 전가시킴으로서 위험을 분산시키는 제도\n③ 손해보상계약을 통하여 보험계약자가 보험료를 지급함으로서 위험을 보험자에게 전가시키는 제도\n④ 피보험자가 불의의 사고를 당했을 경우 보험자가 그 손실에 상응하는 금전적 보상이나 혹은 그러한 위험과 관련된 서비스를 제공하는 제도","①"],["48","우리나라 상법에서 해상보험의 계약에 관해서 어떻게 정의하고 있는가?","① 보험자가 피보험자에 대하여 그 계약에 의하여 합의된 방법과 범위내에서 해상손해 즉 해상사업에 부수되는 손해를 보상할 것을 인수하는 계약이다.\n② 해상사업에 관한 사고로 인하여 생길 손해를 보상할 것을 목적으로 하는 보험이다. \n③ 보험자에게 전가된 피보험자 손실의 결합체이다.\n④ 일정한 기간을 표준으로 하는 보험이며 주로 선박보험에 이용된다.","②"],["49","다음 손해 중 보험금액에 추가하여 보상될 수 있는 것은?","① 공동해손비용   ② 손해방지비용   ③ 화재손실    ④ 구조료","②"],["50","해상보험계약의 분류에서 선박소유자가 선박에 대하여 피 보험이익을 부보하는 보험은 다음 중 어느 것인가?","① 선박보험(Hull Insurance)      ② 적하보험(Cargo Insurance)\n③ 항해보험(Voyage Insurance)   ④ 혼합보험(Mixed Insurance)","①"],["51","\"부산에서 뉴욕까지로 하되 양륙 후 60일을 한도로 한다.\" 는 규정의 예로 일정기간과 항해의 양지를 표준으로 하는 보험은?","① 선박보험(Hull Insurance)      ② 적하보험(Cargo Insurance)\n③ 항해보험(Voyage Insurance)   ④ 혼합보험(Mixed Insurance)","④"],["52","다음 중 해상보험계약의 법적성격으로 거리가 먼 것은?","① 낙성계약        ② 사행계약\n③ 손해보상계약    ④ 최소선의계약","④"],["53","보험계약은 계약자유의 원칙에 따라 상호협의하여 계약내용을 정하지 않고 보험가자 제시하는 약관을 피보험자가 이를 승인함으로써 성립되는 계약이라고 하는 성격은?","① 쌍무계약    ② 유상계약\n③ 부합계약    ④ 사행계약","③"],["54","해상보험계약에서 피보험위험에 의한 손해 발생 시 보험금을 수령하는 자를 가리키는 말은?","① 보험자(Insurer)     ② 보험계약자(Policy Holder)\n③ 피보함자(Insured)   ④ 보험금 (Claim Amount)","④"],["55","다음 보험서류중 포괄예정보험에서 발급 받는 것은?","① 보험증권    ② 보험확인서  ③ 보험대위서    ④ 보험인수증","②"],["56","다음 중 피보험목적물의 평가액으로 적하보험의 경우 적재장소에서 본선적재가격에 보험료와 수수료를 합친것을 가리키는 것은?","① 보험가액(Insurable Value)    ② 보험금액(Amount Insured)\n③ 보험금(Claim Amount)       ④ 보험료 (Premium)","①"],["57","다음 중 해상보험계약에서 고지불필요사항이 아닌 것은?","① 3년의 기간보험계약에서 2년으로 단축될 수 있는 경우\n② 보험증권상 명시된 항구에서의 적재방식\n③ 보험계약의 인수여부 또는 계약내용에 결정을 줄 수 있는 내용\n④ 도착항에서의 하역방식","③"],["58","피보험자가 고지의무를 위반하였을 경우 보험자의 권리는?","① 보험계약의 취소 ② 보험계약의 고지 ③ 보험계약의 부실고시 ④ 보험계약의 확인","①"],["59","해상위험(Maritime Peril)에서 인위적인 위험(Perils on the Sea)인 경우는?","① 침몰(Sinking)           ② 좌초(Stranidng)\n③ 황천(Heavy Weather)    ④ 화재(Fire)","④"],["60","해상보험에서 구약관인 A/R(All Risks)와 신약관인 ICC(A)는 어떠한 위험부담의 원칙에 준거하나?","① 포괄책임주의    ② 열거책임주의\n③ 제한책임주의    ④ 협정책임주의","①"],["61","해상보험에서 피보험자의 의사유무를 불문하고 출발지 또는 목적지가 변경된 경우에는 어떤 효력이 발생되는가?","① 보험계약의 변경       ② 보험계약의 고지\n③ 보험계약의 취소       ④ 보험료의 추가납부","③"],["62","다음 중 해양사고의 조사 및 심판에 관한 법률의 목적으로 알맞은 것은?","① 해난의 원인규명과 해난의 방지 \n② 항계내의 선박교통의 안전과 질서유지\n③ 항해사 및 해기사의 자격과 정원을 정함  \n④ 해난에 책임 있는 해기사의 징계","①"],["63","다음에서 해양사고의 조사 및 심판에 관한 법률 상 사건 심판의 원칙으로 적합하지 않은 것은?","① 공개주의        ② 서면 심리주의    ③ 증거심판주의       ④ 자유심증주의","②"],["64","다음 중 해양사고의 조사 및 심판에 관한 법률에서 징계의 대상은?","① 해기사나 도선사        ② 항해사      ③ 기관사          ④ 통신사","①"],["65","다음 중 해난심판원의 판결을 무엇이라고 하는가?","① 견책       ② 판결           ③ 재결             ④ 처벌","③"],["66","다음 중 해양사고의 조사 및 심판에 관한 법률에서 징계사유가 있는 날로부터 얼마를 경과하면 심판할 수 없는가?","① 1년        ② 3년      ③ 5년        ④ 7년","②"],["67","다음에서 해난심판원장과 심판관의 임기는 몇 년인가?","① 1년        ② 2년      ③ 3년        ④ 4년","③"],["68","다음의 도시 중에 지방 해난심판원의 소재지가 아닌 곳은?","① 인천        ② 목포       ③ 부산        ④ 서울","④"],["69","만약 묵호항에서 해난이 발생하였다면 어느 해난심판원이 관할 하는 가?","① 중앙 해난심판원           ② 인천지방 해난심판원\n③ 동해지방 해난심판원       ④ 부산지방 해난심판원","③"],["70","만약 국외에서 발생한 해난은 어디에서 관할 하는 가?","① 중앙해난심판원\n② 선적항을 관할하는 지방해난 심판원\n③ 해난이 발생한 곳과 가장 가까운 심판원\n④ 해난이 일어난 지점을 관할하는 지방해난심판원","②"],["71","다음 중 해난심판원의 조사관의 직무들로서 적합하지 않은 것은?","① 해난심판의 청구   ② 재결의 집행    ③ 해난의 조사   ④ 심판부 구성","④"],["72","다음에서 해난심판원의 조사관의 권한을 설명한 것 중 해당되지 않는 것은?","① 선박 기타의 장소를 검사하는 일\n② 수심인 도는 지정해난 관계인을 출석시키거나 질문하는 일\n③ 관공서에 대하여 보고 또는 자료의 제출 및 협조를 요구하는 일\n④ 해난심판의 원인규명이 특히 곤란한 사건의 심판에 참석하는 일","④"],["73","다음 중 중앙해난심판원은 몇 명의 심판관으로 구성되는가?","① 1명 이상     ② 3명 이상       ③ 5명 이상     ④ 7명 이상","③"],["74","다음에서 해사보좌인에 대한 특성을 설명한 것으로 해당사항이 없는 것은?","① 금치산자는 해사보좌인이 되지 못한다.\n② 해사보좌인은 지방 심판원에 등록을 하여야 한다.\n③ 수심인의 이익을 위하여 심판상의 행위를 하는 자이어야 한다. \n④ 지정해난 관계인을 위하여 심판상의 행위를 하는 자이어야 한다. ","②"],["75","다음에서 해사보좌인은 누구의 감독을 직접 받어야 하는가?","① 자벙해난심판원장    ② 해양수산부장관    ③ 중앙해난심판원장   ④ 법부부장관","③"],["76","지방해난심판원에서 결정을 받은 자가 중앙해난심판원에 대하여 이의를 제출할 수 잇는 기간은 몇일 이내인가?","① 7일이내      ② 10일이내     ③ 14일이내     ④ 30일이내","①"],["77","대한민구 영사가 국외에서 해난 사실을 인지하였을 때 누구에게 통보하여야 하는가?","① 지방해난심판원    ② 지방수석조사관    ③ 중앙해난심판원     ④ 중앙수석조사관","④"],["78","다음 중 해난심판법상의 해난으로 정의될 수 없는 경우는?","① 타선박의 표류를 인지\n② 선박의 안전 또는 운항 저해 \n③ 선박구조설비 또는 운용에 관련된 사람의 사상\n④ 선박이 멸실되거나 선박운용에 관련하여 시설의 손상","①"],["79","다음 중 해난이 발생하고 몇 년이 경과하고 나면 심판을 청구할 수 없는가?","① 1년     ② 3년    ③ 5년     ④ 7년","②"],["80","다음에서 지방해난심판원은 누구의 심판 청구에 의하여 개시하는가?","① 심판관     ② 수심인     ③ 조사관     ④ 해사보좌인","③"],["81","다음 중 해양오염방지법 상 해양 시선에 속하지 않는 것은?","① 해역과 연결된 구조물              ② 해역에 고정설치 된 부선 \n③ 이동할 수 있는 해저석유 채취장치   ④ 사람을 수용할 수 있는 시설을 갖춘 구조물 ","③"],["82","선박 좌초 시의 조치사항 중 적당하지 않는 것은?","① 좌초 즉시 기관전속 후진을 걸어 선저 손상을 감소 할 수 있도록 한다. \n② 일단 기관 정지 후 침수 유무를 확인한다. \n③ 선위, 전체 주위의 수심, 저질 등을 조사한다. \n④ 자력이초 가능 여부 등을 검토한다. ","①"],["83","선박충돌 즉시 선수 방위 및 선위의 확인이 필요한 가장 주된 이유는 무엇인가? ","① 선체 손상의 정도를 확인하기 위하여  ② 기관 사용 가능성 여부를 판단하기 위하여\n③ 충돌의 원인을 규명하기 위하여       ④ 구난 작업의 효율성을 높이기 위하여","③"],["84","다음 중 일반적으로 많이 사용하는 해상 수색(Search)의 방법이 아닌 것은?","① Sector Search              ② Expanding Square Search\n③ Parallel Sweep Search       ④ Contour Search","④"],["85","조난자가 위치표시를 하기 위하여 취해야할 조치 중 틀린 것은? ","① 해묘를 투하하여 표류를 감소시킨다. \n② 구명정, 구명 뗏목 등을 서로 분산시킨다.\n③ 조난신호 용구를 적절히 사용한다. \n④ 휴대용 무선통신기를 이용하여 구조자와 교신을 시도한다. ","②"],["86","다음 중 유독가스에 중독된 환자의 조치 방법으로 옳지 않은 것은?","① 신선한 공기가 있는 곳으로 이동한다. \n② 다량의 음료를 제공하여 구토하도록 한다. \n③ 옷을 느슨하게 풀어주고 의식이 있는 환자는 심호흡을 시킨다. \n④ 가능하다면 산소를 공급한다. ","②"],["87","다음 중 충돌사고 시 선주에의 보고 내용과 가장 거리가 먼 것은 어느 것인가? ","① 본선의 출항일, 출항항, 목적항     ② 상대선의 선명, 선적항, 출항항\n③ 본선의 자이로컴퍼스 오차         ④ 유출유의 유무 및 확산 상황","④"],["88","자동 충돌방지장치에서 충돌회피를 위하여 미리 시뮬레이션을 하여 그 예상결과를 판단 할 수 있는 기능은?","① 시행조선 기능    ② 경보 기능\n③ 물표추적 기능    ④ 항적표시 기능","①"],["89","다음 중 충돌사고의 원인과 가장 거리가 먼 것은 어는 것인가?","① 선교 항해 당직자의 주의 태만으로 인한 과실\n② 항해사의 적절한 운용술의 미숙\n③ 항해장비의 정비 불량과 운용 미숙\n④ 강한 횡조류압력에 의한 항로 이탈","④"],["90","선원(승조원)의 근로환경의 특수성을 기술한 것 중 타당하지 않은 것은?","① 해상에서 일어날 다양한 위험과 선체 또는 기계장비의 고장위험등을 안고 있다.\n② 고립된 공간에서 직장근무와 개인적 사생활을 함께하는 운명공동체적인 성격을 띤다.\n③ 선상에서의 생활로 가정적, 사회적, 문화적 생활이 제한 받고 있다. \n④ 임금을 받을 목적으로 배안에서 근로를 제공하고 고용된다. ","④"],["91","선장의 업무 분장으로 해당되지 않는 것은?","① 선박, 승조원의 지휘, 감독, 선내 제반 업무의 총괄\n② 선박의 안전 운항 및 인명, 재선의 보호관리\n③ 갑판부 업무 총괄 및 하역 책임\n④ 선박의 경제적 운항과 영업상의 수익 증진을 위한 노력","③"],["92","갑판부에 분장된 업무로 해당되지 않는 것은?","① 선내의료, 위생 관련 업무            ② 항해 및 정박 당직 업무\n③ 해사관련 법규 및 사규의 준수, 이행   ④ 안전설비 및 관련 비품의 보수 및 유지","③"],["93","선장을 보좌 하고 갑판부 업무 총괄로 선내 기율관계 책임사관의 역할을 담당하는 자는?","① 1등 항해사    ② 2등 항해사        ③ 갑판장        ④ 1등 기관사","①"],["94","항해 시 항해사와 조를 지워 선교당직근무를 하며 출항 시는 선장, 도선사, 항해사의 명령에 의거 업무수행을 하는 자는?","① 갑판원    ② 갑판장    ③ 갑판수     ④ 조기장","②"],["95","기관부에 분장된 업무로 적합하지 않은 것은?","① 기관의 운전 관련 업무     ② 연료 및 윤활류의 수급 및 관리\n③ 화물 및 하역 관련 업무    ④ 항해 및 정박 당직 업무","③"],["96","기관장의 주요 업무 사항에 적합하지 않은 것은?","① 선내보수 및 정비업무 책임\n② 승선실습 및 육원승선 실습 등 선내교육의 집행\n③ 연료 및 윤활유의 관리 및 에너지 절감 방안 수립 및 실천\n④ 선내 기강 확립 및 질서 유지","④"],["97","기관부의 직장으로 1기사의 지시를 받아 기관의 정비 및 보수 작업등을 수행하는 자는?","① 기관수(oiler)           ② 기관원(wiper)\n③ 조기장(No. 1 oiler)     ④ 갑관수(quarter master)","③"],["98","통사부에 분장된 업무가 아닌 것은?","① 무선통신 관련 업무    ② 선내보수 관련 업무\n③ 선내급식 관련 업무    ④ 출입항 수속 및 내객 접대, 일반 서무 업무","②"],["99","다음 중 해상노동의 특수성에 대한 설명으로 관계가 먼 것은?","① 선박은 하나의 위험공동체를 이룬다.\n② 국가의 보호감독으로부터 고립되지 않은 선내생활을 한다.\n③ 선원의 선내질서유지를 통한 해상의 안전도모에 따른 제약을 동반한다.\n④ 선원은 가정과 분리된 이중생활을 강요받을 수밖에 없는 상황에서 노동이 이루어진다.","②"],["100","다음에서 해양사고의 조사 및 심판에 관한 법률에서 권고의 대상자는 누구 인가?","① 해기사     ② 도선사      ③ 해기사와 도선사     ④ 해기사, 도선사 이외의 자","④"]]},{"name":"비슷하고 헷갈리는거 모아둠","rows":[["94","항해용선계약(Voyage Charter Party)에 관한 설명중 틀린 것은?","① 용선료를 용선기간에 따라 결정하고 용선개시전에 미리 선급한다.\n② 용선자는 선복을 이용하고 선주는 운송행위를 한다.\n③ 선주와 용선자간의 계약내용으로는 선내하역비 부담조건과 정박기간에 관한 사항이 중요시 된다.\n④ 용선자는 선주에게 운임을 지급하고 선주는 선박운항에 따른 제비용을 부담한다.","①","","","",""],["","항해용선의 운임은 화물의 수량을 기초로 지불되나, 정기용선의 용선료는 무엇에준거하여 지불되는가?","① 인도기일         ② 항행구역     ③ 계약기간          ④ 하역시간","③","","","",""],["90","다음은 항해용선계약을 체결하는 순서로 올바르게 짝 지어진 것은?","① Inquiry for ship\u0027s space - Firm offer for ship\u0027s space - Fixture note - Counter offer\n② Firm offer for ship\u0027s space - Inquiry for ship\u0027s space - Fixture note - Counter offer\n③ Firm offer for ship\u0027s space - Inquiry for ship\u0027s space - Counter offer - Fixture offer\n④ Inquiry for ship\u0027s space - Firm offer for ship\u0027s space - Counter offer - Firm offer","①","","","",""],["94","다음 중 항해용선계약의 본질로 관계가 적은 것은?","① 어느 항에서 어느 항까지 화물의 수송을 화주인 용선자(charterer)와 선주(owner) 사이에 맺는 운송계약을 말한다. \n② 계약의 주 내용이 어디까지나 기간으로 계약하는 용선이다. \n③ 항해용선은 1항해를 대상으로 하는 단독항해용선(single voyage charter)이 통상이다.\n④ 연속항해의 경우에 있어서도 기본적 내용은 단독항해용선의 경우와 거의 같다.  ","②","","","",""],["88","다음 중 항해용선계약의 특징을 설명한 것으로 바람직하지 못한 것은?","① 선장은 선주가 임명한다. \n② 항해 항차수를 계약내용으로 한다. \n③ 용선자가 부족한 선복을 보충하기 위해서이다.\n④ 항해에 대한 대가는 운임이며, 선박적재량 또는 선복량에 따라 지불한다. ","③","","","",""],["98","다음에서 선복의 전부를 빌리기는 하지만 어느 특정 항해를 위해 용선되는 계약을 무엇이라고 하는가?","① 전부용선계약(whole charter)  ② 일부용선계약(partial charter)\n③ 항해용선계약(voyage charter)     ④ 정기용선계약(time charter)","③","","","",""],["96","항해용선계약에서 화물량보다 실제 선적량이 적은 경우 용선자(Charterer)인 화주가 그 부족분에 대해서도 지불하는 운임은?","① 선불운임(Advanced Freight)     ② 부적운임(Dead Freight)\n③ 반송운임(Back Freight)         ④ 후불운임(Destination Freight)","②","","","",""],["92","다음 중 자본력이 약한 운항선사가 선복을 보충하면서 선대(fleet)를 늘리는 일종의 할부제도 내지 리스제도는?","① 나용선계약       ② 항해용선계약\n③ 정기용선계약     ④ 선복용선계약","①","","","",""],["96","개품운송계약의 대표적인 것은 컨테이너 운송이고, 이는 국제해운에서 어떤 계약으로 발전하였는가?","① 국제복합운송계약    ② 항해용선계약      ③ 정기용선계약      ④ 물건운송계약","①","","","",""],["96","부정기선 항로에서 항해용선계약을 체결 했을 시 운송의 책임자는 누구인가?","① 선주         ② 화주          ③ 해상운송인        ④ 중개인","③","","","",""],["96","다음에서 정기선 항로에서 컨테이너 운송과 재래식 정기선에서 사용하는 계약은?","① 개품운송계약    ② 항해용선계약      ③ 정기용선계약      ④ 물건운송계약","①","","","",""],["","다음의 부정기선의 용선방법의 종류에 해당되지 않는 것은?","① 정기용선         ② 항해용선        ③ 나용선     ④ 개품운송","④","","","",""],["","다음에서 선복의 전부를 빌리기는 하지만 어느 특정 항해를 위해 용선되는 계약을 무엇이라고 하는가?","① 전부용선계약(whole charter)  ② 일부용선계약(partial charter)\n③ 항해용선계약(voyage charter)     ④ 정기용선계약(time charter)","③","","","",""],["","다음의 부정기선 운항형태 중 선박만을 용선하여 인적 및 물적요소 전체를 용선자가 부담하는 방식은 무엇인가?","① 항해용선(Voyage Charter)    ② 일대용선(Daily Charter)\n③ 선복용선(Lump-sum Charter)  ④ 나용선(Bare-boat Charter)","④","","","",""],["","부정기선의 경우 신속한 항해나 정확한 스케쥴보다는 무엇이 더 중요한가?","① 화물의 가치        ②  화물의 출하 시기  ③ 저렴한 운임        ④  화물의 수송 단위","③","","","",""],["","다음에서 부정기선 운항 시 관심을 두어야 할 점은 무엇인가?","① 적절한 배선        ②  육상설비투자  ③ 저렴한 운임        ④  항로및 항해시기","①","","","",""],["","다음에서 본선 갑판 상에 컨테이너 하역용 갠트리 크레인을 장착하고 있는 컨테이너 선은?","① 기어 컨테이너선    ② 세미 컨테이너선\n③ 풀 컨테이너선      ④ 컨버터블 컨테이너선","①","","","",""],["","정기선운영에서 컨테이너 적재를 목적으로 하고 있지만 벌크도 실을 수 있는 겸용 선박은?","① 기어 컨테이너선    ② 세미 컨테이너선\n③ 풀 컨테이너선      ④ 컨버터블 컨테이너선","④","","","",""],["","다음 중 컨테이너 적재를 목적으로 하고 있지만 벌크도 실을 수 있는 겸용 선박은?","① 풀 컨테이너선(Full container ship)     ② 컨버터블 컨테이너선(Convertible container ship)\n③ 세미 컨테이너선(Semi-container ship)   ④ 기어레스 컨테이너선(Gearless container ship)","②","","","",""],["","다음에서 컨테이너와 컨테이너를 넣지 않은 화물(break bulk) 두 가지를 적재하는 장비를 설치한 선박은?","① 풀 컨테이너선(Full container ship)     ② 컨버터블 컨테이너선(Convertible container ship)\n③ 세미 컨테이너선(Semi-container ship)   ④ 기어레스 컨테이너선(Gearless container ship)","③","","","",""],["","해운동맹의 일괄운임인상(GRI)인 경우에는 화주 및 화주단체에 몇일 전에 통보해야 하는가?","① 150일      ② 100일        ③ 50일       ④ 30일","①","","","",""],["","다음에서 1등 항해사가 적화계획을 세울 때에는 최대의 경제성이 발생할 수 있게 하기 위해 중점을 두어야 하는 것과 거리가 먼 것은?","① 적화의 양을 결정한다. \n② 중심의 위치를 적당하게 한다. \n③ 트림(배의 전후의 경사)을 최적으로 한다.  \n④ 선창의 용적을 결정한다. ","④","","","",""],["","선박의 조정이나 선적량의 산출에서 사용하는 거리로 선박법상 그 표시를 규정하고 있는 것은?","① 형흘수 ((Moulded draft)                ② 용골 흘수 (Keel draft)\n③ 전부흘수(Fore draft)                   ④ 중앙부 흘수(Midship draft)","②","","","",""],["","선박의 안전을 확보하기 위해 선체 높이의 일정 부분이 물에 잠기지 않도록 하여 예비부력을 확보해야 하는 데 이를 무엇이라 하는가?","① 건현(Freeboard)           ② 만재 흘수선(Full load line)\n③ 횡경사(Heel)              ④ 전장(Length over al)","①","","","",""],["","선박에서 인간의 몸을 포함한 모든  내외 컨테이너를 운송할 수 있는 선박은?","① 파나맥스(Panamax)                 ② 초대형 컨테이너선\n③ 포스트 파나맥스(Post Panamax)      ④ 핸디 사이즈(Handy size)","④","","","",""],["","다음 중 AEO(Authorized Economic Operator)제도를 서술한 것으로 적합하지 않은 것은?","① 선박의 안전확보, 항만시설의 보안유지와 관련한 제도이다. \n② 수출입 정보를 사전에 세관에 제공하는 제도이다. \n③ 국가별 세관이 AEO 상호협정 체결 시 통관절차를 완하하는 제도이다. \n④ 우리나라는 2008년부터 도입하여 운영 중이다. ","①","","","",""],["","다음 혼재업자(condolidator)의 임무를 설명한 것 중 적합하지 않은 것은?","① 화물의 생산일정 파악    ② 선적준비 완료된 화물의 혼재계획 수립\n③ 선적서류 작성 및 제출   ④ 국내운송료 및 선박운임료 결정","④","","","",""],["","혼재화물(Consolidated Cargoes)의 경우 혼재된 화물의 내용, 순위 및 위치를 컨테이너별로 기재한 서류를 말하는 것은?","① Master(Ocea Carrier) B/L    ② Commercial Invoice\n③ Packing List               ④ Container Load Plan","④","","","",""],["","한 사람의 Forwarder가 수입업자로 부터 위탁을 받아 다수의 수출업자로 부터 화물을 집화하여 컨테이너에 혼재하는 경우를 말하는 것은?","① Forwarder\u0027s Consolidation             ② Buyer\u0027s Consolidation\n③ Port Consolidation                    ④ Multi Consolidation","②","","","",""],["","한사람의 Forwarder가 다수의 수출업자로 부터 화물을 혼재하여 혼재화물 목적지가 항만으로 되어 있는 형태는?","① Forwarder\u0027s Consolidation             ② Buyer\u0027s Consolidation\n③ Port Consolidation                    ④ Multi Consolidation","③","","","",""],["","정기용선계약의 표준시식으로 뉴욕상품거래소가 1913년 제정하여 1946년 개정한 양식은?","① Baltime       ② Produce Form    ③ Coastcon Medcon     ④  Benacon ","②","","","",""],["","선박 복원성의 좋고 나쁨을 판단하는 가장 중요한 요소는 어느 것인가?","① 선박의 무게     ② 선박의 부심\n③ 선박의 경심     ④ 메타센터의 높이","④","","","",""],["","다음에서 해상화물운송장(Sea Waybill)에 대한 설명으로 부적합한 것은?","① 권리증권이므로 항해 중에 증권을 이전함으로써, 물품의 전매나 담보가 가능하다. \n② 해상화물운송장에 관한 규칙은 CMI uniform rules for Sea Waybill 1990 이다. \n③ 계약상품의 인도 또는 적재를 입증하는 비유가 증권 서류이다. \n④ 송화인에게 발행하는 서류이지만, 선하증권과 달리 운송품 인도청구권을 상징하지 않기 때문에 양도성이 없다. ","①","","","",""],["","대규모의 생산설비 및 건설기자재가 특정한 공사계획에 따라 일시 또는 지속적으로 운송될 경우 발생되는 화물의 취급업무를 지칭하는 것은?","① Co-Loading Service        ② Project Cargo Handling Service\n③ Consolidation Service       ④ Hanging Garment Handling Service","②","","","",""],["","가죽 및 모피의류 등과 같은 고가의 의류수송 서비스 형태로 Cartib Box에 의한 운송 서비스를 말하는 것은?","① Co-Loading Service                 ② Project Cargo Handling Service\n③ Exhibition Cargo Handling Service     ④ Hanging Garment Handling Service","④","","","",""],["","Hanging 장치의 종류에서 Dead Space의 발생을 초래할 수 잇는 System으로 주로 가죽제품, 모피제품의 수송에 이용되는 것은?","① Rope System       ② Tag System\n③ Bar System        ④ Rack System","③","","","",""],["","전시화물 취급서비스(Exhibition Cargo Handling Service)의 특징으로 적절하지 않은 것은?","① 포장의 중요성                       ② 비용절감\n③ 일시수입통관증서(ATA Carnet) 필요    ④ 왕복운송업무","②","","","",""],["","다음은 양륙항 선택화물(Optional Cargo) 할증과 관계된 설명으로 잘못 된 것은?","① 화물 선적시에 양륙항이 지정되지 않고 출항 후에 화주가 가장 편리한 양륙지를 선적하여 그 항구에서 양륙하여 화물을 인도하는 경우임.\n② B/L의 양륙항 난에는 예컨대 \u0027London/Hamburg option\u0027 혹은 \u0027Pusan/Inchon option\u0027과 같이 두 개 이상의 항구가 명시됨. \n③ 송화인 또는 수화인은 본선의 선적지 출항 후 최초의 선택항 도착 전 일정일(보통 24시간 또는 48시간 전)까지 양륙항을 결정하여 그 항구에 있는 선박회사 대리점에 통고함.\n④ 중개인이 선택 지정하여 양륙·하도하는 화물을 Optional Cargo라고 함. ","④","","","",""],["","국제 무역거래에서 해상운송과 함께 도로, 철도, 하천, 호수를 이용한 운송의 형태는 다음 중 어느 것인가?","① 내륙운송       ② 해상운송         ③ 항공운송       ④ 복합운송","①","","","",""],["","1960년대 들어 국제간 교역량이 확대되어 적어도 두가지 이상의 운송수단에 의하여 물품을 운송하기 위한 단일계약에 의해 이루어지는 물품운송은?","① 내륙운송       ② 해상운송         ③ 항공운송       ④ 복합운송","④","","","",""],["","다음에서 선하증권의 이전(transfer)에 대한 설명으로 적절하지 않은 것은?","① 선하증권 소유자가 자기의 소유권을 새로운 소유자에게 이전시키는 목적으로 그 물건을 타인에게 교부하는 것을 이전(transfer)이라 한다. \n② 지시식 선하증권, 배서금지문언이 없는 기명식 선하증권, 무기명식 선하증권 및 선택무기명식 선하증권의 이전은 양도라고 한다. \n③ 양도배서금지문언이 있는 기명식 선하증권의 이전은 지명채권양도라고 한다.\n④ 선하증권에서 양도는 기명식 선하증권에 대하여 사용된다. ","④","","","",""],["","다음에서 기명식 선하증권과  이전(transfer)에 대한 설명으로 올바르지 않는 것은?","① 기명식 선하증권은 양도는 가능하다.  \n② 기명식 선하증권의 양수인은 양도된 취지를 운송인에게 합법적으로 통지하여야 된다.\n③ 기명식 선하증권의 양도된 사실을 통지 하기 전에 이미 양도인에게 물건이 인도된 경우에 양도는 무효가 된다.\n④ 선하증권에서 양도는 기명식 선하증권에 대하여 사용된다. ","③","","","",""],["","다음에서  해상화물 운송장의 법적 특징으로 관계가 먼 것은?","① 물품을 수취 또는 선적을 증명하는 서류라는 점에서는 B/L의 성격과 일치한다.\n② 물품을 인수하기 위하여 수화인의 운송인에게 제시하여야 하는 B/L과는 달리 제시할 필요가 없다.\n③ 해상화물운송장은 물품을 대표하는 유가증권적 성격이 강하다. \n④ 해상화물운송장은 기명식으로된 유통불능성의 성격을 지니고 있다. ","③","","","",""],["","다음 중 선하증권의 이전과 관련된 용어의 부적절한 설명은?","① 이전은 유통증권 또는 권리증권의 소유자가 자기의 소유권을 새로운 소유자에게 이전시키는 목적으로 그 물건을 타인에게 교부하는 것을  말한다. \n② 유통은 양도의 개념으로 증권상의 권리를 유통이라는 방법으로 양수받은 자는 증권상의 정당한 권리자이지만, 정당한 소지인이 아니다. \n③ 배서는 유통증권의 소지인이 가지고 있는 증권상의 권리를 타인에게 이전하는 목적으로 통상 그 증권의 배면에 서명하고 피이전자에게 이것을 교부하는 것을 말한다. \n④ 양도는 화물의 양도와는 달르기 때문에 배서의 형식과  그 방법은 중요치 않다. ","④","","","",""],["","다음에서 Hague Rules에 대한 설명으로 적합하지 않은 것은?","① Hague Rules는 선하증권에 대한 약간의 통일에 관한 국제조약이다. \n② Hague Rules는 각국의 해상물건운송법에 대한 특별법의 지위만을 가지고 있을 뿐이다. \n③ Hague Rules의 적용을 받는 해상물건운송계약은 선하증권 또는 이와 유사한 권리증권에 의해 증명된 운송계약에 한한다.\n④ Hague Rules는 단순히 선하증권만을 규정하는 통일법으로 그 지위를 갖는다. ","④","","","",""],["","다음에서 유통불능선하증권(Non-negotiable B/L)에 대한 설명으로 올바르지 않는 것은?","① 유통불능선하증권(Non-negotiable B/L)은 권리증권이라고 볼 수 없다. \n② 유통불능선하증권은 물건을 수령해야 할 사람이 특정인으로 되어 있는 기명식 선하증권(Straight B/L)을 말한다.\n③ 유통불능선하증권은 물건의 인도청구권을 표창하고 물건을 상징하고 있기 때문에 권리증권이라고 할 수 있다. \n④ 유통불능선하증권의 경우, 선박회사는 물건을 목적지에서 수화인 난에 기재된 특정인에 인도하는 의무를 부담하고 있으므로 선하증권의 제시와는 관계가 없다. ","③","","","",""],["","다음에서 유통가능선하증권(Negotiable B/L)에 대한 설명으로 부적합한 것은? ","① 유통가능선하증권(Negotiable B/L)은 선하증권의 수화인 난에 To order of Mr. A, To bearer라고 기재되어 있는 경우이다. \n② 유통가능선하증권은 배서 또는 인도에 의하여 유통되므로 운송인은 증권의 제시없이도 인도할 수 있다.\n③ 유통가능선하증권의 경우 운송인은 증권의 회수가 없으면 물건을 인도할 수 없으므로 증권의 소지인은 물건들을 완전하게 점유할 수 있다.\n④ 유통가능선하증권은 물건의 상징이고 완전한 권리증권이다.","②","","","",""],["","다음 중 만약 본선이 도착하였음에도 불구하고 선하증권이 도착하지 아니한 경우의 해결책으로 가장 좋은 방법은?","① 우선, 본선이 그 항에서 서류가 도착하는 것을 기다리는 방법이 있을 수 있다. \n② 선박회사가 선박의 체선을 피하기 위하여 화물을 하역 또는 양륙하여 창고에 보관하는 방법이 있을 수 있다. \n③ 현재 실무적으로 광범위하게 사용되고 있는 것이 화물의 L/G(Letter of Guarantee; 수입화물선취보증서) 인도를 통해 문제를 해결 할 수 있다. \n④ 물품의 인도를 신속히 하고 서류의 분실에 따른 제반위험을 회피하고자 하는 목적으로 비유통성 해상화물운송장(Non-Negotiable Sea Waybill)을 사용할 수 있다.  ","④","","","",""],["","다음 중 선하증권이 인도에 의해 유통되는 경우에 관한 설멍으로 바람직하지 않은 것은?","① 선하증권은 지참인식으로 발행되어 지참인식의 배서를 한경우에는 인도만으로 유통한다. \n② 선하증권이 특정인의 지시식으로 발행되어 그 자가 백지백서애 배서한 경우에는 인도만으로 유통한다. \n③ 선하증권은 지참인식으로 발행되기 때문에 언제든지 인도만으로 유통할 수 있다. \n④ 선하증권은 분실할 경우 위험이 있기 때문에 실제로 지참인식으로 발행되는 경우는 거의 없으므로 배서를 해야만 인도 유통이 가능하다. ","③","","","",""],["","다음에서 배서에 대한 설명으로 부적당한 것은?","① 지시식의 어음, 수표 또는 지시금지가 없는 기명식의 어음, 수표 등 유가증권을 제3자에게 양도하는 방법을 말한다.\n② 소지인식은 피배서인을 지정하지 아니하고 단순히 소지인에게 인도하라는 취지의 인도문언과 함께 배서인이 서명하는 방법이다. \n③ 양도방법이 배서에 의하도록 결정되어 있는 경우 배서 이외의 방법으로 양도할 수 있다. \n④ 신용장에서 요구되고 있는 환어음, 운송증권 등은 전형적인 증권적 채권이므로 배서에 의하여 제3자에게 자유로이 양도될 수 있다. ","③","","","",""],["","다음에서 연지급신용장과 같은 효과를 지닌 신용장은?","① 매입신용장(negotiation credit)     ② 인수신용장(acceptance credit)   \n③ 지급신용장(payment credit)       ④ 확인신용장(confirmed credit)","②","","","",""],["","다음에서 Siberian Land Bridge(SLB)에 의한 국제복합운송경로의 운송구가별 적용법규가 알맞게 연결된 것은?","① 해상운송기간: 사회주의 연락운수 규칙 \n② 소련 국경에서 유럽국경까지의 철도운송구간: 도로에 의한 국제물품운송에 관한 국제조약\n③ 유럽 및 소련 내륙 도로운송구간: 도로에 의한 물품 운송에 관한 국제조약\n④ Vostochny에서 소련 국경까지의 철도운송구간: Hague Rules  ","③","","","",""],["","다음은 해상화물운송장의 단점을 설명한 것으로 적당하지 않은 것은?","① 자유로이 수화인을 변결할 수 있으므로 화환어음을 매도하기 위해서는 은행을 수화인으로 해야 한다. \n② 해상화물운송장의 제출 없이도 물품을 인도 받을 수 있기 때문에 L/G인도에 따른 문제로 화물인도를 신속히 할 수 있다.\n③ 해상화물운송장은 권리증권이 아니기 때문에 항해 중에 증권을 이전함으로써 물품을 전매하는 것이 불가능하다. \n④ 해상화물운송장은 담보력이 없다.","②","","","",""],["","다음에서 선하증권에서 운송물의 동일성을 표시하는 사항을 기입할 필요에 대한 설명으로 적당한 것은?","① 해상화물 운송에 있어서 화물의 적재를 손쉽게 할 수 있기위해서 이다. \n② 선하증권은 원래 본선의 선장이 발행하는 해상운송물의 수취증과 같은 역할을 하기 때문이다. \n③ 화물의 대금을 정확하게 지불 받기위해서이다. \n④ 화물의 최종 목적지에서 확인은행의 대리인에게 대금의 지불수단으로 사용하기 위해서이다. ","②","","","",""],["","다음 선하증권의 송화인에 대한 설명으로 올바르지 않은 것은?","① 선하증권에 기재될 모든 사항을 정확하게 운송인에게 신고하여야 하고 부정확한 사항으로 인한 손실 및 비용에 대하여 책임을 져야 한다. \n② 운송인이 서명한 선하증권(bill of lading)을 취득할 권리를 가진 자이다.\n③ 선하증권 발행자인 운송인은 권리 양도증서가 없어도 선하증권상에 기재된 송화인이 아닌 자에게 선하증권을 교부할 수 있다.\n④ 위험물의 등급에 적합한 용기에 포장하고 위험물임을 표시하는 mark 및 label을 부착할 의무가 있다","③","","","",""],["","다음에서 복합운송증권에 대한 개념을 잘못 설명하고 있는 것은?","① 복합운송에 대해 복합운송인이 발행한는 증권이다.\n② 발행자인 운송인이 운송품의 수령을 증명하고, 운송계약의 증거가 되는 권리증권의 성격이다. \n③ 복합운송증권은 선하증궘과 똑같이 유통증권으로서의 기능을 갖고 있다. \n④ 복합운송증권은 선하증권과 달리 유가증권의 성격을 갖고 있지 않다. ","④","","","",""],["","화물의 선적시 및 양화시에 편리하게 이용하는 것으로, 화물의 적재상태를 기입한 것은?","① 적화척도       ② 화물 적재도         ③ 적화용적도      ④ 배수량등곡선도","②","","","",""],["","적화계획 작성 시 화물의 적재 상태를 표시하기 위한 중요한 자료
