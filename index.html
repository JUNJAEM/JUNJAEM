<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>찍으면 정답</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root {
    --paper: #FAF6ED;
    --paper-alt: #F1EAD9;
    --paper-card: #FFFFFF;
    --ink: #2A2620;
    --ink-soft: #7A7261;
    --line: #E3D9C2;
    --accent: #E15B3F;
    --accent-ink: #FFFFFF;
    --highlight: #FFD86B;
    --highlight-ink: #2A2620;
    --good: #2F7A4E;
    --good-bg: #E6F3EA;
    --warn: #A56A12;
    --warn-bg: #FBEEDA;
    --shadow: rgba(42, 38, 32, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1C1A16;
      --paper-alt: #24211B;
      --paper-card: #2B2822;
      --ink: #F1ECDF;
      --ink-soft: #ABA189;
      --line: #3B372C;
      --accent: #FF7A5C;
      --accent-ink: #1C1A16;
      --highlight: #7A5B12;
      --highlight-ink: #FFEFC7;
      --good: #6FCB93;
      --good-bg: #21362A;
      --warn: #E3AC49;
      --warn-bg: #3A2E15;
      --shadow: rgba(0, 0, 0, 0.45);
    }
  }
  :root[data-theme="dark"] {
    --paper: #1C1A16;
    --paper-alt: #24211B;
    --paper-card: #2B2822;
    --ink: #F1ECDF;
    --ink-soft: #ABA189;
    --line: #3B372C;
    --accent: #FF7A5C;
    --accent-ink: #1C1A16;
    --highlight: #7A5B12;
    --highlight-ink: #FFEFC7;
    --good: #6FCB93;
    --good-bg: #21362A;
    --warn: #E3AC49;
    --warn-bg: #3A2E15;
    --shadow: rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }
  html { background: #FAF6ED; }
  @media (prefers-color-scheme: dark) { html { background: #1C1A16; } }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    padding-inline: 16px;
    padding-block: 20px 40px;
    margin: 0;
  }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  p { margin: 0; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  #app { max-width: 480px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }

  /* ---------- topbar ---------- */
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 2px;
  }
  .brand { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .brand-mark {
    width: 32px; height: 32px; border-radius: 9px;
    background: var(--accent); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .brand-mark svg { width: 18px; height: 18px; }
  .brand-word {
    font-family: 'Gaegu', 'Noto Sans KR', sans-serif;
    font-weight: 700; font-size: 1.35rem; line-height: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .status-pill {
    font-size: 0.72rem; font-weight: 500; color: var(--ink-soft);
    background: var(--paper-alt); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 11px; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--paper-card); color: var(--ink-soft);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn:hover { color: var(--ink); border-color: var(--ink-soft); }

  main { display: flex; flex-direction: column; gap: 16px; }

  /* ---------- shared controls ---------- */
  .btn-block { width: 100%; }
  .btn-primary, .btn-secondary, .btn-ghost {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    border-radius: 14px; padding: 14px 18px; font-weight: 700; font-size: 0.95rem;
    border: 1px solid transparent;
  }
  .btn-primary svg, .btn-secondary svg, .btn-ghost svg { width: 18px; height: 18px; flex-shrink: 0; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 16px -8px var(--shadow); }
  .btn-primary:disabled { opacity: 0.55; }
  .btn-secondary { background: var(--paper-card); color: var(--ink); border-color: var(--line); }
  .btn-ghost { background: transparent; color: var(--ink-soft); font-weight: 500; padding: 10px; }
  .btn-capture {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    background: var(--accent); color: var(--accent-ink);
    border: none; border-radius: 999px; padding: 16px 20px;
    font-weight: 700; font-size: 1rem; box-shadow: 0 10px 22px -10px var(--shadow);
  }
  .btn-capture svg { width: 19px; height: 19px; }
  .btn-capture:disabled { opacity: 0.5; }
  .file-btn { position: relative; }
  .hint-text { font-size: 0.8rem; color: var(--ink-soft); text-align: center; }
  .error-text { font-size: 0.82rem; color: var(--warn); text-align: center; }
  .notice-card {
    background: var(--warn-bg); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; font-size: 0.8rem; color: var(--warn); line-height: 1.5;
  }

  /* ---------- loading ---------- */
  .loading { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 60px 0; color: var(--ink-soft); }

  .spinner {
    width: 26px; height: 26px; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- upload ---------- */
  .upload-hero { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 12px 6px 4px; }
  .card-stack { position: relative; width: 92px; height: 64px; margin-bottom: 6px; }
  .card-stack span {
    position: absolute; inset: 0; border-radius: 10px;
    background: var(--paper-card); border: 1px solid var(--line);
    box-shadow: 0 4px 10px -6px var(--shadow);
  }
  .card-stack span:nth-child(1) { transform: rotate(-8deg) translateX(-6px); }
  .card-stack span:nth-child(2) { transform: rotate(4deg) translateX(4px); background: var(--paper-alt); }
  .card-stack span:nth-child(3) { transform: rotate(-2deg); background: var(--paper-card); }
  .card-stack span:nth-child(3)::after {
    content: ""; position: absolute; left: 14px; right: 14px; top: 18px; height: 3px;
    background: var(--highlight); border-radius: 2px;
  }
  .upload-hero h2 { font-family: 'Gaegu', sans-serif; font-size: 1.5rem; }
  .upload-hero p { color: var(--ink-soft); font-size: 0.9rem; line-height: 1.55; }

  /* ---------- upload preview ---------- */
  .draft-card { background: var(--paper-card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .draft-title { font-weight: 700; font-size: 0.95rem; }
  .field-row { display: flex; flex-direction: column; gap: 6px; }
  .field-row label { font-size: 0.78rem; font-weight: 500; color: var(--ink-soft); }
  select, .manual textarea, input[type="text"], input[type="password"], input[type="search"] {
    width: 100%; border: 1px solid var(--line); border-radius: 10px;
    background: var(--paper); color: var(--ink); padding: 10px 12px; font-size: 0.9rem;
  }
  .manual input[type="search"] { font-size: 1rem; padding: 13px 14px; border-radius: 12px; }
  .check-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--ink-soft); }
  .check-row input { width: 16px; height: 16px; accent-color: var(--accent); }
  .preview-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  table.preview { border-collapse: collapse; font-size: 0.78rem; white-space: nowrap; }
  table.preview th, table.preview td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; }
  table.preview th { color: var(--ink-soft); font-weight: 500; background: var(--paper-alt); position: sticky; top: 0; }
  table.preview td.col-q, table.preview th.col-q { box-shadow: inset 0 -2px 0 var(--accent); }
  table.preview td.col-a, table.preview th.col-a { box-shadow: inset 0 -2px 0 var(--highlight); }
  .row-count { font-size: 0.8rem; color: var(--ink-soft); }

  /* ---------- scan / viewfinder ---------- */
  .scan { display: flex; flex-direction: column; gap: 14px; }
  .viewfinder {
    position: relative; width: 100%; aspect-ratio: 3 / 4;
    background: var(--ink); border-radius: 20px; overflow: hidden;
    box-shadow: 0 14px 30px -16px var(--shadow);
  }
  .viewfinder video, .viewfinder canvas.freeze {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  }
  .viewfinder .placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #cfc7b4; }
  .corner { position: absolute; width: 26px; height: 26px; border: 3px solid var(--highlight); opacity: 0.9; }
  .corner.tl { top: 14px; left: 14px; border-right: none; border-bottom: none; border-radius: 6px 0 0 0; }
  .corner.tr { top: 14px; right: 14px; border-left: none; border-bottom: none; border-radius: 0 6px 0 0; }
  .corner.bl { bottom: 14px; left: 14px; border-right: none; border-top: none; border-radius: 0 0 0 6px; }
  .corner.br { bottom: 14px; right: 14px; border-left: none; border-top: none; border-radius: 0 0 6px 0; }
  .scan-busy {
    position: absolute; inset: 0; background: rgba(20, 18, 14, 0.55);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #fff;
  }
  .scan-busy .spinner { border-color: rgba(255,255,255,0.3); border-top-color: var(--highlight); }
  .scan-busy p { font-size: 0.85rem; }

  /* ---------- manual / result ---------- */
  .manual, .result, .settings { display: flex; flex-direction: column; gap: 14px; }
  .section-title { font-family: 'Gaegu', sans-serif; font-size: 1.3rem; }
  .manual textarea { resize: vertical; min-height: 88px; }

  .recognized-row { display: flex; flex-direction: column; gap: 6px; }
  .recognized-row .label { font-size: 0.78rem; color: var(--ink-soft); font-weight: 500; }
  .recognized-edit { display: flex; gap: 8px; align-items: center; }
  .recognized-edit input { flex: 1; }

  .answer-card {
    background: var(--paper-card); border: 1px solid var(--line); border-radius: 18px;
    padding: 18px; display: flex; flex-direction: column; gap: 10px;
    box-shadow: 0 10px 24px -16px var(--shadow);
  }
  .confidence-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .confidence-pill { font-size: 0.72rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
  .confidence-pill.good { background: var(--good-bg); color: var(--good); }
  .confidence-pill.warn { background: var(--warn-bg); color: var(--warn); }
  .sheet-tag { font-size: 0.72rem; color: var(--ink-soft); }
  .answer-q { font-size: 0.85rem; color: var(--ink-soft); line-height: 1.5; }
  .answer-a {
    font-size: 1.15rem; font-weight: 700; line-height: 1.5;
    background: linear-gradient(to bottom, transparent 58%, var(--highlight) 58%);
    display: inline; color: var(--highlight-ink);
  }
  .answer-a-wrap { color: var(--ink); }

  .alt-list { display: flex; flex-direction: column; gap: 8px; }
  .hit-list { display: flex; flex-direction: column; gap: 10px; }
  .hit-card {
    background: var(--paper-card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; display: flex; flex-direction: column; gap: 8px;
  }
  .hit-card .answer-a { font-size: 1rem; }
  .alt-card {
    background: var(--paper-alt); border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 13px; font-size: 0.82rem; display: flex; flex-direction: column; gap: 3px;
  }
  .alt-card .alt-q { color: var(--ink-soft); }
  .alt-card .alt-a { font-weight: 700; }
  .empty-card {
    background: var(--paper-alt); border: 1px dashed var(--line); border-radius: 16px;
    padding: 26px 18px; text-align: center; color: var(--ink-soft); font-size: 0.88rem;
  }

  /* ---------- settings ---------- */
  .info-card { background: var(--paper-card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 16px; }
  .info-row { display: flex; justify-content: space-between; gap: 10px; padding: 12px 0; font-size: 0.86rem; border-bottom: 1px solid var(--line); }
  .info-row:last-child { border-bottom: none; }
  .info-row span { color: var(--ink-soft); }
  .info-row strong { font-weight: 700; text-align: right; }
</style>
</head>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="21" y1="21" x2="15.5" y2="15.5"/></svg>
      </span>
      <span class="brand-word">찍으면 정답</span>
    </div>
    <span class="status-pill" id="statusPill">불러오는 중</span>
    <button class="icon-btn" id="settingsBtn" aria-label="설정" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.97 7.97 0 0 0 0-2l2-1.6-2-3.4-2.4 1a8 8 0 0 0-1.7-1L15 3h-4l-.3 2.4a8 8 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.97 7.97 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a8 8 0 0 0 1.7 1L11 21h4l.3-2.4a8 8 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6Z"/></svg>
    </button>
  </header>
  <main id="main"></main>
</div>

modes of transport)의 이용","","④"],["255","","화물변동비 중 화물 수입 및 화물량의 크기에 따라 발생하는 비용은 다음 중 어느 것인가?","① 하역비          ② 화물비\n③ 장비비          ④ 대리점비","","④"],["363","","다음 중 선하증권 법정기재사항에서 포장의 종류및 개수에 대한 설명으로 관계가 없는 것은?","① 송화인의 운송물이 손상·멸실되거나 과부족 등이 발생할 때에 운송인에게 손해배상을 청구하는데 선하증권에 기재된 운송물의 개수가 산정기준이 된다.\n② Hague Rules는 송화인이 당해 화물의 가격을 신고하고, 선하증권에 기재한 경우에는 그 화물이 손상 또는 멸실하였을 때 그 신고가격이 운송인의 손해배상 한도액이다. \n③ 선하증권에 container내에 적입된 물건의 포장단위가 기재되지 않고 container단위만 기재되어 있는 경우 각 container가 포장(package)의 단위로 간주된다. \n④ 선하증권에 container에 적입된 포장의 개수가 기재되어 있는 경우 container내에 적입된 포장의 개수는 일괄적으로 전체를 하나의 포장의 수로 취급된다. ","","④"],["306","","다음 한국, 대만, 홍콩, 호주지역은 NVOCC의 어느 국가가 총대리점으로 TRS 서비스를 맡고 있는가?","① 러시아  ② 영국     ③ 프랑스      ④ 독일","","④"],["246","","다음에서 해상기업으로 적용되지 않는 것은?","① 해상예선업      ② 해난구조업        ③ 해상보험업      ④ 준설업","","③"],["39","","다음 중 선하증권의 문언적 효력의 인정사유로서 타당하지 않은 것은?","① 영미의 금반언의 법리에서 유래되었다.                                                       ② 선하증권의 유통성을 보호하기 위함이다. \n③ 선박소유자를 우선적으로 보호하기 위함이다.                                                  ④ 선의의 선하증권 취득자를 보호하기 위함이다. ","","③"],["201","","우리나라 ICD에 대한 설명 중 적합한 사실이 아닌 것은? ","① ICD는 LCL화물의 ghswo, 분류 등을 수행하는 CFS가 갖춰져 있다. \n② ICD는 토지이용, 운송효율성, 교통혼잡완화 등 경제적 효과가 크다. \n③ ICD는 항만기능 중 검역기능을 수행하지 않는다. \n④ ICD는 항만과 떨어진 산업단지 등 인근에 주로 위치한다. ","","③"],["31","선박운용등","다음 중 여객이나 화물의 운송을 할 수 있는 선박 안의 장소의 크기를 나타내는 톤수는 어느 것인가?","① 총톤수      ② 배수톤수      ③ 순톤수      ④ 재화용적톤수","","②"],["32","","다음 중 선박의 배수량을 적절하게 표시한 것은?","① 수면하의 용적 x 물의 비중    ② 수면하의 중량 x 물의 비중\n③ 수면상의 용적 x 물의 비중    ④ 수면상의 중량 x 물의 비중","","①"],["45","","다음 중 체크밸브(check valve)에 관한 것으로 가장 적합한 것은?","① 황천 시 작동시키는 조타기의 밸브이다. \n② 배수관의 도중에 설치하여 해수의 역류를 방지하는 밸브이다. \n③ 황천 시 스크류의 공전을 막기 위한 밸브이다. \n④ 보일러의 증기를 개폐하는 밸브이다. ","","②"],["45","","다음 중 체크밸브(check valve)에 관한 것으로 가장 적합한 것은?","① 황천 시 작동시키는 조타기의 밸브이다. \n② 배수관의 도중에 설치하여 해수의 역류를 방지하는 밸브이다. \n③ 황천 시 스크류의 공전을 막기 위한 밸브이다. \n④ 보일러의 증기를 개폐하는 밸브이다. ","","②"],["17","","선급검사 중 기기계속검사(CMS)는 어느 주기마다 검사를 실시하는가?","① 정기 검사일로 부터 12개월 이후   ② 정기검사일로 부터 30개월 경과\n③ 매 5년 마다                     ④ 정기검사 interval중 매년마다 1/5씩 검사","","④"],["57","해운경영등","다음 중 해상보험계약에서 고지불필요사항이 아닌 것은?","① 3년의 기간보험계약에서 2년으로 단축될 수 있는 경우\n② 보험증권상 명시된 항구에서의 적재방식\n③ 보험계약의 인수여부 또는 계약내용에 결정을 줄 수 있는 내용\n④ 도착항에서의 하역방식","","③"],["48","","우리나라 상법에서 해상보험의 계약에 관해서 어떻게 정의하고 있는가?","① 보험자가 피보험자에 대하여 그 계약에 의하여 합의된 방법과 범위내에서 해상손해 즉 해상사업에 부수되는 손해를 보상할 것을 인수하는 계약이다.\n② 해상사업에 관한 사고로 인하여 생길 손해를 보상할 것을 목적으로 하는 보험이다. \n③ 보험자에게 전가된 피보험자 손실의 결합체이다.\n④ 일정한 기간을 표준으로 하는 보험이며 주로 선박보험에 이용된다.","","②"],["55","","다음 보험서류중 포괄예정보험에서 발급 받는 것은?","① 보험증권    ② 보험확인서  ③ 보험대위서    ④ 보험인수증","","②"],["66","","다음 중 해양사고의 조사 및 심판에 관한 법률에서 징계사유가 있는 날로부터 얼마를 경과하면 심판할 수 없는가?","① 1년        ② 3년      ③ 5년        ④ 7년","","②"],["78","","다음 중 해난심판법상의 해난으로 정의될 수 없는 경우는?","① 타선박의 표류를 인지\n② 선박의 안전 또는 운항 저해 \n③ 선박구조설비 또는 운용에 관련된 사람의 사상\n④ 선박이 멸실되거나 선박운용에 관련하여 시설의 손상","","①"],["","","","","",""]]},{"name":"정기선과 부정기선","rows":[["海運實務 試驗問題 (정기선과 부정기선)","","","","","","","",""],["","","","","","","","",""],["번호","문제","보기","정답","","","","",""],["1","컨테이너 운송의 장점으로 적당하지 않은 것은?","① 컨테이너를 이용함으로써 운송비, 포장비, 보험료 등을 절감할 수 있다. \n② 컨테이너 운송은 신속하다. \n③ 컨테이너 운송은 안전하다. \n④ 컨테이너 운송은 하역시간과 정박시간이 길다. ","④","","","","",""],["2","부정기선 경영의 특성으로 맞지 않는 것은?","① 화물의 가치가 중량이나 용적에 비하여 상대적으로 적다. \n② 화물이 대량이며, 수송단위가 크다.\n③ 화물을 한번 싣게 되면 거의 만선이 된다. \n④ 항로에 제한을 받으며, 운임이 유리한 화물을 선택할 수 있다.","④","","","","",""],["3","부정기선 선박운항의 특징으로 맞지 않는 것은?","① 항로 배선시 다음 항해가 가급적 공선항해가 되도록 한다.\n② 화물의 출하 시기, 해상 물동량의 증감 등에 관한 정보를 수집․판단한다.\n③ 육상 설비에 많은 투자를 할 필요가 없다.\n④ 부정기선 운임 시장은 선복의 수급에 따라 운임률이 급격하게 변동한다.","①","","","","",""],["4","해운은 실시해 온 대다수 국가에서 정기선 해운에 역점을 두는 의의로 맞지 않는 것은?","① 자국의 정기선 항로를 개설하고 적정 선박량을 유지함으로써 자국 화주에게 안정적인 운임으로 정기적인 해운 서비스를 제공한다.\n② 정기적인 배선에 의해 수출입 화물을 적기에 수송함으로써 교역상의 편의를 제공한다.\n③ 지속적으로 수송항로를 유지함으로써 당사국간의 교역 촉진과 경제 발전에 기여한다.\n④ 농산물, 광산물 등 break-bulk cargo를 전문적으로 운송하여 지역경제 발전에 기여한다.","④","","","","",""],["5","정기선 해운의 서비스에 대한 설명으로 적합하지 않는 것은?","① 정기선 운항선박은 선박의 가격이 부정기선 운항선박에 비해 저렴하다. \n② 정기선의 운송화물은 완제품 또는 반제품 등의 공산품이 주종이다.\n③ 정기선의 송장가격은 부정기선에 비해 비싸다. \n④ 정기선 화물의 운임은 부정기선 화물에 비해 높은 편이다. ","①","","","","",""],["6","정기선 해운이 취급하는 일반화물의 종류가 아닌 것은?","① 정량화물   ② 고가화물    ③ 단위화물   ④ 액체화물","②","","","","",""],["7","정기선의 일반화물 중에서 조잡화물(rough cargo)의 종류가 아닌 것은?","① 더러운 화물(dirty cargo)       ② 먼지나는 화물(dusty cargo)\n③ 부식성 화물(corrosive cargo)   ④ 냄새나는 화물(smelled cargo)","③","","","","",""],["8","화물 또는 포장된 화물을 적입하여 운반하는 용기를 일컬는 말은 다음 중 어느 것인가?","① 팔레트(pallet)      ② 컨테이너(container)\n③ 패키지(package)    ④ 박스(box)","②","","","","",""],["9","컨테이너의 성질을 설명한 것 중 적절하지 않은 것은?","① 항구적인 성질                                                                     ② 반복사용이 가능할 정도의 견고성\n③ 화물의 적입 및 적출이 용이하게 설계                                           ④ 1m³(35.3ft³) 이하의 내용 적을 구비","④","","","","",""],["10","선사가 리스회사 소유의 컨테이너를 사용할 경우 그 이점을 기술한 것 중 적절하지 않은 것은? ","① 자금고정화의 확대           ② 감가상각 불필요\n③ 노후화된 장비의 위험 방지   ④ 유지관리비 절감","①","","","","",""],["11","컨테이너를 통상 3년에서 5년간의 사용을 목적으로 리스하는 것을 무엇이라고 하는가?","① 단기 리스(shor-term lease)        ② 편도 리스(one-way lease)\n③ 장기 리스(long-term lease)        ④ 왕복 리스(two-way lease)","③","","","","",""],["12","컨테이너에 사용되는 재질이 아닌 것은?","① 철재(steel)        ② 알루미늄(aluminium)\n③ 플라스틱(plastics)  ④ 특수 플라스틱(fiberglass plastics)","③","","","","",""],["13","알루미늄으로 제작한 컨테이너의 장점은?","① 수리 용이           ② 외부 충격에 강함\n③ 외양이 좋음         ④ 가격 저렴","③","","","","",""],["14","컨테이너를 용도에 의한 분류에 타당하지 않은 것은?","① 일반화물 컨테이너  ② 온도조절 컨테이너 \n③ 특수컨테이너       ④ 특수플라스틱 컨테이너 ","④","","","","",""],["15","특수컨테이너 중 음료, 주류, 액체류, 화확제품을 운송하는데 사용되는 컨테이너는?","① 탱크 컨테이너(Tank container)                                                               ② 벌크 컨테이너(Bulk container)\n③ 사이드 오픈 컨테이너(Side open container)                                       ④ 플랫폼 컨테이너(Plaftform container)","①","","","","",""],["16","정기선 항로에 운항중인 선박으로 1960년대 부터 일반잡화, 액체화물, 냉동화물을 적재할 수 있도록 된 선박은?","① 표준 다목적선(Standard multi-purpose cargo liner)\n② 재래 정기선(Traditional multi-deck cargo liner)\n③ 신형 다목적선(Sophisticated multipurpose cargo liner)\n④ 컨테이너 전용선(Full container ships)","②","","","","",""],["17","정기선 항로에 운항중인 선박으로 주로 컨테이너, 자동차, 벌크화물 등을 운송하늠 선박은?","① 표준 다목적선(Standard multi-purpose cargo liner)\n② 재래 정기선(Traditional multi-deck cargo liner)\n③ 신형 다목적선(Sophisticated multipurpose cargo liner)\n④ 컨테이너 전용선(Full container ships)","③","","","","",""],["18","컨테이너 전용 터미널을 갖추지 않은 항로인 아프리카, 중남미, 동남아 할로 등에서 주로 운항되는 선박은?","① 표준 다목적선(Standard multi-purpose cargo liner)\n② 재래 정기선(Traditional multi-deck cargo liner)\n③ 신형 다목적선(Sophisticated multipurpose cargo liner)\n④ 컨테이너 전용선(Full container ships)","①","","","","",""],["19","신형다목적선(Sophisticated mutipurpose cargo liner)의 특징을 서술한 것 중 잘못 기술한 것은?","① 40,000~50,000 WT 급 선박 \n② 주로 컨테이너, 자동차, 벌크화물 등을 운송\n③ 선박 건조가격이 매우 저렴\n④ 지브 크레인(jib crane), 갠트리 크레인(gantry crane) 등의 하역장비 장착","③","","","","",""],["20","선박 내에 4~5개의 선창을 갖추고 각 선창은 중갑판으로 구조된 선박으로 1970년대 초부터 많이 건조된 선박은?","① 표준 다목적선(Standard multi-purpose cargo liner)\n② 재래 정기선(Traditional multi-deck cargo liner)\n③ 신형 다목적선(Sophisticated multipurpose cargo liner)\n④ 컨테이너 전용선(Full container ships)","①","","","","",""],["21","선창 내에 컨테이너만을 적재하기 위해 받침대(cell guides)를 부착한 선박은?","① 표준 다목적선(Standard multi-purpose cargo liner)\n② 재래 정기선(Traditional multi-deck cargo liner)\n③ 신형 다목적선(Sophisticated multipurpose cargo liner)\n④ 컨테이너 전용선(Full container ships)","④","","","","",""],["22","다음 중 로로(Ro-Ro)선의 특징을 설명한 것 중 해당되지 않는 것은?","① 자동차나 트레일러, 트랙터 등의 바퀴 달린 화물을 취급\n② 화물의 적양하 시 너무 많은 노동과 시간이 소요\n③ 화물의 적양하 작업을 위해 램프(ramp)시설을 구비\n④ 선내는 여러 개의 갑판(multi-deck)의 구조","②","","","","",""],["23","규격 화물(unitized cargo)의 운송수단으로 개발된 해상 운송 수단 중의 하나로 항만내, 내 수로(內 水路) 또는 호수 등에서 화물을 운송하는 선박은?","① 로로(Ro-Ro)선             ② 냉동 컨테이너 선\n③ 바지(Barge)선              ④ 컨테이너 전용선(Full container ships)","③","","","","",""],["24","다음 중 바지(Barge)선의 특징을 설명한 것 중 해당되지 않는 것은?","① 항만내, 내 수로(內 水路) 또는 호수 등에서 화물을 운송하는데 주로 이용\n② 종류로는 Oil/Water/Pushing/Towing Barge선\n③ 대형 바지선을 실을 수 있는 LASH(Lighter aboard ship)의 수송방식\n④ 원동력 장치의 화물을 취급","④","","","","",""],["25","개별선사가 단독으로 필요한 선단을 구성하고 운항 스케줄, 기항지, 영업정책 등을 독자적으로 결정, 실시하는 정기선 운항방식은?","① 컨소시움(Consortium)                   ② 단동운항(Independent operation)\n③ 공동운항(Joint service)                  ④ 스페이스 차터(Space charter)","②","","","","",""],["26","세계 최초의 해운 컨소시움은 영국에서 결성된 ACT(Associated Container Transportaion, Ltd.)로 몇년도에 결성되었는가?","① 1964년   ② 1971년   ③ 1966년   ④ 1984년","③","","","","",""],["27","해운 컨소시움의 특성을 설명한 것 중 타당하지 않은 것은?","① 선박의 공동 스케줄 작성             ② 스페이스의 상호교환\n③ 컨테이너 터미널의 공동사용          ④ 운임 결정권 행사","④","","","","",""],["28","두개 이상의 선사가 선박을 합작기업(joint venture)형태로 운항하기 위한것을 의미하는 것은?","① 컨소시움(Consortium)                 ② 단동운항(Independent operation)\n③ 공동운항(Joint service)                ④ 스페이스 차터(Space charter)","③","","","","",""],["29","공동운항(joint service)의 특성으로 잘못 설명되어 진 것은?","① 공동운항 선사들은 각자의 업체(entity)명을 가지고 독자적으로 운임 결정권 행사\n② 자신의 명의로 해운동맹에 가입하여 공동 태리프(common tariff)를 이용가능\n③ 자신의 명의로 선하증권(B/L)을 발행 가능\n④ 자신의 임의대로 운항 스케줄을 작성 활용","④","","","","",""],["30","북반구에 위치한 선진국과 개도국간에 주로 개설된 동서 항로가 아닌 것은?","① 아시아 ~ 북미 항로         ② 아시아 ~ 북유럽 항로\n③ 아시아 ~ 아프리카 항로     ④ 아시아 ~ 지중해 항로","③","","","","",""],["31","해운동맹의 장점을 기술 한 것과 거리 가 먼 것은?","① 정기운항의 유지로 무역 거래의 편리\n② 운임안정을 통한 생산 및 판매계획 수립 용이\n③ 동맹가입을 통한 영세선사의 구제\n④ 동맹의 독점성에 따른 초과 이윤의 획득","④","","","","",""],["32","해운동맹의 목적으로 타당하지 않은 것은?","① 운임협정                         ② 기항지와 배선 수의 협정\n③ 맹외선(盟外船)의 활동을 장려       ④ 적취비율 및 운임 pool제 등의 협정","③","","","","",""],["33","해운동맹을 운영에 있어서 신규가입과 탈퇴를 극단으로 제한하는 동맹을 무엇이라고 하는가?","① 개방동맹    ② 폐쇄동맹          ③ 관세동맹    ④ 통화동맹","②","","","","",""],["34","해운동맹의 대내적 억제수단으로 거리가 먼 것은?","① 운임협정(Rate agreement)    ② 배선 협정(Sailing agreement)\n③ 풀협정(Pooling agreement)    ④ 통화스왑협정(Currency swap agreement)","④","","","","",""],["35","계약 운임제(Contract rate system)의 특징을 서술한 것 중 거리가 먼 것은?","① 이중 운임제(Dual rate system)\n② 동맹선사의 선박만을 이용한다는 충실의무계약(Loyalty contract)\n③ 운임가치 할인제와 달리 유보기간 없이 일정기간 경과 후에 환불금을 전액 지급\n④ 동맹에 가입한 화주에게는 낮은 운임(약 9.5%)를 적용","③","","","","",""],["36","북미수출운임협정(ANERA: Asia North America Eastbound Rate Agreement)에 대하여 서술한 것 중 거리가 먼 것은?","① 1985년 8월 15일날 결성\n② 미국선사의 제안으로 극동 및 동남아 지역의 FOB화물에 대해 포괄적인 계약 체결\n③ 선사의 채산성 악화 우려로 항로 안정화 목적\n④ 회원사의 이익증진 및 항로 안정화 목적","③","","","","",""],["37","한국근해수송협의회(KNFC)의 성립배경과 거리가 먼 것은?","① 안정적인 선복량 공급을 통한 수출입화물의 수송을 원활\n② 엔고에 따른 물동량 감소\n③ 적정한 운임율을 통한 한일항로의 질서 유지\n④ 한일간의 교역을 촉진","②","","","","",""],["38","정기선동맹의 행동규범에 관한 UN협약(UNCTAD Liner Code)의 주요 목적을 기술한 것 중 거리가 먼 것은?","① 세계해상물동량의 원활한 수송 촉진\n② 정기선 서비스 공급자와 사용자의 공평한 이익 보장\n③ 세계 교역요건에 부응하는 효율적인 정기선서비스의 개발 장려\n④ 운임동맹 관행의 선화주 대외 교역에 대한 차별화 ","④","","","","",""],["39","정기선동맹의 행동규범에 관한 UN협약(UNCTAD Liner Code) 발효상의 문제점이 아닌 것은?","① 본 협약의 적용화물은 운임동맹 적취 정기선화물에 국한\n② 본 협약의 보호주의적 성격\n③ 본 협약은 이해관계자들에게 운임동맹의 활동에 관한 정보 제공\n④ 본 협약에 서명한 EC국가들은 EC내 회원국간에는 화물공평적취규정을 미적용","③","","","","",""],["40","해운동맹의 일괄운임인상(GRI)인 경우에는 화주 및 화주단체에 몇일 전에 통보해야 하는가?","① 150일      ② 100일        ③ 50일       ④ 30일","①","","","","",""],["41","정기선 회사에서 어느 항로에 어떤 선박을 투입할 것인가의 결정요인으로 적합하지 않은 것은?","① 적양가능(積揚可能, lifting power) 및 특수설비(냉동 창, deep tank, car dock 등)\n② 항로의 물동량과 화물의 종류에 따른 선복(ship space)\n③ 항로의 일반사정에 따른 일반설비요건\n④ 기항지의 수나 적하의 모양, 곤포(梱包)에 따른 해치(hatch)의 크기 및 Deck의 수","③","","","","",""],["42","정기선의 적선적항을 위한 가장 이상적인 배선(配船, vessel operation)조정으로 알맞은 것은?","① 장기적으로는 선박이 진부 되었거나 노후화된 경우에는 선박을 부정기선으로 배선\n② 단기적으로는 일정(time schedule)에 여유가 없더라도 필요한 용선료를 지출하더라도 배선\n③ 장기적으로 선복수급에 차이가 있는 항로는 그대로 유지하여 배선\n④ 계절에 따라 선복수급에 차이가 있는 항로를 조정하는 동시에 용선과 회사 보유 선박을 적절히 배치하고 여유 선박은 부정기선으로 배선","④","","","","",""],["43","정기선의 항해지시서에 구성되는 주요내용으로 거리가 먼 것은?","① 일정의 결정               ② 특수화물과 Base cargo                                      ③ 적하와 선복의 배정        ④ 일반잡화의 운임료","④","","","","",""],["44","정기선의 집화방법, 즉 화물 선정을 위한 구체적인 방법 중 타당하지 않은 것은?","① 선별 적재된 화물 상호간의 오손․손상을 피함\n② 본선의 선체구조 특징에 알 맞는 화물을 기항지 사정에 맞추어 일정이 유지될 수 있는 범위내의 수량으로 조합 적재함\n③ 가장 안전하고 신속한 적양(積揚)이 가능케 함\n④ 적양비용이 최고가 되도록 적재함","④","","","","",""],["45","Booking의 기능 중에서 화주 또는 포워더로 부터 선적에 필요한 서류를 접수할 때 필요하지 않은 것은?","① S/R(Shipping request)     ② Original L/C\n③ Packing list             ④ Commercial invoice","②","","","","",""],["46","해상운송의 속력은 일반적으로 다른 운송 수단에 비해 늦은 편인데 정기선의 속력은?","① 12~18knot     ② 20~24knot\n③ 18~30knot     ④ 18~20knot","③","","","","",""],["47","우리나라의 한진해운과 조양상선을 비롯하여 12개국 16개 선사가 운송서비스를 제공하고 있는 항로는 다음 중 어느 항로인가?","① 극동/북미동안항로      ② 극동/북미서안항로\n③ 동남아항로            ④ 유럽항로","①","","","","",""],["48","정기선의 화물유형으로 적합하지 않은 것은?","① 이종화물                     ② 완제품, 반제품이 주대상화물\n③ 대량의 벌크화물이 주대상      ④ 고가품 화물이 주종","③","","","","",""],["49","부정기선의 화물유형으로 타당하지 않은 것은?","① 동종화물              ② 대량의 벌크화물이 주대상\n③ 저가품 화물이 주종    ④ 고가품 화물이 주종","④","","","","",""],["50","부정기선의 해상운임에 대하여 서술한 것으로 적합하지 않은 내용은?","① 별도의 운임률표가 없음  ② 선박의 수요와 공급에 의해 상당히 탄력적 결정\n③ 비교적 운임 저렴        ④ 운임률표(tariff) 보유","④","","","","",""],["51","정기선의 운송계약과 관계가 먼 것은?","① 용선계약을 통해 체결      ② 용선계약서(Charter party)작성\n③ 선하증권(B/L)을 통해 체결  ④ 기간용선계약을 통해 체결","③","","","","",""],["52","일정기간 동맹선에 선적한 화주에 대하여 운임의 일부를 되돌려 주는 제도는?","① 이중운임제(dual rate system)      ② 계약운임제(contract rate system)\n③ 일반운임률(base rate)            ④ 운임연환급제(deferred freight rebate system)","④","","","","",""],["53","부정기선의 개념을 정의한 것으로 거리가 먼 것은?","① 유조선, 광탄전용선, 살화물선 등과 같이 배 전체에 한 종류의 화물을 선적한다. \n② 항해 용선계약(Voyage Charter)하에 만선 운항하는 선박으로 대량화물운송에 전문화되어 있다. \n③ 화주가 선적 가능한 화물, 운항 가능한 항로, 그리고 적절한 운임만 제시한다면 선주는 선적항, 양하항의 위치와 관계없이 운송계약과 함께 운항하는 선박을 말한다. \n④ 부정기선은 one ship, one cargo의 운송형태로 선박이 운항된다. ","④","","","","",""],["54","다음 중 부정기 선의 유형으로 타당하지 않은 것은?","① 살물선(Bulk Carrier)              ② 유조선(Tanker)\n③ 자동차 운반선(Car Carrier)        ④ 컨테이너 전용선(Full container ships)","④","","","","",""],["55","부정기선시장에 대한 특성을 기술한 것으로 적절하지 못한 것은?","① 다수의 선주가 수 많은 화주의 화물을 운송하기 위해 경쟁하는 완전경쟁시장임\n② 소규모의 선주들이 많고 운임만 만족스럽다면 항로나 화물의 성질은 중요치 않음\n③ 수요와 공급의 원칙에 반해 수요의 증감에 따라 운임 등락의 변동성이 약함\n④ 운임은 화물, 화물량, 항로, 기항 항, 계절 등 여러 요소들을 고려하여 결정됨","③","","","","",""],["56","부정기선시장에서 용선중개인이 계약관계를 face-to-face로 거래를 하는 시장은 어디 인가?","① 영국 런던(Baltic Exchange)     ② 노르웨이 오슬로\n③ 일본 동경                    ④ 미국 뉴욕(New York Maritime Exchange) ","①","","","","",""],["57","부정기선 해운산업은 높은 리스크가 있으므로 많은 정보가 필요로 하는데 이에 해당사항이 먼 것은?","① 선박의 이용가능성(availability of ships)            ② 운임률\n③ 용선시장의 연속적인 변동(consequent fluctuations)  ④ 운항자의 개인 신용도","④","","","","",""],["58","부정기선시장에서 다양한 이해 관계를 지닌 관계자중 시장에서 주도적인 역할을 수행하는 당사자가 아닌 것은?","① 화주(Trader)                ② 운항자(oprator)\n③ 용선중개인(Broker)              ④ 보험대리인","④","","","","",""],["59","다음 중 부정기선 시장에서 화주의 역할로 적당한 것은?","① 선박을 직접 소유하지는 않으나 1년 내지 2년 장기로 용선하여 화물을 확보 및 운송을 하는 자\n② 화물을 직접 소유 혹은 구매하거나 중간 매매에 관계된 자\n③ 항해운송계약을 비롯한 각종 용선계약체결을 주도하는 자\n④ 선박의 건조와 해체를 포함하여 매각 및 매입을 하는 자","②","","","","",""],["60","용선중개인(Broker)의 기능을 설명한 것 중 거리가 먼 것은?","① 용선을 중개한다. \n② 선박의 투입과 거래 그리고 기타 해운관련 직업에 관계하는 등 다양한 기능을 수행한다.\n③ 용선계약체결 시 중간자로서 선주와 선주, 선주와 화주를 연계시키는 역할을 한다. \n④ 선사가 화물을 확보한 후, 시황의 변동 혹은 가용 선박의 미확보등을 사유로 계약을 다른 선사에게 되파는 (Cargo-Relet)의 역할을 한다. ","④","","","","",""],["61","용선중개인(Broker)의 기능 중에서 용선관련 재무관련 업무 수행을 행 하는데 이와 관계가 먼 것은?","① 용선계약서의 작성     ② 계약 후속조치와 변경사항 정리\n③ 화물을 직접 구매      ④ 운임/용선료 송금 및 수취","③","","","","",""],["62","다음 중 부정기선 해운시장의 특성을 간략하게 서술한 것 중 적절하지 못한 것은?","① 해운산업의 주체인 선주와 화주가 다양하다. \n② 운임 조정 및 통제력이 높다. \n③ 다른 산업에 비해 시장 진입 및 퇴출 장벽이 낮다. \n④ 제도적 장치를 이용하는 경우가 있다. ","②","","","","",""],["63","부정기선 해운산업의 운임시장에서 운임 조정 및 통제력이 적다라고 하는데 그 이유로 적당하지 않은 것은?","① 해운시작에서 지분이 매우 미비  ② 영세한 기업구조\n③ 상호간의 통합능력 부족         ④ Pool제도 도입으로 하나의 관리체제","④","","","","",""],["64","해운산업에서 부정기선 시장 진입 장벽이 낮다고 보는 이유로 적당하지 않은 것은?","① 신조 선박이나 중고 선박을 구입할 자금을 소유하거나 용선 할 수 만 있다면 부정기선을 운영할 수 있다. \n② 해운선사를 운영할 수 있는 전문지식이나 자본기반도 없어도 진입할 수 있다. \n③ 발달된 조직구조나 제도가 필요없다. \n④ 시장졍쟁원리의 지배를 받기 때문에 자율적으로 제한하는 장치가 없다. ","④","","","","",""],["65","다음 중 부정기선 시황의 변동요인으로 거리가 먼 것은?","① 전세계 해상물동량     ② 용선계약료\n③ 부정기선 선복수급     ④ 세계의 급작스러운 사건","②","","","","",""],["66","최근들어 부정기선의 선복을 탄력적으로 공급하고 있는 이류로 관계가 적절하지 못한 것은?","① 부정기선의 중소형화  ② 고가의 선박건조비\n③ 효율적인 운항 및 관리   ④ 선주들간의 경쟁력 제고","①","","","","",""],["67","부정기선 해운 시장의 수요에 영향을 끼치는 요소가 아닌 것은?","① 세계 경제동향(World Economy)     ② 해상물동량(Seaborne Commodity Trades)\n③ 평균 운항거리(Average Haul)       ④ 운항환경(Operating Environment)","④","","","","",""],["68","해상운송 수요에 대한 개별 상품무역의 중장기적 영향에 관한 설명중 적절하지 못한 것은?","① 특별한 물품에 대한 수요의 변화    ② 물품 공급원의 변화\n③ 운송수요의 계절적 변화            ④ 생산기술의 변화","③","","","","",""],["69","부정기선 시장의 공급에 영향을 끼치는 요소로 적당하지 않은 것은?","① 가용 선대량(Merchant fleet)   \n② 운송비용(Transport Cost)\n③ 해체율과 해손율(Scrapping and Losses)  \n④ 선대 생산성(Fleet Performance and Productivity)","②","","","","",""],["70","해운시장에서 미래의 수요를 예측하기 위해 선박 건조 시점은 언제가 유리하는 가?","① 해운시황의 불황기가 끝날 무렵        ② 해운시황의 불황기가 시작할 무렵\n③ 해운시황의 침체기가 시작될 무렵      ④ 해운시황의 호황기가 끝날 무렵","①","","","","",""],["71","해운 운임의 주기적인 변동은 무엇에 의해 발생하는 가?","① 신건조 인도와 선박의 노후화          ② 선박 해체율과 해손율\n③ 선복의 수요와 공급의 균형 및 불균형   ④ 현재의 수익률","③","","","","",""],["72","다음은 해운 운임의 변동에 관한 설명으로 적절하지 않은 것은?","① 단기적인 운임변동은 주로 국지적인 화물과 선박의 수급 불균형에 의해 발생\n② 계절적인 운임변동은 1년 중 특정 기간에 운임의 변동이 예상되는 경우로 주로 곡물 수확기를 중심으로 발생\n③ 주기적인 변동은 세계 경제 또는 경제 권역별 경제 성장 또는 생산율, 고용상태 등의 일반적인 환경에 의해 발생\n④ 주기적인 변동은 주로 그 변화 주기가 잛은 것이 특징으로 등락이 깊음","④","","","","",""],["73","부정기선 운임결정에 영향을 주는 요인으로 관계가 먼 것은?","① 경제성장과 교역량 ② 일시적인 수요 증감에 따른 선복의 과부족\n③ 신조선 발주추세   ④ 단기운송계약 추세","④","","","","",""],["74","컨테이너 운송의 단점이라고 할 수 없는 것은?","① 고가 선대, 터미널, 전산설비 등 자본비용\n② 소량화물의 경우 혼재가 필요\n③ 허브 앤 스포크 시스템에 따른 서비스 품질 저하\n④ 화물 마케팅을 위한 대규모 조직의 구성과 유지","③","","","","",""],["75","미국의 1998년 개정해운법(The Ocean Shipping Reform Act of 1998)에서 규정하고 있는 내용이 아닌 것은?","① 대항선 투입 금지    ② 회원선사와 화주간 비밀계약의 허용\n③ 태리프의 불신고     ④ 나도조항의 폐지","①","","","","",""],["76","정기선 서비스의 특성이 아닌 것은?","① 공중운송인               ② 동종화물운송\n③ 상대적으로 고가의 서비스  ④ 대규모 운영 조직","②","","","","",""],["77","다음은 부정기선의 운임에 대한 설명이다 맞지 않은 것은?","① 톤당운임, 선복운임, 일상요선계약운임 등이 있다. \n② 항로에 따라 상자당 운임률이 적용된다. \n③ 상항에 근거하여 탄력적으로 결정된다. \n④ 지적운임, 선물운임, 장기계약운임 등이 있다. ","②","","","","",""],["78","정기선(Liner) 해운의 특징이 아닌 것은?","① 계획적인 선박운영이다. \n② 나용선을 정기선이라 한다. \n③ 운임협정 및 운송약관을 적용한다. \n④ 정기운항 선박은 고성능 고단가이다. ","②","","","","",""],["79","컨테이너 운송에 있어서 화주입장에서 본 장점에 해당되지 않은 것은?","① Door to Door 일관수송으로 적하시간과 비용의 감소\n② 화물의 손상과 도난 감소\n③ 소량화물의 혼재작업을 ㅋ통한 콘솔(consol) 작업료 수입의 확보\n④ 화물포장비용의 절감","③","","","","",""],["80","컨테이너 터미널이 갖추어야 할 기본 요건으로 적합하지 않은 것은?","① 컨테이너 상태를 검사할 수 있는 시설 및 조직이 구비되어 있을 것\n② 대량소비를 하는 대도시 근처에 위치할 것\n③ 대량컨테이너를 동시 수용하기 위하여 배후에 넓은 CY나 CFS가 확보되어 있을 것\n④ 컨테이너 터미널을 통과하는 대량 컨테이너를 신속, 정확하게 처리할 수 있는 능력이 갖춰진 시스템 하에서 운영될 것","②","","","","",""],["81","다음 중 선적서류에 해당되지 않는 것은?","① 항공화물운송장   ② 선하증권   ③ 선적계약서   ④ 포장명세서","③","","","","",""],["82","항해용선계약(Voyage Charter Party)에 관한 설명중 틀린 것은?","① 용선료를 용선기간에 따라 결정하고 용선개시전에 미리 선급한다.\n② 용선자는 선복을 이용하고 선주는 운송행위를 한다.\n③ 선주와 용선자간의 계약내용으로는 선내하역비 부담조건과 정박기간에 관한 사항이 중요시 된다.\n④ 용선자는 선주에게 운임을 지급하고 선주는 선박운항에 따른 제비용을 부담한다.","①","","","","",""],["83","다음 항해용선계약상의 선적․양륙 제비용 부담조건 중 선내하역비 전부를 용선자인 화주가 부담하는 하역조건은?","① Berth Term      ② F.I.(Free In)\n③ F.O.(Free Out)   ④ F.I.O.(Free In \u0026 Out)","④","","","","",""],["84","해운동맹(Shipping Conference)에 관한 다음 설명중 틀린 것은?","① 해운동맹을 부정기선동맹(Tramper Conference) 또는 협의협정(Discussion Agreement)이라고도 한다.\n② 해운동맹에는 개방식동맹(Open Conference)과 폐쇄식동맹(Closed Conference)이 있다.\n③ 해운동맹은 계약운임제도(Contract Rate System), 운임환불제도(Freight Rebate System) 등의 수단으로 화주를 구속하기도 한다.\n④ 해운동맹의 주요기능으로는 운임협정, 항해협정, 운임공동계산협정 등이 있다.","①","","","","",""],["85","다음 중 항해용선계약의 주요 계약내용이라고 볼 수 없는 것은?","① 선박의 속도    ② 하역조건    ③ 정박기간    ④ 운임","①","","","","",""],["86","다음 중 화물운송계약에 관한 설명중 옳은 것은?","① 용선운송계약이란 운송인이 다수의 송화인으로부터 개개의 화물을 운송할 것을 인수하는계약을 말한다.\n② 나용선계약이란 화물 운송을 위하여 선주로부터 선복의 일부를 용선하는 계약을 말한다.\n③ 기간용선계약은 하루 단위로 선복을 빌리는 일대용선계약을 말한다.\n④ 항해용선계약이란 특정의 항구로부터 항구까지 화물을 운송하기 위하여 용선하는 계약을 말한다.","④","","","","",""],["87","다음 중 부정기선의 특징과 관련이 있는 것은?","① 주로 광석, 곡류, 목재등 살화물의 대량운송에 이용되고 있다.\n② 항로가 일정하고 정기적으로 운항된다.\n③ 일반적으로 해운동맹에 가입한다.\n④ 운임은 운임율표에 따른다.","①","","","","",""],["88","다음 중 20 feet Container에 관한 설명으로 옳은 것은?","① 화물의 중량을 20톤까지 적재할 수 있는 컨테이너\n② 높이와 폭의 합계가 20피트인 컨테이너\n③ 길이가 20피트인 컨테이너\n④ 높이는 8피트, 폭은 20피트인 컨테이너","③","","","","",""],["89","다음 중 용선 계약시 하역기간을 하역작업이 가능한 일자중 공휴일은 그 산정에서 제외하는 방법은?","① Running Laydays    ② Customary Quick Despatch\n③ WWD SHEX        ④ Weather Working Days ","③","","","","",""],["90","정기선에 대한 일반적인 설명으로 옳지 않는 것은?","① 부정기선보다 운임의 변동폭이 크다.\n② 소량이고 다종 다양한 화물로 구성된다.\n③ 운항형태가 규칙적이고 반복적이다.\n④ 부정기선보다 운임이 저렴하다.","①","","","","",""],["91","송화인이 컨테이너를 이용하기 위하여 반출이나 반입할 때 작성하는 서류는?","① Dock Receipt   ② Container Receipt\n③ Booking Note   ④ Equipment Receipt","④","","","","",""],["92","다음 중 정기선 운임시장의 특성으로 옳은 것은?","① 운임율이 시장기능에 따라 변한다.\n② 카르텔이 형성되어 있어 시장에의 진입이 상대적으로 어렵다.\n③ 선주의 시장통제능력이 크지 않다.\n④ 경쟁을 제한하는 제도적 장치가 전무하다.","②","","","","",""],["93","다음 중 해운동맹의 주요 협정 내용이 아닌 것은? ","① 해상보험협정  ② 운임협정  ③ 배선협정  ④ 공동계산협정","①","","","","",""],["94","컨테이너를 직접 적재하기 위하여 정열해 놓은 곳을 무엇이라 하는가?","① Storage Yard   ② Marshalling Yard\n③ apron         ④ Container Freight Station","②","","","","",""],["95","선박의 정박기간을 당해 항구에서의 관습적 조속하역으로 설정한 조건은?","① CQD    ② Running laydays    ③ SHEX    ④ WWD ","①","","","","",""],["96","수출입 통계 및 항만 물동량 통계의 기준이 되는 컨테이너 규격은?","① 8 feet    ② 20 feet    ③ 35 feet    ④ 40 feet","②","","","","",""],["97","다음 컨테이너중 식품이나 수산물의 운송에 적합한 것은?","① Dry Container   ② Reefer Container    ③ Open Top Container  ④ General Ship","②","","","","",""],["98","선박의 현측을 통하여 크레인 등으로 화물을 하역하는 방식을 무엇이라 하는가?","① RO/RO    ② FO/FO    ③ LO/LO    ④ Lash","③","","","","",""],["99","다음 중 컨테이너운송의 장점을 최대한도로 이용한 운송 방법은?","① CFS/CFS    ② CFS/CY     ③ CY/CFS    ④ CY/CY","④","","","","",""],["100","RORO운송과 같이 본선에 난간(Ship\u0027s Rail)을 이용할 수 없는 무역거래에서 FOB조건을 채택할 수 없는 경우에 이용할 수 있는 적합한 정형거래조건은?","① FCA    ② CIP     ③ DDP    ④ FAS","①","","","","",""],["101","다음 중 컨테이너에 관련된 국제협약이 아닌 것은?","① 컨테이너 통관협약    ② TIR 협약     ③ 컨테이너 안전협약    ④ TCM 조약","④","","","","",""],["102","다음에서 하역비부담에 의한 분류에서 FIO(Free In and Out)조건으로 알맞은 것은?","① 적하와 양하에 들어가는 하역비를 선주가 부담\n② 적하와 양하에 들어가는 하역비를 하주가 부담\n③ 적하에 들어가는 하역비를 화주가 부담하고 양하에 들어가는 하역비를 선주가 부담\n④ 적하에 들어가는 하역비를 선주가 부담하고 양하에 들어가는 하역비를 하주가 부담","②","","","","",""],["103","해상운송의 하역비 부담조건 중에서 적하작업에 들어가는 하역비를 하주가 부담하고 양하작업에 들어가는 하역비는 선주가 부담하는 조건은 무엇인가? ","① Berth Term          ② FO(Free Out)\n③ FI(Free In)           ④ FIO(Free In and Out)","③","","","","",""],["104","다음의 부정기선 운항형태 중 선박만을 용선하여 인적 및 물적요소 전체를 용선자가 부담하는 방식은 무엇인가?","① 항해용선(Voyage Charter)    ② 일대용선(Daily Charter)\n③ 선복용선(Lump-sum Charter)  ④ 나용선(Bare-boat Charter)","④","","","","",""],["105","컨테이너 터미널의 마샬링야드(Marshalling Yard)에 대한 설명으로 옳은 것은?","① 항만에 있어서 본선 안벽의 바로 배후에 있는 부분으로 컨테이너 하역장비가 설치된 곳이다.\n② 선적해야 할 컨테이너를 하역 순서대로 정열해두거나 양하된 컨테이너를 배치해 놓은 장소를 말한다.\n③ 컨테이너 1 개를 채울 수 없는 소량화물을 보관하거나 컨테이너에 적입하는 장소를 말한다.\n④ 컨테이너 터미널 내에 있는 여러 종류의 하역기기를 수리, 점검하는 장소를 말한다.","②","","","","",""],["106","해상운송에 있어서 정기선운송(Liner)과 부정기선운송(Tramper)의 비교에 대한 설명 중 맞지 않는 것은?","① 정기선 운송은 이종화물을 취급하고, 부정기선 운송은 동종화물을 취급한다.\n② 정기선 운송은 화주의 요구에 따라 서비스가 조정되고, 부정기선 운송은 선주와 용선자간의 협의에 의해 서비스가 결정된다.\n③ 운송계약은 정기선 운송은 선하증권(B/L)으로 체결하고, 부정기선 운송은 용선계약서(Charter Party)로 체결한다.\n④ 정기선 운송은 중개인이 화물집화를 담당하는 반면에 부정기선 운송은 영업부 직원이 화물집화를 담당한다.","④","","","","",""],["107","다음에서 내륙 컨테이너 기지(Inland Container Depot ; ICD)의 설명과 거리가 먼 것은?","①  ICD는 원래 내륙통관기지를 뜻하는 Inland Clearance Depot의 의미로 쓰였다.\n② 본선작업과 마샬링(Marshalling) 기능을 수행하는 기능을 갖고 있다.\n③ 운송의 거점으로서 대량운송의 실현, 공차율의 감소, 운송회전율의 증가등을 통한 운송의 합리화를 실현하고 있다.\n④ 세관 통관하에 수출입 및 연계운송을 위하여 일시적인 장치, 창고보관, 재수출, 일시상륙 등의 기능을 담당하는 장소이다.","②","","","","",""],["108","다음중 편의치적(Flags of Convenience)을 선호하는 이유가 아닌 것은?","① 운항 및 안전기준의 철저한 이행\n② 자국선원을 승선시키는 것에 비해 인건비 절감\n③ 국제금융시장의 이용 용이\n④ 운항에 따른 세금의 면제","①","","","","",""],["109","다음은 내륙컨테이너기지(ICD: Inland Container Depot)의 특성을 나타낸 것이다. 특성에 해당되지 않는 것은?","①  ICD에서는 많은 기능들이 수행되고 있으나 그 중에서도 화물의 혼재, 컨테이너의 배치, 적재 및 해체 등은 필수적인 임무로 간주되고 있다.\n② ICD는 전통적으로 항만에서 수행되는 기능 및 서비스의 대부분을 담당하고 있는 까닭에 내륙항(Inland Port)이라고도 불리우며, 그 결과 항만에서의 보관시설 부족문제를 해소한다.\n③ ICD의 기능적 구조범위는 매우 넓어 세관, 선사, 철도회사, 트럭회사, 포워더, 은행, 보험회사, 컨테이너 수리소, 포장회사, 관련 정부기관 등이 위치하게 된다. \n④  ICD는 화물의 출발지와 최종목적지가 다른 소량의 컨테이너화물을 만재컨테이너화함으로써 소량화주에게 운송비의 절감을 가져다 줄 수 있으나 대량화주에게는 경제적 의미가 없다. ","④","","","","",""],["110","컨테이너선의 변형으로 컨테이너 대신에 규격화된 전용 선박을 운송단위로 사용하며, 부선에 화물을 적재한 상태로 본선에 적입 및 운송하는 선박은 무엇인가?","① 유송선    ② 래쉬선(LASH)      ③ 특수선    ④ 카페리(Car Ferry)","②","","","","",""],["111","다음 중 화물의 종류나 화주에 관계없이 운송 단위(예를 들면 컨테이너 당)를 기준으로 일률적으로 부과하는 운임은?","① FAK Rate        ② Commodity Rate      ③ Through Rate     ④ Special Rate","①","","","","",""],["112","해상운송은 운송계약에 따라서 개품운송과 용선운송으로 나눌 수 있다. 다음 중 잘못 설명된 것은 무엇인가?","① 개품운송의 선박은 주로 정기선을 이용하여 화물을 운송한다.\n② 용선운송의 하역조건은 FIO 조건으로 적양하 비용을 하주가 부담하는 조건이다.\n③ 개품운송에서 적용하는 운임은 Tariff Rate운임을 적용한다.\n④ 용선운송은 주로 컨테이너화물 및 Unit화물을 운송한다.","④","","","","",""],["113","컨테이너 하역방식 중 Barge에 컨테이너 또는 일반화물을 적재하고 barge에 설치되어 있는 crane 또는 elevator에 의하여 하역되는 방식은 어떤 것인가?","① Lift on/ Lift off       ② Sea-Bee Ship\n③ Roll on/ Roll off       ④ Float on/ Float off","④","","","","",""],["114","외국의 한 수입업자가 국내의 다수 수출업자들로부터 소량의 상품들을 구매하여 동일 시기에 동일지역으로 컨테이너 단위로 운송할 경우 주로 이용될 수 있는 운송형태는?","① CFS/CFS      ② CFS/CY      ③ CY/CY       ④ ICD/CFS","②","","","","",""],["115","다음 중 이동식 컨테이너 취급장비로서 컨테이너를 차곡차곡 쌓거나 컨테이너를 내리는 일 또는 섀시나 트레일러에 싣고 내리는 일을 하는 것은?","① 스트래들 캐리어(Straddle Carrier)\n② 갠트리 크레인(Gantry Crane, Shore Crane, Quay Crane)\n③ 트랜스테이너(Transtainer, Transfer Crane)\n④ 위치 크레인(Winch Crane)","③","","","","",""],["116","다음 해상운임의 부대비용 중 Detention Charge에 대한 설명은?","① 북미수출의 경우 도착항에서의 하역 및 터미널 작업비용을 해상운임과는 별도로 징수하는 것으로서 현재 20TEU 컨테이너당으로 부과하고 있다.\n② 적하 또는 양하 일수가 약정된 정박기간을 초과하는 경우 초과일수에 대하여 용선자가 선주에게 지불하는 것으로 1일 또는 1톤당으로 지불하는 금액이다.\n③ 화주에게 허용된 시간(Free Time)을 초과하여 컨테이너를 방치하였을 경우 송화인이나 수화인이 선박회사에게 지불해야 할 비용이다.\n④ 항해용선계약서에 규정된 시간내에 선적이나 양하를 완료하지 못할 경우 선주에게 지불하는 비용이다.","③","","","","",""],["117","해상운송은 항해일정의 공시 여부, 운임요율 등에 따라서 정기선 운송과 부정기선운송으로 나뉘어진다. 다음 중 해상운송에 대한 설명으로 올바르지 못한 것은?","① 정기선은 정기항로에 취항하고 있는 선박을 말하며 주로 완제품이나 반제품 등의 일반화물의 수송에 이용된다.\n② 부정기선은 일정한 항로나 화주를 한정하지 않고 화물이 있을 때마다, 선복의 수요가 있을 때마다 화주가 요구하는 시기와 항로에 따라서 화물을 운송한다.\n③ 정기선은 화주에게 양질의 서비스를 제공하기 위해 참단장비를 갖춘 선박을 이용하여, 통상 포장화물의 운송에 이용된다.\n④ 부정기선은 해운시황에 따라서 선복의 공급이 불균형적이므로 카르텔을 형성하여 선복수급을 조정할 필요성이 정기선에 비해서 크다.","④","","","","",""],["118","정기선 운임의 산정 기준으로 적합하지 않은 것은?","① 운임의 안정(price stability)\n② 시장의 수요와 공급의 균형(balance between supply and demand in a market)\n③ 공동운항(Joint service)\n④ 화물 간 교차보조(Cross-subsidization between commodities)","②","","","","",""],["119","정기선과 부정기선 운영에서 해상운임은 어떻게 결정되어 지는가?","① 수요 측의 운임 부담 능력을 상한과 공급 측의 운송원가를 하한으로 하는 범위내에서 균형에 따라 결정\n② 공급 측인 선사에 의해 일방적으로 결정\n③ 운송원가와의 관계는 매우 불확실한 상태에서 결정\n④ 가격경쟁의 배제를 주요 협정사항으로 결정","①","","","","",""],["120","정기선 운임 산정기준에서 화물의 송장가격이 높은 고가품목은 비싼 운임을 적요하고 낮은 품목은 비교적 싼 운임을 적용하는 기준은?","① 운임의 안정(price stability)\n② 시장의 수요와 공급의 균형(balance between supply and demand in a market)\n③ 공동운항(Joint service)\n④ 화물 간 교차보조(Cross-subsidization between commodities)","④","","","","",""],["121","정기선 컨테이너 표준 운임표 규정의 구분 중 해당 되지 않는 것은?","① 해상운송 규정             ② 항만 및 관련규정 서비스 요율 규정\n③ 회원정보규정              ④ 내륙운송 규정","③","","","","",""],["122","정기선 표준 운임표 규정 중 해상운송 규정에 수록된 내용으로 적합하지 않은 것은?","① 운임산정 기준         ② 컨테이너화물의 혼재\n③ 운송주선 수수료       ④ 터미널 내 화물 취급료","④","","","","",""],["123","정기선 표준 운이표 규정 중 항만 및 관련 서비스 요율 규종에 수록된 내용으로 적합하지 않은 것은?","① 터미널 내 화물 취급료  ② 운송관련 서류\n③ 소량 컨테이너화물(LCL) ④ 체화료(demurrage), 장비 지체료(detention charge)","②","","","","",""],["124","다음 중 선박의 운항비에 포함되지 않는 것은?","① 도선료    ② 연료비      ③ 검량비    ④ 일반관리비","④","","","","",""],["125","정기선 운임에서 화물의 선적자, 즉 수출업자가 선적지에서 운임을 지불하는 것을 무엇이라고 하는가?","① 선불운임   ② 이중운임      ③ 후불운임   ④ 최저운임","①","","","","",""],["126","정기선 운임에서 무역조건이 FOB인 경우 화물이 도착 후 수하인(consignee)또는 그 대리인이 운임을 지불하는 것은?","① 선불운임(Freight prepaid)  ② 후불운임(Freight collect)\n③ 특별 운임(Special rates)   ④ 최저운임(Minimum charges)","②","","","","",""],["127","다음 중 하역비 부담에 의한 운임의 구분이 아닌 것은?","① Berth term(Liner term)             ② FI(Free in)\n③ OCP(overland common point)        ④ FIO(Free in \u0026 out)","③","","","","",""],["128","화물을 본선으로 양하하는 비용과 위험 부담은 화주의 책임이며, 받대로 선사는 적하 비용을 부담하는 것은?","① Berth term(Liner term)                   ② FO(Free out)\n③ BAF(Bunker adjustment factor)            ④ FI(Free In)","②","","","","",""],["129","선주가 적하 및 양하의 비용을 모두 부담하혀 제반지용과 위험부담을 지는 것은 다음 중 어느 것인가?","① Berth term(Liner term)                   ② FO(Free out)\n③ FIO(Free in \u0026 out)                      ④ FI(Free In)","①","","","","",""],["130","다음 중 화물의 가체에 의한 운임 분류중 적당하지 않은 것은?","① 품목별 운임(Commodity rates)            ② 보통 운임(Common rates)\n③ 등급별 운임(Class rates)                 ④ 전통 운임(Through rates)","④","","","","",""],["131","다음 중 운임동맹이 공통 운임표(common tariff)에 수록하여 동일 품목을 가진 모든 화주에게 동일한 수준으로 부과하는 운임을 말하는 것은?","① 품목별 운임(Commodity rates)            ② 보통 운임(Common rates)\n③ 등급별 운임(Class rates)                 ④ 종가 운임(Ad-valoren rates)","②","","","","",""],["132","다음 중 운송 구간에 의한 운임 분류의 종류가 아닌 것은?","① 전통 운임(Through rate)                 ② 공동 운임(Joint rate)\n③ 구간 운임(Local rates)                   ④ 이중 운임(Dual rate)","④","","","","",""],["133","다음 중 물량에 의한 운임 분류로서 적합하지 않은 것은?","① 우대운송계약운임(Service contract rates)    ② 대량화물우대운임(Time/Volume rates)\n③ 독자운임결정권운임(Independent action rates) ④ 특별견적운임(Special quotation rates)","③","","","","",""],["134","이중운임(Dual rate)에 관한 설명으로 적합한 것은?","① 1톤 미만의 소량화물에 적용하는 운임\n② 운임동맹이 저 운임의 비 동맹선사와의 경쟁을 위해 운임동맹과 계약을 체결한 화주에게 약 9.5% 낮은 운임을 적용\n③ 화주와의 유대관계를 고려하여 대형화주에게 일반운임보다 낮은 운임을 적용\n④ 선사가 일정기간 화주가 제공한 물량의 과다에 따라 차등제로 적용하는 운임","②","","","","",""],["135","다음 중 비동맹 선사와의 경쟁을 위한 운임이 아닌 것은?","① 자유운임(Open rates)               ② 특별운임(Special rates)\n③ 특별견적운임(Special quotation rates)  ④ 독자운임결정권운임(Independent action rates) ","③","","","","",""],["136","운임동맹이 비동맹 선사와의 집화경쟁을 위해 특정품목에 대해 공통 운임(Common rate)보다 낮게 책정한 운임은?","① 자유운임(Open rates)               ② 특별운임(Special rates)\n③ 특별견적운임(Special quotation rates)  ④ 독자운임결정권운임(Independent action rates)","②","","","","",""],["137","다음 중 정기선에서 컨테이너 이용의 장점과 거리가 먼 것은?","① 경제성    ② 안정성      ③ 신속성    ④ 고가성","④","","","","",""],["138","갑작스러운 유가(油價)인상분에 의한 추가적인 비용을 보전하기 위해 부과하는 할증료는?","① 유류할증료(Bunker adjustment factor)       ② 통화할증료(Currency adjstmen factor)\n③ 수에즈 운하 할증료(Suez Canal surcharge)   ④ 과중 할증료(Heavy lift charge)","①","","","","",""],["139","화물의 특수한 요구에 귀속하는 추가 비용을 보전하기 위해 부과하는 운임의 종류가 아닌 것은?","① 차별항 운임(Outport arbitrary)          ② 선택 항료(Optional charge)\n③ 전쟁위험 할증료(War risk premium)     ④ 최저운임(Minimum charges)","④","","","","",""],["140","선박이 최종 목적 항에 직접 기항하지 않아 화물의 환적으로 인해 추가로 발생하는 비용을 보전하기 위해 부과하는 요금은?","① 선택항료(Optional charge)           ② 터미널 접수료(Terminal receiving charge)\n③ 환적료(Transshipment charge)        ④ 도착지 인도료(Destination delivery charge)","③","","","","",""],["141","화주가 선적 당시에 최종 목적 항을 두개 이상 정하여 최초 항 도착 전에 양하 항을 지정하는 경우 적부상의 문제점을 감안하여 부과하는 요금은?","① 차별항 운임(Outport arbitrary)        ② 선택 항료(Optional charge)\n③ 항구 변경료(Diversion charge)        ④ 특별 운항료(Special operaing service charge)","②","","","","",""],["142","정기선 운항 수입의 중 약 80% 이상을 차지하고 있는 수입원은 다음 중 어느 것인가?","① 운임 수입    ② 대선 수입      ③ 부대 수입    ④ 스페이스 사용료","①","","","","",""],["143","자사 선박의 스페이스 중 일부를 타 선사에게 빌려 주는 대가로 합의된 스페이스 사용료(charterage)를 무엇이라고 하는가?","① 운임 수입    ② 대선 수입      ③ 부대 수입    ④ 간접 수입","②","","","","",""],["144","정기선 운항 수입 중 부대 수입원의 종류가 아닌 것은?","① 컨테이너 화물 작업장 사용료(CFS charge)         ② 체화료(Demurrage)\n③ 지체료(Detention charge)                        ④ 스페이스 사용료(charterage)","④","","","","",""],["145","정기선 운항과 관련된 비용 중 고정비용(fixed costs)에 해당하지 않는 것은?","① 자본비(Capital costs)     ② 선박 운항비(Operating costs)\n③ 항해 비용(Voyage costs)  ④ 직접 비용(Direct costs)","④","","","","",""],["146","정기선 운항과 관련된 변동 비용(variable costs)중에서 간접비용에 해당되지 않는 것은?","① 컨테이너, 트레일러 공급비용               ② 터미널 비용\n③ 컨테이너, 트레일러 수리 및 정비 비용      ④ 적하보험","②","","","","",""],["147","다음에서 본선 갑판 상에 컨테이너 하역용 갠트리 크레인을 장착하고 있는 컨테이너 선은?","① 기어 컨테이너선    ② 세미 컨테이너선\n③ 풀 컨테이너선      ④ 컨버터블 컨테이너선","①","","","","",""],["148","정기선운영에서 컨테이너 적재를 목적으로 하고 있지만 벌크도 실을 수 있는 겸용 선박은?","① 기어 컨테이너선    ② 세미 컨테이너선\n③ 풀 컨테이너선      ④ 컨버터블 컨테이너선","④","","","","",""],["149","컨테이너 선의 하역계획은 육상에서 작성되고 하역과 지휘도 육상에서 주도하지만 재래 정기선에서는 누가 하역계획을 입안하였는가?","① 선장            ② 갑판장    ③ 1등 항해사      ④ 통신사","③","","","","",""],["150","부정기선운영에서 벌크 캐리어로 운송되는 메이저 벌크(Major Bulk)로 해당되지 않는 것은?","① 철광석            ② 시멘트           ③ 석탄         ④ 곡물","②","","","","",""],["151","벌크선(Bulk carrier)에서 특정 화물을 전용으로 적재하는 선박을?","① 전용선            ② 범용선           ③ 정기선         ④ 예인선","①","","","","",""],["152","다음에서 파나마운하를 통화할 수 있는 최대 선형의 선폭은?","① 31.2m             ② 32.2m           ③ 33.3m         ④ 34.2m","②","","","","",""],["153","벌크선에서 세계 어느 항구에도 입항할 수 있는 핸디 사이즈의 선박의 중량으로 적합한 것은?","① 15,000~20,000 중       ③ 해상운송인        ④ 선박소유자","②","","","","",""],["167","다음에서 정기선항로에서의 정기용선자는 누구인가.?","① 선주         ② 화주          ③ 선박운항자        ④ 선박소유자","③","","","","",""],["168","다음 중 부정기선 항로에서 항과 하 사이의 물건 운송에 사용하는 계약은?","① 개품운송계약    ② 항해용선계약      ③ 정기용선계약      ④ 물건운송계약","②","","","","",""],["169","다음에서 운송물류(transportaion logistics)에 대한 설명으로 적합한 것은?","① 장소적 효용(space utility)을 창출하기 위해 재화를 한 장소에서 다른 장소까지 이동시키는 공간적 행위를 말한다. \n② 물품의 제고관리를 위해 잘주량을 점검하는 광범위한 분야를 말한다. \n③ 물품의 판매분야에서 물자의 흐름만 아닌 원재료 및 부품의 조달의 목적으로 활용하는 경제적 활동이다. \n④ 물품을 효율적으로 계획, 실행 및 통제하여 고객의 요구를 만족시켜 주는 과정이다. ","①","","","","",""],["170","일반적으로 운송 물류 활동을 구성하는 요소에 해당되는 것이 아닌 것은?","① 운송 모드        ② 운송 노드        ③ 운송 링크   ④ 운송 화물","④","","","","",""],["171","화물을 운송하고자 하는 운송수요자가 고려해야할 운송수단이 선택기준으로 타당하지 않은 것은?","① 화물의 특성        ② 운송 거리        ③ 화주의 큭성   ④ 운송 비용","③","","","","",""],["172","다음 중 화주는 화물의 수량이 적은 경우 선택 가능한 운송수단은?","① 정기선 운송       ② 부정기선 운송        ③ 철도운송    ④ 항공운송","④","","","","",""],["173","다음에서 운송의 거리에 따라 화주가 합리적으로 선택하여야 하는 운송수단으로 열거된 것 중 적합한 것은?","① 자동차 운송 - 항공 운송 - 철도 운송 - 복합 운송\n② 자동차 운송 - 철도 운송 - 해상 운송 - 항공 운송\n③ 해상 운송 - 철도 운송 - 자동차 운송 - 항공 운송. \n④ 복합 운송 - 자동차 운송 - 해상 운송 - 철도 운송","②","","","","",""],["174","다음에서 거리의 장단에 따라 선택할 수 있는 운송 수단 간의 특성을 나열 한 것으로 타당한것은?","     화물        단거리    중거리     장거리\n① 컨테이너        도로  -  철도   -    해운\n② 대량벌크화물   연안해운 - 연안해운 - 외항해운\n③ 여객            도로  -   해운    -   철도\n④ 컨테이너        도로  -    해운   -  철도","①","","","","",""],["175","일반적으로 화물이 출고되기 전 또는 수출 신고를 전후해서 선사에 선적예약을 하는 자는 누구인가?","① 선장       ② 통관사       ③ 화주    ④ 대리인","③","","","","",""],["176","선적예약 화물이 FCL 화물이 아닌 LCL 화물인 경우에는 누가 대행할 수 있는가?","① 선장       ② 포워더        ③ 화주    ④ 대리인","②","","","","",""],["177","다음에서 1개의 컨테이너 내에 1개 회사의 화물이 적재되는 경우를 설명한 것은?","① LCL        ② CFS      ③ FCL     ④ CY Gate","③","","","","",""],["178","다음 중 수출하는 LCL화물을 목적지별로 분류한 다음 컨테이너로 적입하는 장소를 말하는 곳은?","① 컨테이너 야드               ② 마샬링 야드\n③ 컨테이너 프레이트 스테이션   ④ 에이프런","③","","","","",""],["179","다음에서 해상운송이 육상운송과 다른 점으로 적합한 것은?","① 해상운송은 연안해운을 제외하고는 국제 무역에 주로 이용된다. \n② 해상운송은 육상운송과 같이 자국내의 물품 운송에 이용된다.  \n③ 해상운송은 소량의 화물을 운송하는데 이용된다.  \n④ 해상운송은 신속한 화물의 운송을 위해 이용된다. ","①","","","","",""],["180","다음에서 컨테이너선이 소형선 보다 더 이점인 이유로 가장 적절한 것은?","① 선박의 기계와 자동화에 더 유리하기 때문이다. \n② 컨테이너선은 대형선이므로 대량 수송해야 운항효율이 높아져 더 큰 이익이 발생하기 때문이다.  \n③ 하역관계 업무를 처리할 수 있는 숙련자가 있기 때문이다. \n④ 신조선가도 낮은 수준을 유지함으로써 대형선형이 유리하다. ","②","","","","",""],["181","FCL 화물의 송화인은 대여받은 빈 컨테이너에 화물을 적입하여 어디에 반입하는가?","① 컨테이너야적장(CY)             ② 선석(berth)      \n③ 마샬링야드 (Marshalling yard)    ④ 에이프런(apron)","①","","","","",""],["182","LCL 화물의 송화인은 화물을 컨테이너에 넣지 않은 채로 어느 곳에 반입하는가?","① 컨테이너야적장(CY)             ② 컨테이너 프레이트 스테이션(CFS)      \n③ 마샬링야드 (Marshalling yard)    ④ 에이프런(apron)","②","","","","",""],["183","본선이 입항하면 CY 운영자는 집화된 컨테이너를 무엇을 사용하여 선적하는가?","① 갠트리 크레인(gantry crane)      ② 데릭 포스트(derrick post)    \n③ 하역용 윈치(winch)              ④ 지브 크레인 (jib crane)","①","","","","",""],["184","FCL 화물의 경우에는 화물인도지시서를 누구에게 제시하고 화물을 인수해야 하는가?","① CFS 운영자         ② 포워더        ③ 통관사             ④ CY 운영자 ","④","","","","",""],["185","FCL 화물의 경우 빈 컨테이너는 선박회사가 정하는 CY에 반환해야 하는데 만약, 이때 지체되면 무엇을 지급해야 하는가?","① 선하증권           ② 선박보험      ③ 지체료             ④ 할증료","③","","","","",""],["186","부정기선 운항시 관심을 두어야 할 점은 적절한 배선인데 이때 고려해야할 점으로 적합하지 않은 것은?","① 다음 항해가 공선항해가 되지 않도록 계획한다. \n② 많은 수의 선박수를 가지려고 노력해야 한다.  \n③ 세계 각지에 있어서의 선박의 분포등에 관한 정보를 수집하여야 한다. \n④ 물동량의 증감 변화 및 운임의 추세에 대한 정보가 있어야 한다.  ","②","","","","",""],["187","부정기선의 선적에서 계약이 성립하면 누가 계약에 따라 선박을 적화지에 입항시켜야 하는가?","① 선장       ② 선주       ③ 화주    ④ 대리인","②","","","","",""],["188","부정기선의 일종인 벌크선의 선내 적화는 주로 무엇으로 하는가?","① 갠트리 크레인(Gantry crane)       ② 테릭 포스트(Derrick post)     \n③ 윈치(Winch)                      ④ 벨트 컨베이어(Belt conveyor)","④","","","","",""],["189","부정기선에서 광석이나 소금은 안벽에 설치된 무엇으로 선창에 적재되는가?","① 벨트 컨베이어(Belt conveyor)       ② 로더(Loader)     \n③ 윈치(Winch)                      ④ 프리플로우 컨베이어(Free-flow conveyor)","②","","","","",""],["190","부정기선의 하역에서 곡물은 철광석이나 석탄과 같이 무엇으로 퍼서 양화하는가?","① 언로더(Unloader)                   ② 로더(Loader)       \n③ 그래브(Grab)                      ④ 사일로(Silo)","③","","","","",""],["191","부정기선이 도착하여 선장이 화주에게 무엇을 통지하면 그 즉시 적화작업을 시작해야 하는가?","① 화물인도지시서                ② 소요량증명서\n③ 하역준비완료의 통지            ④ 원산지 증명서","③","","","","",""],["192","다음에서 1등 항해사가 적화계획을 세울 때에는 최대의 경제성이 발생할 수 있게 하기 위해 중점을 두어야 하는 것과 거리가 먼 것은?","① 적화의 양을 결정한다. \n② 중심의 위치를 적당하게 한다. \n③ 트림(배의 전후의 경사)을 최적으로 한다.  \n④ 선창의 용적을 결정한다. ","④","","","","",""],["193","다음 중 화물의 적재, 항해 중의 품질관리 및 양화등 화물에 관한 책임을 지는 자는?","① 도선사  ② 통신사    ③ 1등 항해사  ④ 해기사","③","","","","",""],["194","부정기선의 화물인 광석, 강재 등 무거운 화물은 어디까지 적재가 가능한가?","① 만재 흘수선  ② 흘수표    ③ 건현  ④ 갑판장 창고","①","","","","",""],["195","만재흘수선을 세계적으로 적용하기 위해 전세계의 항로를 4가지 구역으로 구분하였는데 그 구역이 아닌 곳은?","① 계절동기대                ② 열대\n③ 계절열대                  ④ 아열대","④","","","","",""],["196","부정기선에서 화물을 적재 시 만재흘수선을 나타내기 위해 만재 흘수선표를 선박의 어디에 그려 넣어야 하는가?","① 건현                      ② 선체 중앙부의 양현\n③ 늑골                      ④ 용골","②","","","","",""],["197","선박에 화물을 적재할 때 중심의 높이와 관련된 설명으로 바람직하지 못한 것은?","① 재래 정기선이나 컨테이너선은 화물을 적재할 대 중심의 높이를 조정할 수 있다. \n② 갑판상에 많은 화물을 적재한 컨테이너선을 중심이 높아져 배의 안정성이 나빠진다. \n③ 목재 운반선의 경우 화물을 갑판에 많이 적재할 경우 중심이 높아져 배의 안정성이 나빠진다. \n④ 광석 전용선과 원유 탱커 등은 적재 방법에 의해 중심의 높이를 조정할 수 있다. ","④","","","","",""],["198","수심이 앝은 곳에 입출항 시 가능한 한 선수미의 흘수가 똑같게 되도록 무엇을 조절해야 하는가?","① 트림         ② 적화량         ③ 중심            ④ 선원 수 ","②","","","","",""],["199","종래의 정기 화물선의 가장 큰 문제점으로 지적되었던 것으로 해당되는 것은?","① 하역시간이 단축할 수 있다. \n② 하역비용이 절감될 수 있다.  \n③ 각종화물을 규격용기에 적재할 수 있다.\n④ 잡다한 화물을 개별적으로 운송한다. ","④","","","","",""],["200","다음 중 유조선에 대한 설명으로 적절하지 않은 것은?","① 중동 등의 원유 생산지로 부터 정유 시설 항구까지 원유를 수송한다.  \n② 정유공장에서 소비지로 정재유를 수송하기도 한다. \n③ 화물유의 요동을 방지하기 위해 종횡의 유밀 격벽으로 구획되어 있다. \n④ 양화지에서 선적지로 되돌아 갈때는 만재상태로 수송한다. ","④","","","","",""],["201","다음은 탱커를 크기로 분류한 것 중 20만 톤 이상 30만 톤 미만의 탱커는 어는 것인가?","① VLCC         ② ULCC         ③ AFRAMAX            ④ SUEZMAX","①","","","","",""],["202","다음 중 해상운송에 있어서 기술 혁신 사례 중 대형화에 관한 설명 중 적합한 것은?","① 컨테이너선은 운항 효율면에서 대형선보다는 소형선이 더 효율적이다.  \n② 대형화하면 신조선가도 똑같이 올라가기 때문에, 대형화의 수익이 낮아 진다.  \n③ 제4세대 컨테이너선은 4~5000 TEU, 길이 262~290m로 이른바 포스트 파나막스선이다.\n④ 양화지에서 선적지로 되돌아 갈때는 만재상태로 수송한다. ","③","","","","",""],["203","다음 중 카페리에 관한 설명으로 적합한 것은?","① 자동차만 싣고 운항하는 배이다.  \n② 단거리 카페리는 주로 트럭 수송에 이용된다.  \n③ 수송되는 화물은 컨테이너 수송화물보다 그 가격이 저가이다. \n④ 차량 갑판에 자동차를 싣고 가서 램프를 통해 배를 육지로 내린다. ","④","","","","",""],["204","다음 중 정기선이 컨테이너화 되면서 생기는 단점으로 적합한 것은?","① 화물운송에 있어서 경제성을 충족시킨다. \n② 화물을 출발하여 수화인에게 전달하는 신속성을 유지시킨다.  \n③ 화물운송시 화물을 필폐된 용기에 의해 운반되므로 안전성을 확보한다. \n④ 운송체제를 구축하는데 막대한 자금이 소요된다.","④","","","","",""],["205","다음에서 컨테이너선을 운영하면 절감되는 항목으로 해당되지 않는 것은?","① 인건비         ② 창고료        ③ 보험료           ④ 할증료 ","④","","","","",""],["206","다음 재래 정기선이 컨테이너선으로 변화됨으로써 발생되는 이점을 설명한 것으로 해당되지 않는 것은?","① 컨테이너라는 밀폐된 용기에 넣어 운송하므로 화물을 저렴하게 운송할 수 있다. \n② 별개의 독립된 창고의 역할을 하는 컨테이너이므로, 포장비, 창고료 및 보험료를 절감할 수 있다.  \n③ 부두에서 화물을 적하 및 양하하는데 많은 인부를 동원해야 하므로 더 많은 일자리를 창출할 수 있다.  \n④ 규격화된 컨테이너의 사용으로 하역 시간과 선박의 정박기간이 단축된다. ","③","","","","",""],["207","다음 중 컨테이너 적재를 목적으로 하고 있지만 벌크도 실을 수 있는 겸용 선박은?","① 풀 컨테이너선(Full container ship)     ② 컨버터블 컨테이너선(Convertible container ship)\n③ 세미 컨테이너선(Semi-container ship)   ④ 기어레스 컨테이너선(Gearless container ship)","②","","","","",""],["208","다음에서 컨테이너와 컨테이너를 넣지 않은 화물(break bulk) 두 가지를 적재하는 장비를 설치한 선박은?","① 풀 컨테이너선(Full container ship)     ② 컨버터블 컨테이너선(Convertible container ship)\n③ 세미 컨테이너선(Semi-container ship)   ④ 기어레스 컨테이너선(Gearless container ship)","③","","","","",""],["209","다음에서 LOLO(Lift On Lift On)선의 특성을 설명한 것으로 적합하지 않은 것은?","① 컨테이너를 육상의 갠트리 크레인으로 싣고 내리는 선박이다. \n② 화물창 내에서는 상하 방향으로 설치된 셀 가이드에 따라서 컨테이너를 중복되게 격납한다.\n③ 컨테이너를 트레일러에 의하여 적재하는 방식으로 프크리프트를 사용하여 쌓는다.  \n④ 갑판 상에 컨테이너를 과적하면 항해 중 복원력에 나쁜 영향을 미칠 수 있다. ","③","","","","",""],["210","다음은 재래 정기선과 컨테이너선을 비교 설명한 것으로 적절한 것은?","① 컨테이너선은 재래 정기선과 비교하여 항구에 오래 정박해 있어도 경제성을 절감할 수 있다. \n② 재래 정기선은 선박이 컨테이너선에 비해 소형이므로 하역을 하는 시간을 단축할 수 있다. \n③ 재래 정기선은 1등 항해사가 하역계획을 입안하였지만, 컨테이너선은 육상에서 작성되고 하역과 지휘도 육상에서 주도한다.\n④ 잡화는 종류가 많으므로 이를 하역하는 데 시간과 비용이 많이 소요되기 때문에 좀 더 소형인 재래 정기선이 능률적이다. ","③","","","","",""],["211","다음 중 벌크 캐리어로 운송되는 메이저 벌크(major bulk)품목에서 다소 거리가 먼 것은?","① 철광석         ② 곡물        ③ 석탄           ④ 설탕 ","④","","","","",""],["212","벌크선이 하역하는 장소는 무엇에 의해 달라지는 가?","① 운임           ② 화물        ③ 부두           ④ 용량 ","②","","","","",""],["213","다음 중 파나막스(Panamax)선의 사이즈와 무게는 어느 정도인가?","① 선폭 32.2m 이하 2만 중량톤 전후    ② 선폭 32.5m 이상 8만 중량톤 전후\n③ 선폭 32.2m 이하 6만 중량톤 전후    ④ 선폭 35.0m 이상 2만 중량톤 전후","③","","","","",""],["214","벌크선 중 핸디사이즈(Handy size)의 선박은 무게는 어느 정도인가?","① 1만 5,000 ~ 3만 중량톤     ② 1만 5,000 ~ 4만 5,000중량톤 \n③ 2만 ~ 4만 중량톤           ④ 2만 5,000 ~ 4만 5,000중량톤 ","②","","","","",""],["215","다음에서 RORO(Roll On Roll off)선의 특징을 서술한 것으로 해당되지 않는 것은?","① 선미 또는 현측에 설치한 램프웨이를 통해 컨테이너를 트레일러에 의해 적재하는 방식이다. \n② 화물창 내에서는 포크리프트를 사용하여 중복으로 쌓아 격납한다. \n③ 적재 가능한 컨테이너가 적어 육상의 크레인 설비가 필요하지 않다. \n④ 갑판 상에 컨테이너를 과적하면 항해 중 복원력에 나쁜 영향을 미칠 수 있다. ","④","","","","",""],["216","다음의 부정기선 영업에 관한 내용을 서술한 것으로 적합하지 않은 것은?","① 여러 척의 선박을 필요로 하지 않는다. \n② 육상설비에 많은 투자를 할 필요가 없다. \n③ 자본 집약적 산업이고 공증운송인으로서의 역할을 한다. \n④ 비교적 간단하게 사업을 개시 또는 중지 할 수 있다.  ","③","","","","",""],["217","다음에서 FOFO(flot on flot off)에 대한 설명으로 올바르지 않는 것은?","① 다수의 부선에 컨테이너를 비롯 팰릿화된 화물을 수납가능한 방식이다. \n② 선수나 선미에 달린 램프를 통해 트레일러나 지게차 등의 하역기계를 활용한 방식이다.\n③ 라쉬선(LASH), 시비선(Sea Bee Carrier) 등이 이 방식을 채용하고 있다. \n④ 선상에 장비된 크레인으로 부선채 선적하여 그대로 목적지까지 운반하는 하역방식이다.  ","②","","","","",""],["218","다음의 장기운송계약의 장점으로 적합하지 않은 것은?","① 안정된 경영으로 해운 산업의 발전에 기여한다. \n② 장기계약을 담보로 자금 조달이 쉬워진다. \n③ 선주와 화주 모두에게 시황변동에 따른 위험을 감소시킬 수 있다. \n④ 시황변동이나 물가 수준을 적절하게 반영할 수 있다.  ","④","","","","",""],["219","다음에서 전용선에 대한 설명으로 올바르지 않은 것은?","① 장기운송계약에 투입되는 선박으로 주로 이용된다. \n② 운항 원가를 최소화 하는 이상적인 선종이다. \n③ 장기운송계약을 통해 운송이 실시 되므로 정기선 영업에 준거한다.  \n④ 특정화물의 수요가 없을 경우에도 상관없이 최대의 경제성을 발휘한다. ","④","","","","",""],["220","장기운송계약의 단점을 보완하기 위해 고려해야 하는 사항으로 해당되지 않는 것은?","① 환율          ② 연료비        ③ 계약년도          ④ 물가 상승률 ","③","","","","",""],["221","다음의 부정기선의 용선방법의 종류에 해당되지 않는 것은?","① 정기용선         ② 항해용선        ③ 나용선     ④ 개품운송","④","","","","",""],["222","다음에서 정기또는 기간용선계약에 대한 개념으로 적당한 것은?","① 선주와 용선자가 단일항해 운송을 약정하는 것을 말한다. \n② 일정기간 동안 선복의 전부 또는 일부를 용선하는 계약을 말한다. \n③ 송하인이 선박회사에 화물의 운송을 신천하면 운송인은 이것을 승낙함으로써 계약이 성립하는 것을 말한다. \n④ 선박자체만을 임차하고 인적 및 물적요소를 용선자가 부담하는 선박의 임대차 계약을 말한다.","②","","","","",""],["223","다음에서 정기운송계약 이용의 예에 대한 설명으로 부적절한 것은?","① 정기선사: 급격하게 증가한 수요를 충족시키고자 할 때\n② 용선자: 다시 제 3자에게 정기용선 또는 항해 용선을 주어 운임의 차액을 얻으려는 상업목적\n③ 화주: 일정기간 연속해서 대량의 화물운송이 필요할 때\n④ 선주: 선박자체만을 임차하고 용선자가 인적 및 물적요소를 부담할 때","④","","","","",""],["224","다음 중 정기운송계약의 주요내용과 관계가 먼 것은?","① 선박명세     ② 용선료 지급      ③ 부적운임유치권           ④ 감항능력담보 ","③","","","","",""],["225","다음 중 화주가 선적, 양하비용을 전적으로 부담하는 것은?","① F.I.O     ② F.O     ③ F.I         ④ CP","①","","","","",""],["226","다음중 부정기선 운임의 특징에 대한 설명으로 부적당한 것은?","① 운임의 결정요인은 장기적으로 경제성장과 교역량을 고려해야 한다. \n② 해운시황에 따라 변동폭이 안정되어 운임의 등락 폭이 적다. \n③ 경제적, 정치적인 변수를 중기적인 차원에서 고려해야 한다. \n④ 일시적인 수요증감에 따른 선복 과부족역시 운임의 결정요인이 된다. ","②","","","","",""],["227","최근 해상운송이 컨테이너화 되어 가고 있다. 그 이유로 옳은 것은?","① 자본이 적게 소요된다.               ② 선박의 정박기간이 늘어난다. \n③ 하역인부를 많이 고용할 수 있다.      ④ 화물을 안전하게 운송할 수 있다. ","④","","","","",""],["228","다음에서 주로 재래의 일반 화물선을 개조하였고 일반화물과 컨테이너 화물을 함께 실을 수 있는 구조의 선박은?","① LOLO선      ② RORO선       ③ LASH선      ④ Semi-container선","④","","","","",""],["229","다음에서 광석 운송선에 대한 설명으로 바람직하지 않은 것은?","① 광산물을 산적 상태로 선창에 적재하여 운송하는 선박을 말한다. \n② 광석운송선으로 가장 많이 운송되는 화물은 제철 원료인 철광석이다. \n③ 선체는 수밀구조를 비롯아여 이중저 및 이중선각등의 특수한 구조를 구비해야 한다. \n④ 선창은 배의 중심선을 따라서 구획 설치 되어 있다. ","③","","","","",""],["230","다음 중 광석 운송선의 구조에 관한 설명으로 바람직하지 못한 것은?","① 선창 내에 임시로 시프팅 보드를 설치하여야 한다. \n② 단면 형상과 강도 면에서도 특수한 구조로 되어 있다. \n③ 화물의 무게를 고려 이중저를 보통의 선박보다 높게 배치하여야 한다. \n④ 선형은 탱커와 비슷한 선미 기관실형으로 한다.  ","①","","","","",""],["231","다음에서 새깅(Sagging) 현상을 설명한 것으로 적절한 것은?","① 정지각이 비교적 작은 화물의 적재 시에 양쪽 선측으로 삼각형 형태의 공간이 생긴 현상\n② 선적된 화물이 선박의 동요에 의해 침하와 이동이 일어나는 현상\n③ 광석 운송선에서 철광석을 만재 하였을 시 중안 선창의 무게 집중으로 인해 생긴 현상\n④ 화물이 온도의 변화에 따라 부피가 변화한 현상 ","③","","","","",""],["232","정지각이 비교적 작은 곡물의 적재 하는 경우 양쪽 선측으로 삼각형 형태의 빈공간이 생겨서 위험할 수 있는데 이를 방지하기 위한 장치는?","① 이중선각(Double Hull)                ② 셀프 트리밍(Self Trimming) \n③ 포크리프트(Forklift)                  ④ 밸러스트(Ballast)","②","","","","",""],["233","자동차 전용 운송선은 RORO선으로 분류되기도 하는 이유로 타당한 것은?","① 보통 편도 화물을 운송하고 탱커를 겸하고 있기 때문에\n② 선창내에 시프팅 보드(shifting board)를 설치하였기 때문에\n③ 일반적을 본선에는 하역장비가 설치되어 있지 않기 때문에\n④ 선수나 선미에 설치된 램프(Ramp)를 이용하거나 선측의 개구부(side port)를 이용하기 때문에","④","","","","",""],["234","다음에서 자동차 전용 운송선의 특징을 설명한 것으로 적합하지 않은 것은?","① 선창 내에 갑판 (Deck)의 수가 많다.\n② 선창 및 갑판 사이에는 승강 장치와 램프로 연결되어 있다. \n③ 선수부에서 선미부에 이르는 좌, 우, 중앙의 3개 종격벽과 많은 횡격벽이 있다.  \n④ 수선 하부의 면적이 넓어서 풍압력의 영향을 많이 받는다. ","③","","","","",""],["235","흔히, 천연가스를 훨씬 낮은 극저온의 상태에서 액화시켜 수송하고 있는 운송선은?","① LPG선      ② PCTC선         ③ OAO선      ④ LNG선","④","","","","",""],["236","선박에서 인간의 몸을 포함한 모든 동물들의 척추와 같은 역할을 하는 구조부재는?","① 선저 만곡부    ② 용골         ③ 늑골      ④ 플레어","②","","","","",""],["237","선박의 선저와 선측을 연결하는 곡선 부분으로 대개의 경우에 원형으로 구성되어 있는 것을 말하는 것은?","① 선저 만곡부(Bilge)                ② 용골(Keel)\n③ 늑판(Floor)                       ④ 외판 (Shell plating)","①","","","","",""],["238","다음 중 외판 철판의 투께를 포함한 선폭으로 주로 입거 시나 운하 통과 시에 이용되는 선폭은?","① 형폭(Moulded breadth)              ② 전폭(Extreme breadth) \n③ 형깊이((Moulded depth)             ④ 용골 깊이(Keel depth)","②","","","","",""],["239","우리나라의 선급에서는 배의 깊이를 용골의 상면에서 측정하는데 선박에서 가장 내측의 선을 무엇이라고 하는가?","① 형깊이((Moulded depth)                ② 용골 깊이(Keel depth)\n③ 형선 (Molding line)                    ④ 흘수(Draft)","③","","","","",""],["240","선박의 티핑센터가 배 길이의 중앙에 있는데 이는 평균흘수와 중앙 부흘수는 일치하나 약간의 차이를 보이고 있는데 그 이유로 적당하지 않은 것은?","① 선적화물 과 중령물 선적의 불균형의 요인\n② 밸러스트의 불균형 요인\n③ 선제 철판의 휨 현상의 요인\n④ 사용되는 미터식 표시법과 피트식 표시법의 차이현상","④","","","","ㅁ",""],["241","선박의 조정이나 선적량의 산출에서 사용하는 거리로 선박법상 그 표시를 규정하고 있는 것은?","① 형흘수 ((Moulded draft)                ② 용골 흘수 (Keel draft)\n③ 전부흘수(Fore draft)                   ④ 중앙부 흘수(Midship draft)","②","","","","",""],["242","선박의 안전을 확보하기 위해 선체 높이의 일정 부분이 물에 잠기지 않도록 하여 예비부력을 확보해야 하는 데 이를 무엇이라 하는가?","① 건현(Freeboard)           ② 만재 흘수선(Full load line)\n③ 횡경사(Heel)              ④ 전장(Length over al)","①","","","","",""],["243","다음은 만재 흘수선에 대한 설명으로 적절한 것은?","① 선박항해의 안전을 확보할 수 있는 상태에서 허락된 최대의 흘수를 말한다. \n② 선체 높이의 일정 부분이 물에 잠기지 않도록 하여 예비 부력을 확보하는 것을 말한다. \n③ 선체의 수면에 잠겨 있는 깊이를 용골에서 수면까지의 높이를 말한다. \n④ 안벽계류, 운하통과 및 입거 등 선박 조정에 필요한 선체의 최대 높이를 말한다. ","①","","","","",""],["244","다음에서 원양 및 근해 구역의 산박의 만재 흘수선에 대한 설명으로 옳지 않은 것은?","① 만재 흘수선 규정에 의해 원양 및 근해 구역을 항행 구역으로 하는 선막은 갑판선이다. \n② 길이 100m를 넘는 선박은 동기북대서양 만재 흘수선을 표시하지 아니한다. \n③ 갑판상에 목재를 운송하는 선박은 목재 만재 흘수선의 규정을 따로 받는다. \n④ 목재 만제 흘수선은 화물 자체가 부력을 갖기 때문에 일반 만재 흘수선보다 더 얕은 흘수를 허용하고 있다. ","④","","","","",""],["245","다음에서 만재 흘수선의 표시에 대한 설명으로 타당하지 않은 것은?","① 어두운 색의 선측에는 백색 또는 황색으로 선명하게 표시한다. \n② 폭 35mm의 선으로 영 현측에 표시한다.\n③ 갑판선, 원표 및 각 대역별 만재 흘수선을 표시하는 열쇠 모양의 표시 등의 세부분으로 구성되어 있다. \n④ 백색의 선측에는 흑색으로 선명하게 표시한다. ","②","","","","",""],["246","다음 중 일반 화물선에서의 횡경사는 무엇을 조정하므로써 바로 잡을 수 있는가?","① 중앙 흘수     ② 화물의 트리밍       ③ 윙 탱크의 밸러스트      ④ 플레어","③","","","","",""],["247","벌크화물의 만선 선적 시에 만재 흘수의 제한을 받으므로 횡경사가 잃어나지 않기 위해선 무엇을 해야하나?","① 횡경사는 윙 탱크의 밸러스트 조정하면 된다.  ② 횡경사의 각도를 높게 유지한다.\n③ 예비 부력을 확보하도록 한다.               ④ 선창 적재 화물의 트리밍을 잘한다. ","④","","","","",""],["248","대형 화물선이나 유조선 같이 액체화물을 적재하는 선박에 적합한 선박 구조 양식은?","① 종식 구조     ② 횡식 구조     ③ 혼합식 구조      ④ 늑골식 구조","①","","","","",""],["249","선박의 구조의 종식구조(Longitudinal system)의 장점으로 관계가 먼 것은?","① 종강도가 크다. \n② 구겅부제의 무게가 가벼워 선체의 중얄이 감소한다. \n③ 선창 내 구조가 복잡하여 건조작업이 쉽다. \n④ 선체의 중량이 감소하여 재화적재 중량이 늘어날 수 있다. ","③","","","","",""],["250","대부분의 중소형 화물선의 구조양식으로 채택하고 있는 것은?","① 종식 구조     ② 횡식 구조     ③ 혼합식 구조      ④ 늑골식 구조","②","","","","",""],["251","다음 중 산적 화물선의 선체 구조를 설명한 것으로 올바르지 않은 것은?","① 화물을 포장하지 않은 상태에서 적재하기 때문에 다른 선종에 비해 특별한 화물창 구조를 가지게 된다. \n② 화물의 선체 동요에 따라 이동하거나 무너지는 것을 방지하기 위해 밸러스트 탱크로 이용하고 있다. \n③ 화물을 양하 할 때 불도저와 같은 장비를 선창에 투입할 수 있도록 바닥에 돌기를 제공한다. \n④ 내저판의 양현 모서리에 약 45。각 도의 경사판을 붙여 이중저의 강도를 높일 수 있다. ","③","","","","",""],["252","산적 화물선은 건화물을 주로 운송하므로 산화물이 격벽 보장재에 쌓이지 않도록 무엇을 채용하고 있나?","① 하부 스톨    ② 선저 외판     ③ 상부스톨     ④ 파형격벽","④","","","","",""],["253","산적 화물선에서 산화물의 잔여물이 남지 않고 잘 흘러내리게 하기 위한 구조물은?","① 하부 스톨    ② 경사판        ③ 상부스톨     ④ 파형격벽","②","","","","",""],["254","대형 컨테이너선의 설계에 있어서 갑판 하 거덜(Deckgirder)를 설치하지 않는 경우가 많은데 그 이유로 적당한 것은?","① 대형 창구의 설치에 따른 비틀밍 강도의 약화을 방지하기 위하여\n② 화물을 싣기 위하여 우선적으로 최대한의 넓은 공간을 확보하기 위하여\n③ 화물의 적재 및 하역 등의 효율성을 높이기 위하여\n④ 둥금새와 보강판을 이용하여 응력 집중에 의한 균열발생을 방지하기 위하여","③","","","","",""],["255","대부분의 컨테이너 전용선의 상갑판은 두께가 두껍고 폭이 좁은 이유로 타당한 것은?","① 선체에서 가장 큰 응력이 발생하기 때문에\n② 상갑판 상에 하역장치가 없고 컨테이너를 높이 적재하기 때문에\n③ 화물의 충돌 및 기타 사고가 자주 발생하기 때문에\n④ 일반적으로 화물을 포장하지 않은 상태로 적재하기 때문에","②","","","","",""],["256","컨테이너선의 화물창의 격벽에 대한 설명으로 올바르지 않은 것은?","① 컨테이너 적재에 편리하도록 비수밀 격벽으로 나누어져 있다. \n② 사람이 오르 내릴 수 있는 플랫폼이 설치되어 있다. \n③ 수밀격벽은 선창의 구분뿐만 아니라 비틀림 강도 및 횡강도에 있어서 중요한 역할을 한다. \n④ 신체 중앙선에 대하여 하나 또는 대칭으로 2~3개가 설치된다. ","④","","","","",""],["257","컨테이너 전용선에 사용하는 창구덮개형식은 어떤형식을 채용하고 있는가?","① 폰툰(Ponton)형식    ② 구동(Rolling)형식       \n③ 접이(Folding)형식    ④ 싱글풀(Single pull)형식","①","","","","",""],["258","일반적으로 다목적 화물선이나 컨테이너선에는 창구덮개를 Ponton형식을 사용하는 이유로 적당한 것은?","① 나뉜 부분이 없이 한 몸체로 구성이 되어 튼튼하기 때문에\n② 길이가 폭에 비하여 길기 때문에\n③ 화물을 수평으로 격납하는 방식으로 요구되었기 때문에 \n④ 보냉과 기밀을 필요로 하는 중간 갑판의 창구 덮개가 필요하기 때문에","①","","","","",""],["259","컨테이너의 적양하의 편리와 이동방지를 위하여 수직으로 설치하는 것으로 컨테이너 전용선의 가장 큰 특징은?","① 셀 가이드 장치  ② 창구 덮개  ③ 창구 코밍   ④ 패드아이","①","","","","",""],["260","다음 중에 VLCC가 주로 운송하는 화물은?","① Gas oil    ② Crude oil     ③ Chemical oil    ④ Diesel oil","②","","","","",""],["261","다음 선박 중에서 가장 높은 안전 기준의 구조 및 설비를 필요로 하는 선박은?","① 유조선    ② 산물선   ③ 자동차 운반선   ④ 화객선","④","","","","",""],["262","다음 중에 컨테이너 화물을 운송하는 동일한 크기의 선박 중에서 가장 많은 화물을 적재할 수 있는 선박은?","① LOLO선    ② RORO선   ③ LASH선   ④ Barge선","①","","","","",""],["263","다음에서 선박의 길이를 나타내는 용어 중에 그 길이가 가장 긴 것은?","① 전장(LOA)    ② 등록장(RL)   ③ 수선간장(LBP)   ④ 수선장(LWL)","①","","","","",""],["264","다음에서 만재 흘수선에 대한 설명 중에 옳지 않은 것은?","① 갑판선의 상면은 건현 갑판의 상면과 일치시킨다. \n② 원표의 중심을 지나는 수평선은 하기 만재 흘수선과 일치한다. \n③ 만재 흘수선 원표에 표시하는 한국정부의 표시기호는 \"KR\"이다. \n④ 원표를 통과하는 수평선의 상면의 중앙점은 원표의 중심과 일치한다.  ","③","","","","",""],["265","일반 산물선에서 양 현측에 설치하는 현측 탱크에 대한 설명 중 옳지 않은 것은?","① 현측탱크내부에는 종강력을 위하여 선측 종늑골을 설치한다. \n② 현측 탱크 상부의 갑판은 종강도를 확보하기 위하여 종늑골 형식의 구조이다.\n③ 일반적으로 산적 화물의 정지 은 선박의 안전 운항을 위해 필요한 설비로 가는 통로에 적재한다. ","④","","","","",""],["279","특별한 위험성을 가지는 물질에 대한 특별요건을 규정한 기준에 해당되는 것은?","① IMO code     ② ISM code     ③ SOLAS     ④ IMDG code","①","","","","",""],["280","다음에서 화물의 틈에 관한 설명으로 올바른 것은?","① 화물의 종류에 관계없이 동일하다.\n② 선체 중앙부 적재 시 화물 틈이 선수부 적재보다 크다.\n③ 화물이 차지하는 용적 이외에 화물과 화물 사이의 빈 공간의 총용적을 말한다.\n④ 화물 이동을 방지하기 위한 더니지가 차지하는 공간은 화물 틈에서 제외된다.","③","","","","",""],["281","다음 중 화물의 규격화의 구분으로 적당하지 않은 것은?","① 팰릿화(Palletization)            ② LASH화(Lighter aboard ship handling)\n③ 패키지화(Package)             ④ 컨테이너화(Containerization)","③","","","","",""],["282","다음에서 팰릿화의 설명으로 올바르지 않은 것은?","① 하역의 능률을 높이기 위하여 사용한다.\n② 팰릿(Pallet) 위에 화물을 정해진 치수로 쌓은 후 팰릿과 화물을 함께 묶어서 규격화하는 방법\n③ 독립적으로 사용되기도 하지만 팰릿화한 상태로 컨테이너에 적입할 수 있다. \n④ 화물을 실은 부선(lighter)을 본선(ship)에 적재하여 컨테이너 하역 시설이 없는 항만에서 하역하는 방식이다. ","④","","","","",""],["283","다음 운송 중에는 일정시간마다 온도를 측정하여 적정온도를 유지해야하는 화물에 해당하는 것은?","① 냉장화물           ② 고가화물              ③ 생동식물 화물            ④ 중량화물","①","","","","",""],["284","적화계획 작성 시 화물의 적재 상태를 표시하기 위한 중요한 자료로 주로 선박의 각 구획을 세분화 한 도면을 무엇이라고 하는가?","① 화물 적재도           ② 로딩마스터             ③ 적화 용적도          ④ 하역순서도","③","","","","",""],["285","화물의 운송 중 화물 손상이 발생되지 않도록 적절하게 배치해야 하는데 적절한 화물배치에 위배되는 것은?","① 용적·중량의 두 가지 측면을 고려하여 화물을 구분하여 복원성, 트림에 미치는 영향을 염\n두에 두고 배치한다.\n② 귀중품 및 고가품은 별도의 장소에 보관하여 도난, 파손을 방지한다.\n③ 양화항의 순서를 고려하여 목적 항까지 가급적 화물을 옮겨 싣는 상황이 발생하지 않도록\n적재 장소를 선정한다.\n④ 하역 능률의 향상을 위하여 양화항 및 종류가 같은 대량의 화물은 가급적 하나의 선창에 집중시킨다. ","④","","","","",""],["286","다음은 고가화물에 대한 설명으로서 올바르지 않은 것은?","① 금괴, 보석, 귀금속, 화폐, 미술품, 정밀 기계 등 무게나 용적에 비하여 값이 비싼 화물을 말한다\n② 고가 화물 선적시에는 담당 사관이 직접 입회하여 포장과 봉인 상태를 검사하고, 선적 서류와 대조하여 확인해야 한다.\n③ 일반적으로 고가화물에 대한 운임은 화물의 중량이난 용적에 의한다.  \n④ 고가화물의 경우 시장 가격에 일정 비율로 부과한 종가운임(Ad valorem freight)제를 취한다. ","③","","","","",""],["287","다음에서 컨테이너화의 장점으로 적절한 것은?","① 화물을 양화한 후 빈 컨테이너를 반송하는데 비용과 시간이 소요된다.\n② 컨테이너는 자체가 별개의 독립된 창고 역할을 하므로 포장비, 창고비 등의 부대 비용이 절\n감된다.\n③ 컨테이너를 조작할 수 있는 하역 장비를 갖추지 못한 항만에서는 컨테이너 운송이 불가능\n하다.\n④ 컨테이너화에 의한 운송을 하기 위해서는 대규모의 투자가 필요하다.","②","","","","",""],["288","다음에서 컨테이너화의 이점으로 적절하지 못한 것은?","① 규격화된 컨테이너 사용과 하역의 기계화로 하역 시간이 단축됨에 따라 선박의 재항 시간\n이 줄어들어 선박의 회전율이 높아진다.\n② 운송 시간이 단축됨에 따라 재고 비용을 절감할 수 있다.\n③ 개개 화물의 조작은 컨테이너 적입시와 반출시 두 번만 이뤄지므로 화물 조작 횟수가 현저\n히 감소한다.\n④ 대형 장척 화물은 컨테이너를 이용하여 운송할 수 없다.","④","","","","",""],["289","다음 사항 중 항해중인 대형 선박의 복원력에 가장 큰 영향을 미치는 요소는?","① 바람     ② 청수사용량 변화      ③ 화물의 이동    ④ 연료유 사용량의 변화","④","","","","",""],["290","내구성이 좋고 제작비용이 비교적 싸서 세계적으로 유통되는 컨테이너는?","① 강재 컨테이너             ② 알루미늄 컨테이너\n③ FRP 컨테이너             ④ 스테인리스 강 컨테이너","①","","","","",""],["291","다음 중 수송비 절감을 위해 현재 가장 일반적으로 사용되고 있는 컨테이너의 규격은?","① 20ft             ② 25ft                ③ 40ft             ④ 30ft","③","","","","",""],["292","다음에서 입자나 가루된 화물을 운송하기 위한 컨테이너는?","① 드라이 컨테이너     ② 탱크 컨테이너        ③ 냉동 컨테이너      ④ 벌크 컨테이너","④","","","","",""],["293","다음에서 적화 계획을 위한 컴퓨터 프로그램인 로딩 마스터(loading master)로 구할 수 있는 일반적인 데이터로 관계가 없는 것은?","① GM, 흘수 및 트림              ② 호깅 또는 새깅\n③ 화물의 운임단가                ④ 전단력 곡선 및 휨 모멘트 곡선 등 선체 세로 강도 곡선","③","","","","",""],["294","다음 중 윗면이 개방되어 크레인으로 위에서 또는 문을 통해 화물을 적입할 수 있는 컨테이너는?","① 하드 탑 컨테이너(Hard top container)       ② 플랫 래크 컨테이너(Flat rack container)\n③ 오픈 톱 컨테이너(Open top container)       ④ 드라이 컨테이너(Dry container)","③","","","","",""],["295","20ft 컨테이너를 기준으로 2,000개(2,000TEU) 내외 컨테이너를 운송할 수 있는 선박은?","① 파나맥스(Panamax)                 ② 초대형 컨테이너선\n③ 포스트 파나맥스(Post Panamax)      ④ 핸디 사이즈(Handy size)","④","","","","",""],["296","컨테이너 선의 적부 계획을 수립하는데 가장 중요한 요소는? ","① 선박 운항의 안전성을 확보       ② 선박 운항의 항로성을 확보\n③ 선박 운항의 경제성을 확보       ④ 선박 운항의 편리성을 확보 ","①","","","","",""],["297","컨테이너선의 적부계획 수립 시 주안점으로 타당하지 않은 것은?","① 컨테이너선은 통상 갑판적을 하기 때문에 선체 중심이 높고 풍압 면적이 커서 충분한\nGM을 확보할 필요가 있다.\n② 냉동 컨테이너의 적부는 전원 공급 장치가 설치된 위치에 배치하여야 한다. \n③ 기항지의 순서, 양하지 서비스 및 하역 방법에 적합한 적부 계획을 수립한다.\n④ 하부에 실린 컨테이너에 상부에 실린 컨테이너의 중량이 과도하게 가해져야 선체의 횡동요를 막을 수 있다. ","④","","","","",""],["298","컨테이너 적부도 중 베이 플랜(Bay plan)에 기재되어야 할 정보로 필요 치 않은 것은?","① 각 컨테이너의 적부 위치       ② 선적항 및 양하항\n③ 컨테이너 화물의 적부 상태     ④ 특수화물의 보험 가입여부","④","","","","",""],["299","다음 중 생동식물화물 운송에 대한 설명으로 적합하지 않은 것은?","① 생동식물 화물(Livestock cargo)은 살아 있는 동물과 식물로 가축류, 어류, 조류, 각종 동물이다.\n② 가축과 같이 살아가는 동물의 운송에는가축 전용컨테이너(Livestock Container)를 이용한다. \n③ 생동식물 화물은 잘 관리 해야 하므로, 선원 거주 구역에서 가까운 곳에 적부한다.\n④ 생동식물은 일반적으로 상갑판의 통풍이 잘 되는 곳에 적재한다. ","③","","","","",""],["300","베이플랜에서 컨테이너 위치를 6자리의 숫자로 이루어진 셀넘버(cell number)로 구성되는 이때 맨 앞 두자리 숫자를 무엇이라고 하는가?","① 로우 넘버(Row no.)              ② 슬롯 넘버(Slot no.)\n③ 베이 넘버(Bay no.)               ④ 티어 넘버(Tier no.)","③","","","","",""],["301","다음에서 컨테이너에서 횡방향의 위치를 지정하는 번호를 말하는 것은?","① 로우 넘버(Row no.)              ② 슬롯 넘버(Slot no.)\n③ 베이 넘버(Bay no.)               ④ 티어 넘버(Tier no.)","②","","","","",""],["302","다음에서 선적항과 양화항을 편의상 베이플랜 약호로 사용하는데 잘못 기재 된 것은?","① PUSAN - PUS              ② OSAKA - OSK\n③ SIGAPORE - SIN           ④ TOKYO - JAN","④","","","","",""],["303","다음에서 일반적인 하역의 작업의 순서로 적절한 것은?","① 입항 및 하역 작업 준비 - 하역작업 - 하역 후 정리 작업 - 화물관리\n② 입항 및 하역 작업 준비 - 화물관리 - 하역작업 - 하역 후 정리작업\n③ 화물관리 - 입항 및 하역 작업 준비 - 하역작업 - 하역 후 정리 작업\n④ 입항 및 하역 작업 준비 - 하역작업 - 화물관리 - 하역 후 정리 작업","①","","","","",""],["304","다음 중 컨테이너 하역 시 주의사항으로 부 적절한 것은?","① 컨테이너 적부도를 참조하여 전체적인 하역 순서와 위험성 여부를 파악하여 두는 것이\n좋다.\n② 전반적인 작업의 진행 상황을 파악하여 컨테이너 적부도에 표시하여야 한다.\n③ 선체 횡경사가 심하면 하역이 불가능하므로, 횡경사(Heeling)가 5˚ 이상 생기지 않도록\n밸러스트로 조절해 주어야 한다.\n④ 선적 후 컨테이너의 래싱 작업은 중요하므로 현장에서 직접 확인하여야 한다.","③","","","","",""],["305","다음 중 래싱(Lashing)에 대한 설명으로 올바른 것은?","① 화물을 다른 화물로부터 보호하기 위한 보호재를 말한다. \n② 화물을 싣고 난 후 선체가 동요할 때 움직이지 않도록 화물을 묶는 것을 말한다. \n③ 화물을 동일한 장소에서 적재하지 않고 분리시키는 것을 말한다. \n④ 화물이 오손, 눌림, 마찰, 이동으로 인한 손상을 방지하기 위해 통풍을 용이하게 하는 것을 말한다. ","②","","","","",""],["306","다음은 컨테이너의 적부위치를 나타낸 6자리 숫자이다. \n예) 06 02 06\n  (가) (나) (다)\n(가)~(다)의 내용에 적합한 내용을 \u003c보기\u003e에서 골라 바르게 짝지은 것은?\n보기: ㄱ. 선저로 부터의 높이 ㄴ. 선체의 종방향 표시 ㄷ. 선체의 횡방향 표시","  (가) (나) (다)\n① ㄱ ㄴ ㄷ\n② ㄱ ㄷ ㄴ\n③ ㄴ ㄱ ㄷ\n④ ㄴ ㄷ ㄱ  ","④","","","","",""],["307","다음 중 위험 화물의 하역 시 주의해야할 사항으로 적당하지 않은 것은?","① 하역시 위험 화물에 충격을 주지 않게 하고, 와이어 슬링(Wire sling)이나 훅(Hook)의 사\n용을 피한다.\n② 화물의 용기나 포장이 파손된 것과 누설되고 있는 것 등은 선적하지 않는다.\n③ 하역이 일시 중단 할증료(Inflation Adjustment Factor)  ④  체선할증료(port congestion surcharge) ","①","","","","",""],["352","용선운송계약에서 계약 본인인 용선자는 청구된 수수료에 대해 제소의 의무를 지니게 되는 이유로 타당한 것은?","① 용선자가 운임 또는 용선료의 지불을 확보하기 때문이다. \n② 용선자가 상실시간에 대한 보상으로 체선료를 지불해야 하기 때문이다. \n③ 적하 및 양하 비용이 용선자 측에서 부담하기 때문이다. \n④ 법률상의 난점을 극복하기 위해 중개인이 실제의 본인의 이름을 차용하는 것이다. ","④","","","","",""],["353","다음은 양륙항 선택화물(Optional Cargo) 할증과 관계된 설명으로 잘못 된 것은?","① 화물 선적시에 양륙항이 지정되지 않고 출항 후에 화주가 가장 편리한 양륙지를 선적하여 그 항구에서 양륙하여 화물을 인도하는 경우임.\n② B/L의 양륙항 난에는 예컨대 \u0027London/Hamburg option\u0027 혹은 \u0027Pusan/Inchon option\u0027과 같이 두 개 이상의 항구가 명시됨. \n③ 송화인 또는 수화인은 본선의 선적지 출항 후 최초의 선택항 도착 전 일정일(보통 24시간 또는 48시간 전)까지 양륙항을 결정하여 그 항구에 있는 선박회사 대리점에 통고함.\n④ 중개인이 선택 지정하여 양륙·하도하는 화물을 Optional Cargo라고 함. ","④","","","","",""],["354","다음 중 해운동맹이 대향화물에 대해 요금을 별도로 정하지 않고 동맹가입선사가 임의로 적용하여 경쟁력을 높이기 위해 적용되는 운임은?","① 특별운임(special rate)    ② 경쟁운임(open rate)\n③ 접속운임(OCP Rate)     ④ 최저운임(minimum rate) ","②","","","","",""],["355","정기선의 운임이 liner terms로서 선적 및 양륙의 하역비를 선주가 부담해야 하는 이유로 타당한 것은?","① 화물이 많든 적든 적하품이 있든 없든 반드시 취항하기 때문이다. \n② 운송화물의 대상이 주로 소량의 일반화물이기 때문이다.\n③ 부정기선처럼 자유거래에 의하여 결정할 수 있기 때문이다. \n④ 다수의 화주로부터 소량화물을 인수하여 운송하고 운임도 공시된 운임표에 따르기 때문이다. ","④","","","","",""],["356","다음 통운임에 대한 설명으로 바람직하지 못한 것은?","① 운송구간의 기본운임에 접속지에서 도착지에 이르는 구간의 arbitrary를 가산한 것이다. \n② Arbitrary를 구성하는 내용은 일부 운송구간의 운임(local freight) 및 접속비용과의 합계이다.\n③ 접속비용은 접속을 위한 선적, 양륙비, 접속선 대기를 위한 창고료 등이 있다. \n④ 예정 기항지 이외에 적하 혹은 양하를 위해서 기항을 하는 화물에 대해서는 특별한 운임부가율이  설정된 경우이다. ","④","","","","",""],["357","다음 중 북미수출의 경우 도착항에서의 하역 및 터미널 작업비용을 해상운임과는 별도로 징수하는 부대비용은?","① 부두사용료               ② 터미널화물처리비\n③ 도착지화물인도비용       ④ 컨테이너세","③","","","","",""],["358","용선계약시에는 선하증권 국제통일조약을 적용하지 않기 때문에 공공의 질서를 해치지 않는 한 그 범위는 제한이 없으나, 제외조항이 있는데 이에 해당되지 않는 경우는?","① 선원의 선행(good deeds)                 ② 나포·포획(capture and seizure)\n③ 관청의 강제관리(restraint of princes)      ④ 국적(king\u0027s enemies)","①","","","","",""],["359","미국항로에 취항하는 선사들에게 Tariff에 신고된 운임률이나 기타 조건에 관계없이 독자적인 운임률을 설정할 수 있도록 허용한 운임제도는?","① 우대운송계약(Service Contract)               ② 독자운임결정권(Independent Action) \n③ 기간별 물량별 운임(Time Volume Rate)       ④ 지역운임(local freight) ","②","","","","",""],["360","다음에서 우대운송계약(Service Contract)에 포함되어 있지 않은 내용은?","① 계약기간       ② 최저물량       ③ 계약운임       ④ 중개수수료","④","","","","",""],["361","다음 중 해상운임의 표시통화에 대한 설명으로 적절하지 않은 것은?","① 운임률을 표시하는 통화의 종류를 운임의 표시 통화(지급통화)라 한다.\n② 우리 나라를 중심으로 하는 정기선(liner)항로에 있어서는 운임을 거의 미국 통화(U.S. Dollar)와 영국 통화(Sterling Pound)로 표시되어 있다.\n③ 운임률(tariff)는 해운동맹에 의해 결정하기 때문에 표시통화는 US Dollar만으로 사용한다. \n④ 정기선의 경우 반드시 B/L면에 운임표시통화를 명시하고 있다. ","③","","","","",""],["362","정기선에 의한 개품운송에 있어서는 선불이 원칙이지만 어떤 경우에 후불이 가능한가?","① CIF나 CFR계약의 경우 \n② 선박회사의 승인이 있는 경우\n③ 화주가 고의로 화물의 내용, 가격 또는 중량에 관하여 허위신고를 한 경우. \n④ 선적할 때 지정 검량인(sworn measurer)에게 검량을 시키는 경우","②","","","","",""],["363","용선계약상의 선박을 다시 제3자에게 용선하는 경우의 허가 및 조건을 나타내는 조항은?","① 중재조항        ② 공동해손조항     ③ 이로          ④ 재용선","④","","","","",""],["364","다음 중 가장 오래된 역사를 지닌 CALCUTTA 해운동맹의 항로는??","① 영국·인도항로    ② 구주/호주 항로      ③ 극동/미태평양 항로       ④ 극동/미대서양 항로 ","①","","","","",""],["365","다음에서 정기선 운송의 의의에 대해서 잘못 서술하고 있는 것은?","① 정기선항로에 취항하고 있는 선박을 말한다.\n② 컨테이너 화물 전용의 컨테이너선과 재래선으로 분류한다. \n③ 정해진 기항항 사이를 정해진 운항일정에 따라 항해하고 있다.\n④ 산화물을 운송하는 의미로 통상 사용되고 있다. ","④","","","","",""],["366","다음에서 폐쇄식 동맹(Closed conference)를 잘못 설명하고 있는 것은?","① 신규가입을 극단으로 제한하는 형태로서 영국식 동맹이라고 부른다. \n② 동맹이 승인할 만한 일정자격과 실적을 갖고 있지 않는 선박회사는 가입시키지 않는 방식이다.\n③ 그 항로에 배선하는 의지 및 능력이 있는 선주면 언제라도 자유로이 가입시키는 형태로 미국식 해운동맹이라고 한다. \n④ 구주항로나 호주항로 등에 결성되어 있다. ","③","","","","",""],["367","다음 중 해운동맹의 내부규제에 해당되는 사항으로 거리가 먼 것은?","① 운임협정(rate agreement)          ② 독자운임결정권(Independent Action) \n③ 배선협정(sailing agreement)        ④  공동계산협정(pooling agreement) ","②","","","","",""],["368","다음 해운동맹의 내부규제인 배선협정에 대한 설명으로 관계가 없는 것은?","① 특정의 항로에 있어서 배선선복량을 조절·제한하고 선복과잉에 의한 과당경쟁을 방지하려는 것이다. \n② 일정한 항로에 있어서 항해수, 기항지, 운항 schedule 등을 규제한다. \n③ 생산업자간의 수량 카르텔에 해당된다.\n④ 각 항로 사정에 따라 이 중 하나 또는 둘 이상을 개별적으로 분리시켜 실시하고 있다","④","","","","",""],["369","용선운송계약의 공동해손 조항은 1974년 무슨 규칙에 의해 처리하는 취지의 조항인가?","① The New York Produce Exchange Charter양식   ② Australian Grain Charter 서식 \n③ York-Antwerp규칙      ④ Baltic and International Maritime council uniform Time-Charter양식","③","","","","",""],["370","다음에서 계약운임제(contract rate system)에 대한 설명으로 올바른 것은?","① 운임연환불제와는 달리 유보기간은 없이 일정기간 경과 후에 그 환불금을 전액 한 번에 지급한다.\n② 환불에 있어서 그 기간에 이어 계속해서 일정기간 동맹선에만 선적할 것을 조건으로 하여 그 계속되는 일정기간이 경과된 후 환불되는 제도이다. \n③ 동맹의 표정운임률에 계약운임률(contract rate)과 비계약운임률(non-contract rate)을 설정하여 화주가 동맹선에만 선적할 것을 계약하면 운임률을 낮게 적용하고 그렇지 않으면 고율의 운임을 적용하는 방식이다. \n④ 각 동맹선사들이 일정기간 벌어들인 운임을 사전에 정한 배분율에 따라 배분하는 방법이다. ","③","","","","",""],["371","다음은 국적선 이용제도의 의의에 대한 설명으로 타당하지 않은 것은?","① 해운산업육성법 제16조에 의거하여 선박을 이용하여 대통령령이 정하는 주요 화물(지정화물)을 운송하고자 하는 자는 국적선을 이용하여야 하는 제도를 말한다. \n② 우리 나라의 정기선 취항지역에 화물을 운송하고자 하는 자는 국적선을 이용하여야 하는 제도를 말한다.\n③ 장기적이고 안정적인 운송체제의 확립 및 외화유출방지를 위해 국적선을 이용하여야 한다는 취지를 담고 있다. \n④ 정기선화물은 국적선 불취항증명서(waiver), 지정화물은 국적선 운송면제확인을 받지 않아도 외국선박을 이용할 수 있다","④","","","","",""],["372","다음에서 해운동맹의 단점으로 적합한 것은?","① 안정적 자본투자로 서비스의 개선을 촉진한다.\n② 합리적 배선으로 경쟁에 의한 낭비를 방지하고 원가를 절감한다.\n③ 운임률이 원가보다 동맹의 정책에 좌우되어 불합리하게 책정된다. \n④ 동맹의 가입을 통해 영세선사도 생존 가능하다. ","③","","","","",""],["373","다음 중 용선료의 의미로 적당하지 않은 것은?","① 운송행위의 보수 선적량 또는 총액운임    ② 운송행위 능력에 관한 보수기간 운임\n③ 운송수단인 선박의 임차료               ④ 선주와 용선자간의 경비","④","","","","",""],["374","다음에서 해운동맹에 가입되었을 경우 이점을 적절하게 설명한 것은?","① 독점성으로 인해 과대이윤, 서비스의 저하, 클레임의 회피, 보복적 차별우대 등이 있을 수 있다. \n② 발착일이 정확, 자주, 규칙적이며 운송기간이 확정되어 있어 무역거래에 편리하다. \n③ 기항수를 가급적 줄이려는 경향이 강해 화주들에게 불편을 준다. \n④ 운임환불제, 계약운임제 등이 모두 선사의 일방적 통제하에 이루어진다. ","②","","","","",""],["375","다음 중 선박회사 또는 해운동맹이 일정기간 동안 일정하게 정해진 품목을 선적한다는 조건부로 화주에게 할인혜택을 주는 운임은?","① 우대운송계약(Service Contract)               ② 독자운임결정권(Independent Action) \n③ 기간별 물량별 운임(Time Volume Rate)       ④ 지역운임(local freight) ","③","","","","",""],["376","화주가 선사에 제출하는 운송의뢰서(application for shipment)로서, 화물의 명세가 기재되는 정기선 운송에 있어서 주요한 서류는?","① Shipping Request(S/R ; 선복요청서)        ② Booking Note(선적예약서)\n③ Booking List(예약일람표)           ④ Equipment Receipt(E/R ; 기기수도증) ","①","","","","",""],["377","다음 중 항해용선계약에서의 용선자의 책임제한 조항의 의미는?","① 용선자가 화물을 적재하고 비용을 지불하면 그 책임을 면한다는 뜻이다. \n② 용선계약 불이행의 경우에 지불하여야 할 손해배상예정액을 의마한다.\n③ 용선자는 청구된 수수료에 대해 제소의 의무에 대한 뜻이다.\n④ 인명과 재산의 구조 또는 salvage를 위하여 이로할 것을 허용하거나 거부한다는 의미이다.","①","","","","",""],["378","다음 컨테이너 내적치도(Container load plan)은 컨테이너 적입된 화물의 명세로 작성할 수 있는 자가 아닌 사람은?","① 화주 또는 포워드        ② 선주\n③ 검수인                  ④ CFS Operator","②","","","","",""],["379","세관에 대한 반출입신고서, CFS/CY간 화물인수도의 증거, 본선내 법정보존서류, 양륙지에서 보세운송신고서 및 적출작업(devanning) 자료로 사용되는 정기선의 주요 서류는? ","①  Shipping Order(S/O ; 선적지시서)             ② Dock Receipt(D/R ; 부두수취증) \n③ Container Load Plan(CLP ; 컨테이너 내적치도) ④ Mate\u0027s Receipt(M/R ; 본선수취증) ","③","","","","",""],["380","다음 중 본선수취증에 대한 설명으로 해당되지 않은 내용은?","① 본선이 M/R에 기재된 상태로 화물을 수취하였음을 인정하는 영수증이다. \n② 선적요청을 받은 선사(또는 대리점)가 송화인에게 교부하는 선적승낙서이다.\n③ M/R은 본선과 송화인간에 화물의 수도가 이루어진 사실을 증명하는 것이다. \n④ 선적완료 후 검수집계표(outturn report)에 근거하여 일등항해사(chief mate)가 선적화물과 선적지시서(S/O)를 대조, 송화인(shipper)에게 교부한다. ","②","","","","",""],["381","다음 중 해운산업육성법에 근거한 주요 정책화물로 해당되지 않는 것은?","① 원유          ② 제철원료     ③ 액화가스류         ④ 의료제품류","④","","","","",""],["382","하역중인 화물의 개수, 화인, 포장상태, 화물사고 등을 기재하는 검수화물목록은 누가 작성하는 가?","① 화주          ② 선주      ③ 검수인         ④ 포워더","③","","","","",""],["383","다음 중 양륙지의 세관 등에 제출하는 중요한 서류이므로 각국의 규정·관습 등을 충분히 숙지할 필요한 주요 서류는?","① Delivery Order(D/O ; 인도지시서)           ② Manifest(M/F ; 적하목록) \n③ Mate\u0027s Receipt(M/R ; 본선수취증)           ④ Shipping Order(S/O ; 선적지시서) ","②","","","","",""],["384","다음 정기용선계약의 특별조항애서 보통 break down clause라 불리워지는 것으로 선박의 사고로 인해 운항불능이 되었을 경우 용선료를 조정한다고 하는 취지의 규정은?","① 연료 및 항비의 부담에 관한 조항           ② 선박상실에 의한 과불금 및 용선료의 반환  \n③ off hire조항                               ④ 배선명령에 대한 용선자의 책임  ","③","","","","",""],["385","다음 중 용선자가 선주를 대신해서 선원의 교체를 요구하는 규정은?","① 배선명령에 대한 용선자의 책임               ② 선박상실에 의한 과불금 및 용선료의 반환  \n③ 선장 및 기관장에 대한 용선자의 해임청구권   ④ 배선명령에 대한 용선자의 책임  ","③","","","","",""],["386","다음에서 선박의 인도 및 반환시에 남아있는 기름은 각각 상대방에게 시가로 인계 인수하여야 한다는 규정은?","① 잔유           ② 입거            ③ off hire조항        ④ 선하증권","①","","","","",""],["387","다음의 선박 중 일반화물선으로 컨테이너를 운송할 수 있는 구조를 갖지 않은 선박은?","① 재래화물선(conventional ship)                ② 세미컨테이너선(semi-container ship) \n③ RO/RO선(Roll on/Roll off Vessel)            ④ 다목적선(multi-purpose ship) ","①","","","","",""],["388","다음에서 계약당사자의 명칭으로 잘못 짝지어진 것은?","① 용선자 - Charterer  ② 선주 - Owner    ③ 화주 - Forwarder    ④ 선박경영자 - Operator","③","","","","",""],["389","다음에서 부정기선 운임에 대한 종류로서  해당되지 않는 것은?","① 용적을 단위로 하는 화물운임             ② 화물이 고가인 경우에는 종가운임제   \n③ 중량을 단위로 하는 화물운임             ④ 화물이 저가인 경우에는 최저운임제","④","","","","",""],["390","다음 운임 지불방법 중 선불인 경우에 해당되는 경우는?","① 착불(payable on arrival destination)     ② 양하완료시불(payable on completion of discharging) \n③  B/L 발행시불(payable on signing of B/L) ④ 비례운임(pro rate freight) ","③","","","","",""],["391","다음에서 당해 항구의 관습적 하역방법 및 하역능력에 따라 할 수 있는 한 빨리 적양 하역을 하는 조건을 말하는 것은?","① 관습적 조속하역조건     ② 연속작업일조건 \n③ 호천작업일조건          ④ 공휴일작업조건","①","","","","",""],["392","다음은 호천작업일조건(Weather Working Days)에 관한 설명으로 관계가 먼 것은?","① 기상조건이 하역 가능한 상태의 날만 정박기일에 산입하는 것으로 현재 가장 많이 택하고 있는 조건이다. \n② 공휴일은 원래 근로일이 아니므로 하역을 하더라도 보통 정박일수에 산입하지 않는다. 이것을 \"Sunday and holidays excepted\"의 첫글자를 따라 SHEX라고 한다.\n③ 우천, 파업 및 기타 불가항력 등 어떠한 원인에도 관계없이 하역개시 이후 종료시까지의 일수는 모두 정박기간에 계산하는 방법이다.\n④ 어떠한 기상이 하역 가능한 상태인가 하는 것은 화물의 종류에 따라 많은 차이가 있으므로 이러한 문제를 해결하는 방법으로 선장과 화주가 그 때마다 합의 결정하는 것이 현명한 방법이다","③","","","","",""],["393","다음은 해약기일에 대한 설명으로 적합하지 않은 내용은?","① 해약기일(cancelling date)을 약정하여 해약기일이 넘으면 화주는 해약권을 발동할 수 있다.\n② 해약기일은 C/P면에 기재되며\n③ 해약기일이 도래하더라도 선박의 운항이 일기나 고장수리 등으로 방해를 받는 수가 많기 때문에 Gencon Form에서는 입항하기 48시간 전에 화주에게 통고해야 한다.\n④ 해약기일은 본선 사정상 예정일로부터 대개 30일 정도 여유를 두는 것이 보통이다.","④","","","","",""],["394","다음의 Gencon Form의 해약조항에 대한 설명으로 관계가 없는 것은?","① 본선이 지정된 월일에 선적준비를 정돈하지 못하면 용선자에게 본 계약을 해제할 수 있는 선택권을 주고 있다.\n②  본선이 해손으로 지연되는 경우는 가급적 신속히 용선자에게 통고하되 적재준비정돈예정일을 10일 이상 초과할 때는 용선자는 계약의 해제선택권을 갖게 된다. \n③ 선택권은 요청이 있을 때 본선 선적예정일의 최소 1일 이전에 통고해야 한다.\n④ 용선자의 계약의 해제선택권의 적용은 해약기일을 약정할 때에 한한다. ","③","","","","",""],["395","다음에서 초과정박일
